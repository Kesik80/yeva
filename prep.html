<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Подготовка раскрасок — YEVA</title>
<meta name="theme-color" content="#EEF3FA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:'Fredoka',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
    background:linear-gradient(180deg,#EDF3FA 0%,#F8FBFE 100%);
    color:#1E3D57;line-height:1.45;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 12px calc(env(safe-area-inset-bottom,0px) + 30px);
    -webkit-user-select:none;user-select:none;
  }
  .wrap{max-width:640px;margin:0 auto}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  h1{font-size:19px;font-weight:600;flex:1}
  .back{font-size:13.5px;color:#2F8FC4;text-decoration:none}
  .card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 4px 16px rgba(30,61,87,.07)}
  label{display:block;font-size:12px;font-weight:600;color:#5B7A93;margin-bottom:5px}
  input[type=text]{width:100%;padding:11px 13px;font-size:16px;font-family:inherit;color:#1E3D57;
    border:1.5px solid #D9E4EE;border-radius:11px;background:#FBFDFF;outline:none}
  input[type=range]{width:100%;height:26px;accent-color:#2F8FC4}
  input[type=file]{display:none}
  .drop{display:block;border:2px dashed #C6D6E4;border-radius:14px;padding:22px 12px;text-align:center;
    color:#5B7A93;font-size:14px;cursor:pointer;background:#FBFDFF}
  button{width:100%;padding:12px;font-size:15px;font-weight:600;font-family:inherit;border:0;border-radius:12px;
    background:#2F8FC4;color:#fff;cursor:pointer;margin-top:10px}
  button.ghost{background:#E9F2F9;color:#2C6E96}
  button.go{background:#1F9B6E}
  button:disabled{background:#BCCDDA}
  .row{display:flex;gap:9px}
  .row>*{flex:1}
  .val{color:#2F8FC4;font-variant-numeric:tabular-nums}
  .hint{font-weight:500;color:#93A8BA;font-size:11.5px}

  .viewport{overflow:hidden;border-radius:12px;border:1px solid #E6EDF4;background:#fff;
    display:grid;place-items:center;max-height:62vh}
  canvas{max-width:100%;display:block;touch-action:none;transform-origin:center center;will-change:transform}

  .bar{display:flex;gap:7px;margin-bottom:9px;overflow-x:auto}
  .bar button{margin:0;padding:9px 11px;font-size:13px;background:#EDF3FA;color:#5B7A93;width:auto;flex:none;white-space:nowrap}
  .bar button.on{background:#2F8FC4;color:#fff}
  .zoombar{display:flex;gap:7px;margin-top:9px}
  .zoombar button{margin:0;padding:9px;font-size:15px;background:#EDF3FA;color:#2C6E96}

  .log{margin-top:10px;font-size:12.5px;color:#5B7A93;max-height:110px;overflow:auto}
  .ok{color:#1F8A5F}.err{color:#C0392B}
  .swatches{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px}
  .sw{width:38px;height:38px;flex:none;border-radius:12px;border:3px solid transparent;padding:0;margin:0}
  .sw.on{border-color:#1E3D57}
  code{background:#EDF3FA;padding:1px 5px;border-radius:5px;font-size:12px}

  .lock{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:20px;background:rgba(20,45,70,.6)}
  .lock.show{display:grid}
  .lockbox{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:360px;text-align:center}
  .lockbox h3{font-size:17px;margin-bottom:12px}
  .lockbox input{width:100%;padding:11px;border:1.5px solid #D9E4EE;border-radius:11px;text-align:center;
    font-size:16px;font-family:inherit;letter-spacing:.1em}
  .lockmsg{font-size:13px;min-height:18px;margin-top:8px;color:#C0392B}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Подготовка раскрасок</h1>
    <a class="back" href="voicegen.html">голоса</a>
    <a class="back" href="index.html">← домой</a>
  </div>

  <div class="card">
    <label class="drop" for="f">Выбери фото или картинку<br><span class="hint">JPG, PNG, SVG — что угодно</span>
      <input type="file" id="f" accept="image/*,.svg">
    </label>
  </div>

  <div class="card" id="work" style="display:none">
    <div class="bar">
      <button id="tRes" class="on">результат</button>
      <button id="tOrig">исходник</button>
      <button id="tMove">двигать</button>
      <button id="tPen">рисовать</button>
      <button id="tEr">ластик</button>
      <button id="tFill">заливка</button>
    </div>

    <div class="viewport" id="vp"><canvas id="cv"></canvas></div>

    <div class="swatches" id="sw" style="display:none"></div>

    <div class="zoombar">
      <button id="zOut">−</button>
      <button id="zFit">1:1</button>
      <button id="zIn">+</button>
      <button id="undo" style="flex:2">отменить</button>
    </div>

    <div id="brushBox" style="display:none">
      <label style="margin-top:12px">Толщина кисти <b class="val" id="vBr"></b> <span class="hint">и для рисования, и для ластика</span></label>
      <input type="range" id="br" min="1" max="30" step="1" value="6">
    </div>

    <label style="margin-top:12px">Порог чёрного <b class="val" id="vThr"></b> <span class="hint">выше — линий больше</span></label>
    <input type="range" id="thr" min="80" max="220" step="5" value="150">

    <label>Убрать крапинки <b class="val" id="vDes"></b></label>
    <input type="range" id="des" min="0" max="3" step="1" value="1">

    <label>Заделать щели <b class="val" id="vGap"></b> <span class="hint">чтобы краска не вытекала</span></label>
    <input type="range" id="gap" min="0" max="3" step="1" value="1">

    <label>Толщина линий <b class="val" id="vFat"></b></label>
    <input type="range" id="fat" min="0" max="2" step="1" value="0">

    <button class="ghost" id="auto">подобрать само</button>
    <div id="stat" class="log"></div>
  </div>

  <div class="card" id="save" style="display:none">
    <label for="nm">Имя файла <span class="hint">станет подписью в игре</span></label>
    <input type="text" id="nm" placeholder="blume">
    <button class="go" id="up">Загрузить на GitHub</button>
    <button class="ghost" id="dl">Скачать на телефон</button>
    <div id="log" class="log"></div>
  </div>
</div>

<div class="lock" id="lock">
  <div class="lockbox">
    <h3>Пароль для записи</h3>
    <input id="pw" type="password" autocomplete="off" placeholder="ADMIN_TOKEN">
    <button id="ok">Войти и загрузить</button>
    <button class="ghost" id="cancel">Отмена</button>
    <div class="lockmsg" id="lockMsg"></div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const REPO_DIR = 'malen';
  const MAXW = 1400;

  const cv = $('cv');
  const ctx = cv.getContext('2d', { willReadFrequently: true });

  let orig = null, oW = 0, oH = 0;
  let baseMask = null;     // результат порога и морфологии
  let manual = null;       // ручные правки: 1 — чёрное, 2 — белое
  let out = null;          // готовая картинка
  let testData = null;
  let mode = 'res', fileBase = '';
  const undoStack = [];

  const log = (m, cls) => {
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = m;
    $('log').prepend(d);
  };

  /* ── загрузка ── */
  $('f').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    fileBase = file.name.replace(/\.[^.]+$/, '').replace(/[^a-zA-Z0-9._-]+/g, '-').toLowerCase();
    $('nm').value = fileBase;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, MAXW / Math.max(img.width, img.height));
      oW = Math.max(1, Math.round(img.width * k));
      oH = Math.max(1, Math.round(img.height * k));
      cv.width = oW; cv.height = oH;
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, oW, oH);
      ctx.drawImage(img, 0, 0, oW, oH);
      orig = ctx.getImageData(0, 0, oW, oH);
      manual = new Uint8Array(oW * oH);
      undoStack.length = 0;
      URL.revokeObjectURL(url);
      $('work').style.display = 'block';
      $('save').style.display = 'block';
      zoom.scale = 1; zoom.tx = 0; zoom.ty = 0; applyZoom();
      autoTune();
    };
    img.onerror = () => alert('не удалось открыть картинку');
    img.src = url;
    e.target.value = '';
  });

  /* ── обработка ── */
  const idx = (x, y) => y * oW + x;
  function nb(m, p) {
    const x = p % oW, y = (p - x) / oW;
    let c = 0;
    if (x > 0 && m[p - 1]) c++;
    if (x < oW - 1 && m[p + 1]) c++;
    if (y > 0 && m[p - oW]) c++;
    if (y < oH - 1 && m[p + oW]) c++;
    return c;
  }
  const despeckle = m => { const r = new Uint8Array(m); for (let p = 0; p < m.length; p++) if (m[p] && nb(m, p) <= 1) r[p] = 0; return r; };
  const dilate = m => { const r = new Uint8Array(m); for (let p = 0; p < m.length; p++) if (!m[p] && nb(m, p) >= 1) r[p] = 1; return r; };
  const erode = m => { const r = new Uint8Array(m); for (let p = 0; p < m.length; p++) if (m[p] && nb(m, p) <= 2) r[p] = 0; return r; };

  function process() {
    if (!orig) return;
    const thr = +$('thr').value, des = +$('des').value, g = +$('gap').value, fat = +$('fat').value;
    const src = orig.data, n = oW * oH;
    let m = new Uint8Array(n);
    for (let p = 0; p < n; p++) {
      const i = p * 4;
      if (src[i + 3] < 32) { m[p] = 0; continue; }
      m[p] = (0.2126 * src[i] + 0.7152 * src[i + 1] + 0.0722 * src[i + 2]) < thr ? 1 : 0;
    }
    for (let k = 0; k < des; k++) m = despeckle(m);
    for (let k = 0; k < g; k++) m = dilate(m);
    for (let k = 0; k < g; k++) m = erode(m);
    for (let k = 0; k < fat; k++) m = dilate(m);
    baseMask = m;
    compose();
  }

  // ручные правки поверх обработки — поэтому ползунки не стирают нарисованное
  function compose() {
    if (!baseMask) return;
    const n = oW * oH;
    const img = ctx.createImageData(oW, oH);
    const d = img.data;
    let dark = 0;
    for (let p = 0; p < n; p++) {
      let black = baseMask[p];
      if (manual[p] === 1) black = 1;
      else if (manual[p] === 2) black = 0;
      if (black) dark++;
      const v = black ? 0 : 255, i = p * 4;
      d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
    }
    out = img;
    testData = null;
    if (mode !== 'orig') draw();
    $('stat').textContent = 'линий: ' + (dark / n * 100).toFixed(1) + '% холста · ' + oW + '×' + oH +
      ' · масштаб ' + zoom.scale.toFixed(1) + '×';
  }

  function autoTune() {
    // порог ищем по доле чёрного, а заодно ставим разумные крапинки и щели
    let best = 150, bestScore = 1e9, n = oW * oH;
    for (let t = 90; t <= 210; t += 10) {
      let dark = 0;
      for (let p = 0; p < n; p++) {
        const i = p * 4;
        if ((0.2126 * orig.data[i] + 0.7152 * orig.data[i + 1] + 0.0722 * orig.data[i + 2]) < t) dark++;
      }
      const score = Math.abs(dark / n - 0.08);
      if (score < bestScore) { bestScore = score; best = t; }
    }
    $('thr').value = best;
    // фотографии шумят сильнее рисунков — смотрим на разброс яркости
    let noisy = 0;
    for (let p = 0; p < n; p += 7) {
      const i = p * 4;
      const lum = 0.2126 * orig.data[i] + 0.7152 * orig.data[i + 1] + 0.0722 * orig.data[i + 2];
      if (lum > 60 && lum < 200) noisy++;
    }
    const grey = noisy / (n / 7);
    $('des').value = grey > 0.18 ? 2 : 1;
    $('gap').value = grey > 0.18 ? 2 : 1;
    $('fat').value = 0;
    showVals();
    pushUndo();
    process();
    log('подобрано: порог ' + best + ', крапинки ' + $('des').value + ', щели ' + $('gap').value, 'ok');
  }
  $('auto').addEventListener('click', autoTune);

  /* ── отмена ── */
  function pushUndo() {
    undoStack.push({
      manual: new Uint8Array(manual),
      thr: $('thr').value, des: $('des').value, gap: $('gap').value, fat: $('fat').value
    });
    if (undoStack.length > 20) undoStack.shift();
  }
  $('undo').addEventListener('click', () => {
    if (!undoStack.length) { log('отменять нечего'); return; }
    const s = undoStack.pop();
    manual = new Uint8Array(s.manual);
    $('thr').value = s.thr; $('des').value = s.des; $('gap').value = s.gap; $('fat').value = s.fat;
    showVals();
    process();
  });

  ['thr', 'des', 'gap', 'fat'].forEach(id => {
    $(id).addEventListener('input', () => { showVals(); process(); });
    $(id).addEventListener('change', pushUndo);       // шаг отмены на отпускание ползунка
  });
  $('br').addEventListener('input', () => { $('vBr').textContent = $('br').value; });
  function showVals() {
    $('vThr').textContent = $('thr').value;
    $('vDes').textContent = $('des').value;
    $('vGap').textContent = $('gap').value;
    $('vFat').textContent = $('fat').value;
    $('vBr').textContent = $('br').value;
  }
  showVals();

  /* ── режимы ── */
  function setMode(m) {
    mode = m;
    [['tRes', 'res'], ['tOrig', 'orig'], ['tMove', 'move'], ['tPen', 'pen'], ['tEr', 'er'], ['tFill', 'fill']]
      .forEach(([id, v]) => $(id).className = (m === v ? 'on' : ''));
    $('brushBox').style.display = (m === 'pen' || m === 'er') ? 'block' : 'none';
    $('sw').style.display = m === 'fill' ? 'flex' : 'none';
    if (m === 'fill' && !testData) testData = new ImageData(new Uint8ClampedArray(out.data), oW, oH);
    draw();
  }
  [['tRes', 'res'], ['tOrig', 'orig'], ['tMove', 'move'], ['tPen', 'pen'], ['tEr', 'er'], ['tFill', 'fill']]
    .forEach(([id, v]) => $(id).addEventListener('click', () => setMode(v)));

  function draw() {
    if (mode === 'orig' && orig) ctx.putImageData(orig, 0, 0);
    else if (mode === 'fill' && testData) ctx.putImageData(testData, 0, 0);
    else if (out) ctx.putImageData(out, 0, 0);
  }

  /* ── масштаб ── */
  const zoom = { scale: 1, tx: 0, ty: 0 };
  function applyZoom() {
    const maxX = Math.max(0, (cv.clientWidth * zoom.scale - cv.clientWidth) / 2) + 40;
    const maxY = Math.max(0, (cv.clientHeight * zoom.scale - cv.clientHeight) / 2) + 40;
    zoom.tx = Math.max(-maxX, Math.min(maxX, zoom.tx));
    zoom.ty = Math.max(-maxY, Math.min(maxY, zoom.ty));
    cv.style.transform = 'translate(' + zoom.tx.toFixed(1) + 'px,' + zoom.ty.toFixed(1) + 'px) scale(' + zoom.scale.toFixed(3) + ')';
  }
  $('zIn').onclick = () => { zoom.scale = Math.min(8, zoom.scale * 1.5); applyZoom(); };
  $('zOut').onclick = () => { zoom.scale = Math.max(1, zoom.scale / 1.5); if (zoom.scale === 1) { zoom.tx = 0; zoom.ty = 0; } applyZoom(); };
  $('zFit').onclick = () => { zoom.scale = 1; zoom.tx = 0; zoom.ty = 0; applyZoom(); };

  /* ── жесты: рисование, ластик, перетаскивание, щипок ── */
  const pts = new Map();
  let pinchDist = 0, pinchScale = 1, pinchMid = null, didPinch = false;
  let stroking = false, last = null, drew = false;

  const toImg = (clientX, clientY) => {
    const r = cv.getBoundingClientRect();
    return {
      x: Math.floor((clientX - r.left) * oW / r.width),
      y: Math.floor((clientY - r.top) * oH / r.height)
    };
  };

  function paintAt(x, y, val) {
    const rad = Math.max(1, Math.round(+$('br').value / 2));
    for (let dy = -rad; dy <= rad; dy++) {
      for (let dx = -rad; dx <= rad; dx++) {
        if (dx * dx + dy * dy > rad * rad) continue;
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= oW || ny >= oH) continue;
        manual[idx(nx, ny)] = val;
      }
    }
  }
  function line(a, b, val) {
    const dx = Math.abs(b.x - a.x), dy = Math.abs(b.y - a.y);
    const steps = Math.max(dx, dy, 1);
    for (let i = 0; i <= steps; i++) {
      paintAt(Math.round(a.x + (b.x - a.x) * i / steps), Math.round(a.y + (b.y - a.y) * i / steps), val);
    }
  }

  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: 0 });
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
      pinchScale = zoom.scale;
      pinchMid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      didPinch = true;
      // Второй палец = это жест, а не рисование.
      // Всё, что успел нарисовать первый палец, откатываем.
      if (stroking) {
        if (drew && undoStack.length) {
          const st = undoStack.pop();
          manual = new Uint8Array(st.manual);
          compose();
        } else if (undoStack.length) {
          undoStack.pop();          // шаг отмены не пригодился
        }
        stroking = false; drew = false;
      }
      return;
    }
    if (mode === 'pen' || mode === 'er') {
      pushUndo();
      stroking = true;
      drew = false;                 // краску кладём не сразу, а по движению или отпусканию
      last = toImg(e.clientX, e.clientY);
    }
  });

  cv.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    p.moved += Math.abs(dx) + Math.abs(dy);

    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchDist > 0) zoom.scale = Math.max(1, Math.min(8, pinchScale * d / pinchDist));
      const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      if (pinchMid) { zoom.tx += m.x - pinchMid.x; zoom.ty += m.y - pinchMid.y; }
      pinchMid = m;
      applyZoom();
      return;
    }
    if (stroking) {
      const cur = toImg(e.clientX, e.clientY);
      const val = mode === 'pen' ? 1 : 2;
      if (!drew) { paintAt(last.x, last.y, val); drew = true; }
      line(last, cur, val);
      last = cur;
      compose();
      return;
    }
    if (mode === 'move' && zoom.scale > 1.02) { zoom.tx += dx; zoom.ty += dy; applyZoom(); }
  });

  const endPointer = e => {
    const p = pts.get(e.pointerId);
    pts.delete(e.pointerId);
    if (pts.size > 0) return;
    const wasPinch = didPinch;
    didPinch = false; pinchMid = null;
    if (stroking) {
      // одиночный тап без движения — ставим точку здесь, а не при нажатии
      if (!drew && last) { paintAt(last.x, last.y, mode === 'pen' ? 1 : 2); compose(); }
      stroking = false; drew = false;
      return;
    }
    if (wasPinch || !p || p.moved > 12) return;
    if (mode === 'fill' && testData) doFill(toImg(p.sx, p.sy));
  };
  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', endPointer);

  /* ── проба заливки ── */
  const COLORS = [['rot', '#E23A3A'], ['blau', '#2F6FD0'], ['gelb', '#FFCE2E'], ['grün', '#3EA85A'], ['lila', '#8B5CD6']];
  let fillC = [226, 58, 58];
  $('sw').innerHTML = COLORS.map((c, i) => `<button class="sw ${i ? '' : 'on'}" data-c="${c[1]}" style="background:${c[1]}"></button>`).join('');
  $('sw').addEventListener('click', e => {
    const b = e.target.closest('.sw');
    if (!b) return;
    const h = b.dataset.c;
    fillC = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    document.querySelectorAll('.sw').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
  });

  function doFill(pt) {
    const { x, y } = pt;
    if (x < 0 || y < 0 || x >= oW || y >= oH) return;
    const d = testData.data;
    if (out.data[idx(x, y) * 4] < 128) return;
    const seen = new Uint8Array(oW * oH), stack = [x, y];
    let n = 0;
    while (stack.length) {
      const yy = stack.pop(), xx = stack.pop();
      if (xx < 0 || yy < 0 || xx >= oW || yy >= oH) continue;
      const p = idx(xx, yy);
      if (seen[p] || out.data[p * 4] < 128) continue;
      const i = p * 4;
      if (d[i] === fillC[0] && d[i + 1] === fillC[1] && d[i + 2] === fillC[2]) continue;
      seen[p] = 1; n++;
      d[i] = fillC[0]; d[i + 1] = fillC[1]; d[i + 2] = fillC[2];
      stack.push(xx + 1, yy, xx - 1, yy, xx, yy + 1, xx, yy - 1);
    }
    draw();
    const share = n / (oW * oH) * 100;
    $('stat').textContent = 'залито ' + share.toFixed(1) + '% холста' +
      (share > 60 ? ' — краска вытекла: добавь «заделать щели» или закрась разрыв кистью' : '');
  }

  /* ── сохранение ── */
  function pngBase64() {
    const tmp = document.createElement('canvas');
    tmp.width = oW; tmp.height = oH;
    tmp.getContext('2d').putImageData(out, 0, 0);
    return tmp.toDataURL('image/png').split(',')[1];
  }
  $('dl').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = 'data:image/png;base64,' + pngBase64();
    a.download = ($('nm').value.trim() || fileBase || 'bild') + '.png';
    a.click();
  });

  $('up').addEventListener('click', () => {
    if (!out) return;
    let saved = null;
    try { saved = localStorage.getItem('voicegen.pw'); } catch (e) {}
    if (saved) { commit(saved); return; }
    $('lockMsg').textContent = '';
    $('lock').classList.add('show');
    $('pw').focus();
  });
  $('cancel').addEventListener('click', () => $('lock').classList.remove('show'));
  $('ok').addEventListener('click', () => {
    const p = $('pw').value.trim();
    if (!p) return;
    $('lockMsg').textContent = 'проверяю…';
    fetch('/api/quota?adminToken=' + encodeURIComponent(p), { cache: 'no-store' })
      .then(r => {
        if (r.status === 401) { $('lockMsg').textContent = 'неверный пароль'; return; }
        try { localStorage.setItem('voicegen.pw', p); } catch (e) {}
        $('lock').classList.remove('show');
        commit(p);
      })
      .catch(e => { $('lockMsg').textContent = 'сервер не ответил: ' + e.message; });
  });

  function commit(pw) {
    const name = ($('nm').value.trim() || fileBase || 'bild').replace(/[^a-zA-Z0-9._-]+/g, '-').toLowerCase();
    const path = REPO_DIR + '/' + name.replace(/\.png$/i, '') + '.png';
    $('up').disabled = true;
    $('up').textContent = 'загружаю…';
    log('отправляю ' + path);
    fetch('/api/commit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: 'Раскраска: ' + path, files: [{ path: path, content: pngBase64() }], adminToken: pw })
    })
      .then(r => r.json().then(d => ({ r, d })))
      .then(({ r, d }) => {
        if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
        log('готово: коммит ' + String(d.commit).slice(0, 7) + ' · появится после пересборки', 'ok');
        if (d.failed && d.failed.length) d.failed.forEach(f => log('✗ ' + f.path + ' — ' + f.error, 'err'));
        try { localStorage.removeItem('yeva.malen.list'); } catch (e) {}
        // если заменяли существующую картинку — покажем её новую версию тут же
        setTimeout(() => {
          const probe = new Image();
          probe.onload = () => log('файл на сайте обновился', 'ok');
          probe.onerror = () => log('на сайте пока старая версия — сборка ещё идёт', 'err');
          probe.src = '/' + path + '?v=' + Date.now();
        }, 45000);
      })
      .catch(e => {
        log('не вышло: ' + e.message, 'err');
        if (/unauthorized/i.test(e.message)) { try { localStorage.removeItem('voicegen.pw'); } catch (x) {} }
      })
      .finally(() => { $('up').disabled = false; $('up').textContent = 'Загрузить на GitHub'; });
  }
})();
</script>
