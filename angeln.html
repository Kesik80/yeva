<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Angeln</title>
<meta name="theme-color" content="#2E8BA8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/icons/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<meta name="apple-mobile-web-app-title" content="YEVA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  html{background:#2E8BA8}
  body{
    position:fixed;inset:0;
    font-family:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:#0E3A4A;
    background:linear-gradient(180deg,#2E8BA8 0%,#56B0C8 40%,#A8DCE8 74%,#E2F4F9 100%);
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 9px) 10px calc(env(safe-area-inset-bottom,0px) + 9px);
  }

  /* ── верхняя полоса ── */
  .top{display:flex;align-items:center;gap:6px;flex:none}
  .track{
    position:relative;flex:1;min-width:0;height:38px;border-radius:999px;overflow:hidden;
    background:rgba(255,255,255,.78);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(14,58,74,.17);
  }
  .track .fill{position:absolute;left:0;top:0;bottom:0;width:0;
    background:linear-gradient(90deg,#8FE3C8,#35B089);transition:width .3s ease}
  .track .marks{position:absolute;inset:0;pointer-events:none}
  .track .marks i{position:absolute;top:76%;width:8px;height:8px;margin:-4px 0 0 -4px;
    border-radius:50%;background:rgba(14,58,74,.22);
    transition:background .3s,transform .3s,box-shadow .3s}
  .track .marks i.on{background:#fff;transform:scale(1.25);box-shadow:0 0 0 2px rgba(53,176,137,.95)}
  .track .cnt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:13px;font-weight:600;color:#0E3A4A;font-variant-numeric:tabular-nums;white-space:nowrap}
  .track .cnt b{color:#1E7FA0;font-weight:600}

  .hp{
    flex:none;display:flex;gap:2.5px;align-items:center;
    background:rgba(255,255,255,.78);border-radius:999px;padding:10px 9px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(14,58,74,.17);font-size:13px;line-height:1;
  }
  .hp i{font-style:normal;color:#E8566B;transition:opacity .3s,transform .3s,color .3s}
  .hp i.off{opacity:.2;color:#0E3A4A;transform:scale(.78)}
  .hp i.bye{animation:hbye .55s ease-out}
  .hp i.back{animation:hback .6s ease-out}
  @keyframes hbye{0%{transform:scale(1.5);opacity:1}35%{transform:scale(1.5) rotate(12deg)}
    100%{transform:scale(.78);opacity:.2}}
  @keyframes hback{0%{transform:scale(.78);opacity:.2}45%{transform:scale(1.6);opacity:1}
    100%{transform:scale(1);opacity:1}}

  .btn{
    width:40px;height:40px;flex:none;border:0;border-radius:50%;
    background:rgba(255,255,255,.78);color:#0E3A4A;text-decoration:none;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(14,58,74,.18);
    display:grid;place-items:center;cursor:pointer;transition:transform .12s;
  }
  .btn:active{transform:scale(.9)}
  .btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  /* ── пруд ── */
  .stage{
    flex:1;min-height:0;position:relative;overflow:hidden;
    margin-top:9px;border-radius:24px;cursor:grab;touch-action:none;
    background:linear-gradient(180deg,#BFEAF5 0%,#7FD0E6 16%,#3FA8CC 52%,#1D7FA6 88%,#166B8E 100%);
    box-shadow:inset 0 2px 14px rgba(14,58,74,.16);
  }
  .stage:active{cursor:grabbing}
  .ray{position:absolute;top:-10%;width:16%;height:120%;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0));
    transform:rotate(9deg);border-radius:40%}
  .weed{position:absolute;bottom:-6px;width:14px;border-radius:40% 40% 0 0;
    background:linear-gradient(180deg,rgba(40,150,120,.55),rgba(20,110,90,.8));pointer-events:none}
  .bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);
    border:1.5px solid rgba(255,255,255,.45);pointer-events:none;animation:up linear infinite}
  @keyframes up{from{transform:translateY(0)}to{transform:translateY(-105vh)}}

  /* ── рыбы ── */
  .fish{position:absolute;pointer-events:none;will-change:transform;transition:filter .3s}
  .fish svg{width:100%;height:100%;overflow:visible;display:block}
  .fish .num{font-family:inherit;font-weight:600;fill:rgba(255,255,255,.96);
    paint-order:stroke;stroke:rgba(0,0,0,.22);stroke-width:3px}
  .fish.tip{animation:tip 1.1s ease-in-out infinite}
  @keyframes tip{0%,100%{filter:drop-shadow(0 0 0 rgba(255,232,120,0))}
    50%{filter:drop-shadow(0 0 11px rgba(255,232,120,.95)) drop-shadow(0 0 20px rgba(255,232,120,.6))}}
  .fish.got{animation:got .55s ease-in forwards}
  @keyframes got{to{transform:translate(var(--gx),-120px) scale(.5) rotate(18deg);opacity:0}}
  .fish.nope{animation:nope .5s}
  @keyframes nope{0%,100%{filter:none}
    20%{filter:brightness(1.4) saturate(.3)}60%{filter:brightness(1.4) saturate(.3)}}

  /* ── удочка ── */
  .rig{position:absolute;inset:0;pointer-events:none;overflow:visible}
  .rig line{stroke:rgba(255,255,255,.75);stroke-width:2;stroke-linecap:round}
  .boat{position:absolute;top:0;pointer-events:none;will-change:transform;font-size:34px;line-height:1}
  .hook{position:absolute;pointer-events:none;will-change:transform;width:26px;height:30px}
  .hook svg{width:100%;height:100%;fill:none;stroke:#F2F6F8;stroke-width:3.4;
    stroke-linecap:round;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
  .hook.pull svg{stroke:#FFE07A}

  /* ── задание ── */
  /* подпись внизу: наверху она закрывала лодку с крючком, да и до
     кнопки «повторить» маленькой руке снизу ближе */
  .task{
    position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
    display:flex;align-items:center;gap:9px;cursor:pointer;
    background:rgba(255,255,255,.9);border-radius:999px;padding:8px 14px 8px 11px;
    box-shadow:0 6px 18px rgba(14,58,74,.24);max-width:92%;
    font-size:clamp(16px,4.8vw,22px);font-weight:600;color:#0E3A4A;white-space:nowrap;
  }
  .task svg{width:21px;height:21px;flex:none;fill:none;stroke:currentColor;
    stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  .task.say{animation:saypulse .5s}
  @keyframes saypulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}

  .pop{
    position:absolute;pointer-events:none;z-index:9;white-space:nowrap;
    font-size:clamp(16px,4.6vw,21px);font-weight:600;color:#FFF3C4;
    text-shadow:0 2px 8px rgba(0,0,0,.4);animation:rise .9s ease-out forwards;
  }
  .pop.bad{color:#FFC9C2}
  @keyframes rise{
    0%{opacity:0;transform:translate(-50%,0) scale(.8)}
    22%{opacity:1;transform:translate(-50%,-14px) scale(1.12)}
    100%{opacity:0;transform:translate(-50%,-60px) scale(1)}
  }

  .hand{
    position:absolute;left:50%;top:46%;transform:translateX(-50%);
    font-size:15px;font-weight:600;color:#0E3A4A;pointer-events:none;
    background:rgba(255,255,255,.85);border-radius:999px;padding:8px 16px;
    box-shadow:0 5px 14px rgba(14,58,74,.2);
    animation:nudge 1.6s ease-in-out infinite;transition:opacity .3s;
  }
  .hand.gone{opacity:0}
  @keyframes nudge{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-9px)}}

  .flash{
    position:absolute;left:50%;top:36%;transform:translate(-50%,-50%) scale(.7);
    font-size:clamp(21px,6.6vw,33px);font-weight:600;color:#0E3A4A;opacity:0;
    background:rgba(255,255,255,.93);border-radius:999px;padding:9px 22px;
    box-shadow:0 10px 26px rgba(14,58,74,.3);pointer-events:none;white-space:nowrap;z-index:12;
  }
  .flash.go{animation:flash 1.1s ease-out forwards}
  @keyframes flash{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
    22%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
    70%{opacity:1;transform:translate(-50%,-62%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-78%) scale(1)}
  }

  .gift{
    position:absolute;left:50%;top:40%;opacity:0;z-index:13;pointer-events:none;
    font-size:clamp(54px,18vw,100px);line-height:1;
    filter:drop-shadow(0 10px 22px rgba(14,58,74,.4));
    transform:translate(-50%,-50%) scale(.3);
  }
  .gift.go{animation:gift 1.7s cubic-bezier(.2,1.2,.4,1) forwards}
  @keyframes gift{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-18deg)}
    20%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(7deg)}
    52%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
    100%{opacity:0;transform:translate(-50%,-146%) scale(.55)}
  }

  .boom{position:absolute;left:0;top:0;z-index:11;pointer-events:none}
  .boom b{position:absolute;border-radius:50%;border:7px solid rgba(255,220,120,.95);
    box-shadow:0 0 18px rgba(255,230,150,.75),inset 0 0 14px rgba(255,240,190,.6);
    animation:boom-ring .62s cubic-bezier(.2,.8,.3,1) forwards}
  .boom i{position:absolute;border-radius:50%;
    box-shadow:0 0 10px rgba(255,255,255,.9),0 1px 3px rgba(10,40,52,.35);
    animation:boom-dot .9s cubic-bezier(.15,.7,.3,1) forwards}
  @keyframes boom-ring{from{transform:translate(-50%,-50%) scale(.2);opacity:.95}
    to{transform:translate(-50%,-50%) scale(2.2);opacity:0}}
  @keyframes boom-dot{from{transform:translate(-50%,-50%) scale(1);opacity:1}
    to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3);opacity:0}}
  .party{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
  .party i{position:absolute;width:12px;height:16px;border-radius:3px;animation:fall linear forwards}
  @keyframes fall{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(112vh) rotate(680deg)}}

  /* ── старт и итог ── */
  .veil{
    position:fixed;inset:0;z-index:20;display:flex;
    background:rgba(86,176,200,.5);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    transition:opacity .3s;padding:18px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  }
  .veil.hidden{opacity:0;pointer-events:none}
  .panel{
    width:100%;max-width:400px;text-align:center;margin:auto;flex:none;
    background:rgba(255,255,255,.86);border-radius:30px;padding:22px 20px 26px;
    box-shadow:0 18px 44px rgba(14,58,74,.28);
  }
  .panel h1{font-size:clamp(23px,6.6vw,30px);font-weight:600}
  .panel .ru{font-size:14px;color:rgba(14,58,74,.6);margin-top:2px}
  .modes{display:flex;gap:8px;justify-content:center;margin-top:13px}
  .modes button{
    flex:1 1 0;max-width:150px;padding:11px 8px;border:0;border-radius:15px;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:600;line-height:1.25;
    background:rgba(14,58,74,.08);color:rgba(14,58,74,.6);transition:background .2s,color .2s,transform .12s;
  }
  .modes button small{display:block;font-size:11.5px;opacity:.75;font-weight:500}
  .modes button.on{background:linear-gradient(160deg,#4FC3A1,#2E9E86);color:#fff}
  .modes button:active{transform:scale(.96)}
  .stats{
    margin-top:13px;font-size:13.5px;line-height:1.55;color:rgba(14,58,74,.68);
    background:rgba(255,255,255,.6);border-radius:16px;padding:10px 12px;
  }
  .stats b{color:#0E3A4A;font-weight:600}
  .stats button{
    width:auto;margin:8px auto 0;padding:6px 12px;font-size:12px;border-radius:9px;
    border:0;background:rgba(14,58,74,.08);color:rgba(14,58,74,.6);
    font-family:inherit;cursor:pointer;display:block;
  }
  .zoo{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:9px;font-size:21px;line-height:1.1}
  .zoo span{transition:opacity .3s}
  .zoo span.off{opacity:.26;filter:grayscale(1)}
  .tip{margin-top:11px;font-size:12px;line-height:1.5;color:rgba(14,58,74,.55);padding:0 4px}
  .big{
    margin:18px auto 0;width:min(40vw,150px);aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;
    display:grid;place-items:center;color:#0E3A4A;
    background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.98),rgba(255,255,255,.3) 30%,rgba(143,227,200,.5) 58%,rgba(46,139,168,.45) 80%,rgba(255,255,255,.92) 100%);
    box-shadow:0 18px 44px rgba(14,58,74,.3),inset 0 0 34px rgba(255,255,255,.6);
    animation:float 3.6s ease-in-out infinite;
  }
  .big svg{width:34%;height:34%;fill:currentColor;stroke:none}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @media (max-height:560px){
    .panel{padding:14px 18px 16px}
    .panel h1{font-size:21px}
    .modes{margin-top:9px}
    .modes button{padding:8px 6px;font-size:13px}
    .stats{margin-top:9px;font-size:12.5px}
    .zoo{font-size:16px;gap:2px;margin-top:6px}
    .tip{margin-top:7px}
    .big{margin-top:12px;width:min(24vh,104px)}
  }
  @media (prefers-reduced-motion:reduce){
    .big,.hand,.fish.tip,.bub{animation:none}
    .boom{display:none}
  }
</style>
</head>
<body>

<script src="words.js"></script>

<div class="top">
  <div class="track" id="track">
    <i class="fill" id="pfill"></i>
    <span class="marks" id="marks"></span>
    <b class="cnt" id="cnt"></b>
  </div>
  <div class="hp" id="hp"></div>
  <button class="btn" id="btnAgain" aria-label="Заново">
    <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.6 5.9"/><path d="M20 4v7h-7"/></svg>
  </button>
  <a class="btn" href="index.html" aria-label="Домой">
    <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
  </a>
</div>

<div class="stage" id="stage">
  <svg class="rig" id="rig"><line id="line" x1="0" y1="0" x2="0" y2="0"></line></svg>
  <div class="boat" id="boat">🛶</div>
  <div class="hook" id="hook">
    <svg viewBox="0 0 26 30"><path d="M13 2v14a6 6 0 1 1-8.4 5.5"/><path d="M8.5 19.5 4.6 23 1 19.8"/></svg>
  </div>
  <div class="boom" id="boom"></div>
  <div class="gift" id="gift"></div>
  <div class="flash" id="flash"></div>
  <button class="task" id="task" aria-label="Повторить">
    <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M16 9.2a4 4 0 0 1 0 5.6"/><path d="M18.6 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
    <span id="taskText"></span>
  </button>
  <div class="hand" id="hand">Zieh den Haken!</div>
</div>

<div class="veil" id="veil">
  <div class="panel">
    <h1>Angeln</h1>
    <div class="ru">Рыбалка</div>
    <div class="modes">
      <button id="mFarbe">Farben<small>цвета</small></button>
      <button id="mZahl">Zahlen<small>числа</small></button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tip">Голос говорит, какую рыбу поймать. Веди крючок пальцем и подведи
      его к нужной рыбе. Поймал чужую — сгорает сердце. Нажми на подпись сверху,
      чтобы услышать ещё раз</div>
    <button class="big" id="btnStart" aria-label="Играть">
      <svg viewBox="0 0 24 24"><path d="M8 4.8v14.4L20 12z"/></svg>
    </button>
  </div>
</div>

<div class="party" id="party"></div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const YW = window.YEVA_WORDS || null;
  const VOICE = 'voice/de/';
  const NS = 'http://www.w3.org/2000/svg';

  const K_LV = 'yeva.angeln.level';
  const K_BEST = 'yeva.angeln.best';
  const K_PTS = 'yeva.angeln.points';
  const K_ZOO = 'yeva.angeln.zoo';
  const K_MODE = 'yeva.angeln.mode';

  // призы этой игры — море, чтобы не путались с другими коллекциями
  const ZOO = ['\u{1F41A}', '\u{1F980}', '\u{1F420}', '\u{1F419}', '\u{1F991}', '\u{1F433}',
               '\u{1F42C}', '\u{1F988}', '\u{1FABC}', '\u{1F421}', '\u{1F99E}', '\u{1F30A}',
               '\u{1F3DD}️', '⚓', '\u{1F9AD}', '\u{1F422}'];

  // Цвета: десять, и все уже записаны голосом. Порядок — от самых
  // заметных: на первом уровне в пруду только первые четыре.
  const COLORS = [
    { de: 'rot',     hex: '#E33B2E' },
    { de: 'blau',    hex: '#2F6FD0' },
    { de: 'gelb',    hex: '#F2C229' },
    { de: 'grün',    hex: '#3FA64B' },
    { de: 'orange',  hex: '#F0821E' },
    { de: 'lila',    hex: '#8B5FBF' },
    { de: 'rosa',    hex: '#F08CB4' },
    { de: 'weiß', hex: '#F4F7F8' },
    { de: 'braun',   hex: '#8B5A2B' },
    { de: 'schwarz', hex: '#333A40' }
  ];

  const CFG = {
    fish: 0.3,      // длина рыбы от ширины пруда
    grab: 0.3,      // попадание: доля длины рыбы вокруг её середины
    base: 10, step: 5, top: 30,
    prize: 10,
    lives: 5,
    lvMax: 12
  };
  const goalFor = lv => Math.min(CFG.top, CFG.base + CFG.step * (lv - 1));
  const howMany = lv => Math.min(6, 3 + Math.floor((lv - 1) / 2));      // рыб в пруду
  const howHard = lv => Math.min(10, 4 + (lv - 1));                     // из скольких выбираем
  const swimPx = lv => Math.min(0.3, 0.1 + 0.021 * (lv - 1));           // доля ширины в секунду

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* ── звук ── */
  let actx = null, master = null;
  const vBuf = {}, vBad = {}, vHot = {};

  function initAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.3;
    master.connect(actx.destination);
  }

  const slugOf = w => (YW && YW.slug ? YW.slug(w) : String(w.de));
  const vUrl = w => VOICE + slugOf(w) + '.mp3';

  function loadVoice(w) {
    if (!actx || !w) return;
    const u = vUrl(w);
    if (vBuf[u] || vBad[u] || vHot[u]) return;
    vHot[u] = 1;
    fetch(u)
      .then(r => r.ok ? r : fetch(u + '?v=' + Date.now(), { cache: 'no-store' }))
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(ab => actx.decodeAudioData(ab))
      .then(b => { vBuf[u] = b; })
      .catch(e => { vBad[u] = true; console.warn('[voice] нет ' + u + ' — ' + e.message); });
  }

  function say(w) {
    if (!actx || !w) return;
    const u = vUrl(w);
    if (!vBuf[u] && !vBad[u]) loadVoice(w);
    let tries = 0;
    (function wait() {
      if (vBuf[u]) {
        const src = actx.createBufferSource(), g = actx.createGain();
        g.gain.value = 1.25;
        src.buffer = vBuf[u];
        src.connect(g); g.connect(master);
        src.start();
        return;
      }
      if (!vBad[u] && tries++ < 8) { setTimeout(wait, 110); return; }
      try {
        if (typeof speechSynthesis === 'undefined') return;
        speechSynthesis.cancel();
        const ut = new SpeechSynthesisUtterance(w.de);
        ut.lang = 'de-DE'; ut.rate = 0.9; ut.pitch = 1.15;
        speechSynthesis.speak(ut);
      } catch (e) {}
    })();
  }

  function tone(type, freq, at, dur, vol, to) {
    if (!actx) return;
    const t = actx.currentTime + at;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur * 0.9);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  }

  const splash = () => { tone('sine', 820, 0, 0.1, 0.26, 1500); tone('triangle', 420, 0.05, 0.16, 0.2, 900); };
  const nope = () => { tone('sawtooth', 240, 0, 0.26, 0.24, 80); };
  const yay = () => [523, 659, 784, 1046].forEach((f, i) => tone('triangle', f, i * 0.1, 0.3, 0.3));
  const sad = () => [392, 330, 262].forEach((f, i) => tone('triangle', f, i * 0.14, 0.3, 0.26));
  const buzz = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };

  /* ── размеры ── */
  let SW = 0, SH = 0, FW = 0, FH = 0, topY = 0, botY = 0;
  function measure() {
    const r = $('stage').getBoundingClientRect();
    SW = r.width; SH = r.height;
    FW = Math.max(74, Math.min(190, Math.round(SW * CFG.fish)));
    FH = Math.round(FW * 0.56);
    topY = Math.round(Math.max(54, SH * 0.14));     // выше рыбы не заплывают
    botY = Math.round(SH - FH - 74);                // ниже тоже: там подпись
  }

  /* ── состояние ── */
  let level = 1, best = 0, target = CFG.base;
  let pts = 0, bestPts = 0, zoo = [], life = 0, mode = 'farbe';
  let got = 0, wrong = 0;
  let fish = [], task = null;
  let hx = 0, hy = 0, wantX = 0, wantY = 0;
  // Ловим только пока палец на экране. Иначе крючок, оставленный в
  // воде, цепляет первую же подплывшую рыбу — в том числе чужую, и
  // сердце сгорает само по себе, пока ребёнок ничего не делает.
  let holding = false;
  let phase = 'wait';            // wait | play | over | won
  let raf = 0, lastT = 0, seq = 0;
  let timers = [];
  const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
  const clearLater = () => { timers.forEach(clearTimeout); timers = []; };

  function paintProgress() {
    $('pfill').style.width = Math.min(100, got / target * 100).toFixed(1) + '%';
    $('cnt').innerHTML = got + ' / ' + target + ' <b>◆ ' + pts + '</b>';
    const box = $('marks');
    const want = [];
    for (let p = CFG.prize; p < target; p += CFG.prize) want.push(p);
    if (box.children.length !== want.length) {
      box.innerHTML = '';
      want.forEach(p => {
        const i = document.createElement('i');
        i.style.left = (p / target * 100).toFixed(1) + '%';
        box.appendChild(i);
      });
    }
    want.forEach((p, i) => box.children[i].classList.toggle('on', got >= p));
  }

  function anim(el, cls) {
    if (!el) return;
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function paintLives(hit) {
    const box = $('hp');
    if (box.children.length !== CFG.lives) {
      box.innerHTML = '';
      for (let i = 0; i < CFG.lives; i++) {
        const el = document.createElement('i');
        el.textContent = '♥';
        box.appendChild(el);
      }
    }
    for (let i = 0; i < CFG.lives; i++) box.children[i].classList.toggle('off', i >= life);
    if (hit === 'bye' && life >= 0 && life < CFG.lives) anim(box.children[life], 'bye');
    if (hit === 'back' && life > 0) anim(box.children[life - 1], 'back');
  }

  const zooHtml = () => '<div class="zoo">' + ZOO.map((e, i) =>
    '<span' + (zoo.indexOf(i) >= 0 ? '' : ' class="off"') + '>' + e + '</span>').join('') + '</div>';

  function flash(text) {
    const f = $('flash');
    f.textContent = text;
    anim(f, 'go');
  }

  function pop(text, x, y, bad) {
    const el = document.createElement('div');
    el.className = 'pop' + (bad ? ' bad' : '');
    el.textContent = text;
    el.style.left = Math.round(x) + 'px';
    el.style.top = Math.round(Math.max(20, y)) + 'px';
    $('stage').appendChild(el);
    setTimeout(() => el.remove(), 950);
  }

  /* ── рыбы ─────────────────────────────────────────────────── */
  // Ключ рыбы — то, по чему её зовут: имя цвета или число. В пруду
  // ключи не повторяются, иначе задание стало бы двусмысленным.
  function keysNow() { return fish.map(f => f.key); }

  function freeKey() {
    const used = keysNow();
    const pool = [];
    if (mode === 'zahl') {
      for (let n = 1; n <= howHard(level); n++) if (used.indexOf(n) < 0) pool.push(n);
    } else {
      COLORS.slice(0, howHard(level)).forEach(c => { if (used.indexOf(c.de) < 0) pool.push(c.de); });
    }
    if (!pool.length) return null;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function freeBand() {
    const n = Math.max(1, howMany(level));
    const used = fish.map(f => f.band);
    const pool = [];
    for (let i = 0; i < n; i++) if (used.indexOf(i) < 0) pool.push(i);
    const list = pool.length ? pool : [Math.floor(Math.random() * n)];
    return list[Math.floor(Math.random() * list.length)];
  }

  function colorOf(key) {
    if (mode === 'zahl') return COLORS[(Number(key) - 1) % COLORS.length].hex;
    const c = COLORS.find(c2 => c2.de === key);
    return c ? c.hex : '#888';
  }

  function wordOf(key) {
    if (mode === 'zahl') {
      const n = Number(key);
      const all = (YW && YW.numbers ? YW.numbers : []).concat(YW && YW.numbersBig ? YW.numbersBig : []);
      return all.find(w => w.num === n) || { de: String(n) };
    }
    return { de: key };
  }

  function makeFish(key) {
    const el = document.createElement('div');
    el.className = 'fish';
    el.style.width = FW + 'px';
    el.style.height = FH + 'px';
    const hex = colorOf(key);
    const light = key === 'weiß';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 100 56');
    const mk = (t, a) => { const n = document.createElementNS(NS, t);
      Object.keys(a).forEach(k => n.setAttribute(k, a[k])); return n; };
    svg.appendChild(mk('path', { d: 'M66 28 96 10v36z', fill: hex, opacity: '.85' }));
    svg.appendChild(mk('path', { d: 'M40 6q10-6 18 4', fill: 'none', stroke: hex, 'stroke-width': '7',
      'stroke-linecap': 'round', opacity: '.85' }));
    svg.appendChild(mk('ellipse', { cx: '42', cy: '28', rx: '34', ry: '20', fill: hex,
      stroke: light ? 'rgba(14,58,74,.35)' : 'rgba(255,255,255,.35)', 'stroke-width': '2' }));
    svg.appendChild(mk('path', { d: 'M20 34q12 9 26 2', fill: 'none',
      stroke: 'rgba(255,255,255,.3)', 'stroke-width': '3', 'stroke-linecap': 'round' }));
    svg.appendChild(mk('circle', { cx: '22', cy: '22', r: '7', fill: '#fff' }));
    svg.appendChild(mk('circle', { cx: '20.5', cy: '22', r: '3.4', fill: '#17323D' }));
    if (mode === 'zahl') {
      const t = mk('text', { x: '48', y: '38', 'text-anchor': 'middle', 'font-size': '26', class: 'num' });
      t.textContent = key;
      svg.appendChild(t);
    }
    el.appendChild(svg);
    $('stage').appendChild(el);

    const dir = Math.random() < 0.5 ? -1 : 1;
    // Дорожки по глубине: без них рыбы наплывают друг на друга, и
    // ребёнок целится в одну, а крючок цепляет соседнюю.
    const band = freeBand();
    const n = Math.max(1, howMany(level));
    const step = Math.max(12, (botY - topY) / n);
    const lane = Math.min(botY, topY + band * step + Math.random() * Math.max(1, step - FH * 0.7));
    const f = {
      el: el, key: key, band: band, x: Math.random() * Math.max(1, SW - FW), y: lane,
      dir: dir, v: SW * swimPx(level) * (0.8 + Math.random() * 0.45),
      bob: Math.random() * 6.283
    };
    place(f, 0);
    fish.push(f);
    return f;
  }

  function place(f, t) {
    const yy = f.y + Math.sin(t * 1.6 + f.bob) * 5;
    f.el.style.transform = 'translate(' + f.x.toFixed(1) + 'px,' + yy.toFixed(1) + 'px)' +
      (f.dir > 0 ? ' scaleX(-1)' : '');
  }

  function fillPond() {
    while (fish.length < howMany(level)) {
      const k = freeKey();
      if (k === null) break;
      makeFish(k);
    }
  }

  /* ── задание ── */
  function newTask(repeatSame) {
    if (!fish.length) return;
    if (!repeatSame) {
      const pick = fish[Math.floor(Math.random() * fish.length)];
      task = { key: pick.key, word: wordOf(pick.key) };
      wrong = 0;
      seq++;
    }
    $('taskText').textContent = task.word.de;
    fish.forEach(f => f.el.classList.remove('tip'));
    anim($('task'), 'say');
    say(task.word);
    // две ошибки подряд — подсвечиваем нужную
    if (wrong >= 2) {
      const t = fish.find(f => f.key === task.key);
      if (t) t.el.classList.add('tip');
    }
  }

  function hit(f) {
    if (phase !== 'play') return;
    if (f.key === task.key) {
      got++;
      const clean = wrong === 0;
      pts += clean ? 3 : 1;
      splash(); buzz(clean ? [10, 30, 10] : 14);
      pop(clean ? '+3' : '+1', f.x + FW / 2, f.y - 6);
      f.el.style.setProperty('--gx', (hx - f.x - FW / 2).toFixed(0) + 'px');
      anim(f.el, 'got');
      const el = f.el;
      setTimeout(() => el.remove(), 600);
      fish.splice(fish.indexOf(f), 1);
      if (got > best) { best = got; store.set(K_BEST, best); }
      if (pts > bestPts) { bestPts = pts; store.set(K_PTS, bestPts); }
      paintProgress();

      const gift = got % CFG.prize === 0 ? givePrize(f.x + FW / 2, f.y) : false;
      if (got >= target) { phase = 'won'; later(win, gift ? 1200 : 500); return; }
      later(() => { fillPond(); newTask(false); }, gift ? 1500 : 650);
      return;
    }
    // чужая рыба
    wrong++;
    anim(f.el, 'nope');
    nope(); buzz([40, 70, 40]);
    life--;
    paintLives('bye');
    pts = Math.max(0, pts - 1);
    pop('−♥', f.x + FW / 2, f.y - 6, true);
    paintProgress();
    f.dir = f.x < SW / 2 ? 1 : -1;            // уплывает прочь
    f.v *= 1.7;
    if (life <= 0) { phase = 'over'; flash('Vorbei!'); later(() => finish('lives'), 620); return; }
    later(() => { if (phase === 'play') newTask(true); }, 700);
  }

  /* ── приз ── */
  function givePrize(x, y) {
    let idx;
    if (zoo.length < ZOO.length) { idx = zoo.length; zoo.push(idx); store.set(K_ZOO, zoo.join(',')); }
    else idx = Math.floor(Math.random() * ZOO.length);
    const g = $('gift');
    g.textContent = ZOO[idx];
    anim(g, 'go');
    boom(x, y);
    confetti(26);
    yay(); buzz([15, 40, 15, 40, 15]);
    if (life < CFG.lives) {
      life++;
      paintLives('back');
      tone('triangle', 740, 0.5, 0.18, 0.2, 1180);
    }
    return true;
  }

  let boomClear = 0;
  function boom(x, y) {
    const box = $('boom');
    clearTimeout(boomClear);
    box.innerHTML = '';
    box.style.left = Math.round(x) + 'px';
    box.style.top = Math.round(y) + 'px';
    const d = Math.round(Math.min(SW, SH) * 0.34);
    [0, 0.14].forEach(delay => {
      const ring = document.createElement('b');
      ring.style.width = ring.style.height = Math.round(d * (delay ? 0.62 : 1)) + 'px';
      ring.style.animationDelay = delay + 's';
      box.appendChild(ring);
    });
    for (let i = 0; i < 30; i++) {
      const dot = document.createElement('i');
      const ang = Math.random() * Math.PI * 2;
      const dist = d * (0.45 + Math.random() * 0.95);
      const sz = Math.max(7, Math.round(d * (0.05 + Math.random() * 0.08)));
      dot.style.width = dot.style.height = sz + 'px';
      dot.style.background = COLORS[i % COLORS.length].hex;
      dot.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(0) + 'px');
      dot.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(0) + 'px');
      dot.style.animationDelay = (Math.random() * 0.12).toFixed(2) + 's';
      box.appendChild(dot);
    }
    boomClear = setTimeout(() => { box.innerHTML = ''; }, 1200);
  }

  function confetti(n) {
    const box = $('party');
    for (let i = 0; i < n; i++) {
      const c = document.createElement('i');
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.background = COLORS[i % COLORS.length].hex;
      c.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
      c.style.animationDelay = (Math.random() * 0.6) + 's';
      box.appendChild(c);
    }
    setTimeout(() => { box.innerHTML = ''; }, 4200);
  }

  /* ── конец раунда ── */
  function clearPond() {
    fish.forEach(f => f.el.remove());
    fish = [];
  }

  function finish(why) {
    phase = 'over';
    clearPond();
    sad();
    later(() => {
      $('stats').innerHTML = 'Поймано <b>' + got + '</b> · очков <b>' + pts + '</b><br>' +
        'Рекорд: <b>' + best + '</b> за раунд, <b>' + bestPts + '</b> очков<br>' +
        '<span style="opacity:.75">' + (why === 'lives'
          ? 'Сердца кончились — уровень остаётся, попробуй ещё раз'
          : 'Попробуй ещё раз') + '</span>' + zooHtml();
      $('veil').classList.remove('hidden');
    }, 1100);
  }

  function win() {
    phase = 'won';
    clearPond();
    yay(); buzz([20, 50, 20, 50, 20]);
    boom(SW / 2, SH * 0.42);
    confetti(48);
    flash('Super!');
    if (level < CFG.lvMax) level++;
    store.set(K_LV, level);
    later(() => {
      flash('Stufe ' + level + ' · ' + goalFor(level));
      tone('triangle', 880, 0, 0.2, 0.25, 1320);
    }, 1200);
    later(round, 2600);
  }

  /* ── ход времени ── */
  function tick(t) {
    raf = requestAnimationFrame(tick);
    const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
    lastT = t;
    const now = t / 1000;

    // крючок догоняет палец
    hx += (wantX - hx) * Math.min(1, dt * 16);
    hy += (wantY - hy) * Math.min(1, dt * 16);
    $('hook').style.transform = 'translate(' + (hx - 13).toFixed(1) + 'px,' + (hy - 4).toFixed(1) + 'px)';
    const bx = Math.max(18, Math.min(SW - 18, hx));
    $('boat').style.transform = 'translate(' + (bx - 22).toFixed(1) + 'px,-6px)';
    const ln = $('line');
    ln.setAttribute('x1', bx.toFixed(1)); ln.setAttribute('y1', '26');
    ln.setAttribute('x2', hx.toFixed(1)); ln.setAttribute('y2', (hy + 2).toFixed(1));

    if (phase !== 'play') return;

    let near = null, nearD = 1e9;
    for (let i = fish.length - 1; i >= 0; i--) {
      const f = fish[i];
      f.x += f.dir * f.v * dt;
      if (f.x < -FW * 0.16) { f.x = -FW * 0.16; f.dir = 1; }
      if (f.x > SW - FW * 0.84) { f.x = SW - FW * 0.84; f.dir = -1; }
      place(f, now);
      if (!holding) continue;
      const cx = f.x + FW / 2, cy = f.y + FH / 2;
      if (Math.abs(hx - cx) <= FW * CFG.grab && Math.abs(hy + 14 - cy) <= FH * 0.55) {
        // если рыбы всё же наложились, берём ближайшую к крючку
        const d = Math.abs(hx - cx) + Math.abs(hy + 14 - cy);
        if (d < nearD) { nearD = d; near = f; }
      }
    }
    if (near) hit(near);
  }

  /* ── раунд ── */
  function round() {
    clearLater();
    clearPond();
    got = 0; pts = 0; wrong = 0;
    life = CFG.lives;
    target = goalFor(level);
    $('gift').classList.remove('go');
    paintProgress(); paintLives();
    phase = 'play';
    fillPond();
    newTask(false);
  }

  function decor() {
    const st = $('stage');
    st.querySelectorAll('.ray,.weed,.bub').forEach(e => e.remove());
    for (let i = 0; i < 3; i++) {
      const r = document.createElement('div');
      r.className = 'ray';
      r.style.left = (6 + i * 32 + Math.random() * 10) + '%';
      st.appendChild(r);
    }
    for (let i = 0; i < 7; i++) {
      const w = document.createElement('div');
      w.className = 'weed';
      w.style.left = (3 + Math.random() * 94) + '%';
      w.style.height = (18 + Math.random() * 40) + 'px';
      st.appendChild(w);
    }
    for (let i = 0; i < 6; i++) {
      const b = document.createElement('div');
      const sz = 5 + Math.random() * 8;
      b.className = 'bub';
      b.style.width = b.style.height = sz + 'px';
      b.style.left = (Math.random() * 96) + '%';
      b.style.top = (60 + Math.random() * 50) + '%';
      b.style.animationDuration = (7 + Math.random() * 8) + 's';
      b.style.animationDelay = (-Math.random() * 10) + 's';
      st.appendChild(b);
    }
  }

  function start() {
    initAudio();
    (mode === 'zahl'
      ? (YW && YW.numbers ? YW.numbers.slice(1, 9) : [])
      : COLORS.slice(0, 6)).forEach(loadVoice);
    $('veil').classList.add('hidden');
    measure();
    decor();
    hx = wantX = SW / 2;
    hy = wantY = 40;                       // у самой лодки, выше рыб
    holding = false;
    round();
    if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(tick); }
  }

  /* ── палец ── */
  function aim(e) {
    const r = $('stage').getBoundingClientRect();
    wantX = Math.max(14, Math.min(SW - 14, e.clientX - r.left));
    wantY = Math.max(34, Math.min(SH - 22, e.clientY - r.top));
    $('hand').classList.add('gone');
  }
  const stg = $('stage');
  stg.addEventListener('pointerdown', e => {
    if (e.target.closest('#task')) return;
    e.preventDefault();
    initAudio();
    try { stg.setPointerCapture(e.pointerId); } catch (err) {}
    holding = true;
    aim(e);
  });
  stg.addEventListener('pointermove', e => {
    if (e.target.closest('#task')) return;
    if (holding) aim(e);
  });
  const letGo = () => { holding = false; };
  stg.addEventListener('pointerup', letGo);
  stg.addEventListener('pointercancel', letGo);
  stg.addEventListener('pointerleave', letGo);
  $('task').addEventListener('click', e => {
    e.stopPropagation();
    initAudio();
    if (task) { anim($('task'), 'say'); say(task.word); }
  });

  $('btnStart').addEventListener('click', start);
  $('btnAgain').addEventListener('click', () => {
    if (!$('veil').classList.contains('hidden')) return;
    round();
  });

  function setMode(m) {
    mode = m === 'zahl' ? 'zahl' : 'farbe';
    store.set(K_MODE, mode);
    $('mFarbe').classList.toggle('on', mode === 'farbe');
    $('mZahl').classList.toggle('on', mode === 'zahl');
  }
  $('mFarbe').addEventListener('click', () => setMode('farbe'));
  $('mZahl').addEventListener('click', () => setMode('zahl'));

  let rz = 0;
  window.addEventListener('resize', () => {
    clearTimeout(rz);
    rz = setTimeout(() => {
      const oldW = SW || 1, oldH = SH || 1;
      measure();
      decor();
      const kx = SW / oldW, ky = SH / oldH;
      hx *= kx; wantX *= kx; hy *= ky; wantY *= ky;
      fish.forEach(f => {
        f.x *= kx;
        f.y = Math.min(Math.max(topY, f.y * ky), Math.max(topY, botY));
        f.el.style.width = FW + 'px';
        f.el.style.height = FH + 'px';
        f.v = SW * swimPx(level);
      });
    }, 180);
  });

  /* ── первый экран ── */
  level = Math.max(1, Math.min(CFG.lvMax, +store.get(K_LV, 1) || 1));
  best = Math.max(0, +store.get(K_BEST, 0) || 0);
  bestPts = Math.max(0, +store.get(K_PTS, 0) || 0);
  zoo = String(store.get(K_ZOO, '')).split(',')
    .filter(v => v !== '').map(v => +v)
    .filter(v => Number.isInteger(v) && v >= 0 && v < ZOO.length);
  measure();
  target = goalFor(level);
  life = CFG.lives;
  setMode(store.get(K_MODE, 'farbe'));
  paintProgress(); paintLives();

  function panel() {
    $('stats').innerHTML = 'Уровень <b>' + level + '</b> · поймать <b>' + target + '</b><br>' +
      'Рекорд: <b>' + best + '</b> за раунд, <b>' + bestPts + '</b> очков<br>' +
      '<span style="opacity:.75">Находок собрано: <b>' + zoo.length + '</b> из ' + ZOO.length + '</span>' +
      zooHtml() +
      (level > 1 || best || zoo.length ? '<button id="btnReset">начать сначала</button>' : '');
    const rst = $('btnReset');
    if (rst) rst.addEventListener('click', () => {
      level = 1; best = 0; bestPts = 0; zoo = [];
      store.set(K_LV, 1); store.set(K_BEST, 0); store.set(K_PTS, 0); store.set(K_ZOO, '');
      target = goalFor(1);
      paintProgress(); panel();
    });
  }
  panel();

  window.YEVA_ANGELN = {
    state: () => ({ phase: phase, level: level, target: target, got: got, pts: pts, life: life,
                    best: best, bestPts: bestPts, zoo: zoo.slice(), mode: mode, wrong: wrong, seq: seq,
                    task: task ? { key: String(task.key), de: task.word.de } : null,
                    hx: hx, hy: hy, FW: FW, FH: FH, SW: SW, SH: SH,
                    fish: fish.map(f => ({ key: String(f.key), x: f.x, y: f.y,
                                           tip: f.el.classList.contains('tip') })) }),
    setMode: setMode,
    // для тестов: подвести крючок к рыбе с этим ключом
    hookTo: key => {
      const f = fish.find(x => String(x.key) === String(key));
      if (!f) return false;
      wantX = hx = f.x + FW / 2;
      wantY = hy = f.y + FH / 2 - 14;
      holding = true;
      return true;
    },
    park: () => { wantX = hx = 8; wantY = hy = 30; holding = false; }
  };
})();
</script>
