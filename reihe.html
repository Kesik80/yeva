<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Der Reihe nach</title>
<meta name="theme-color" content="#3FB59C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/icons/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<meta name="apple-mobile-web-app-title" content="YEVA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  html{background:#3FB59C}
  body{
    position:fixed;inset:0;
    font-family:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:#0E4740;
    background:
      radial-gradient(110% 70% at 84% 106%, rgba(255,226,150,.45), transparent 62%),
      radial-gradient(90% 60% at 10% 2%, rgba(190,245,255,.5), transparent 66%),
      linear-gradient(180deg,#3FB59C 0%,#6FCFBA 40%,#BDEBE0 76%,#EEFBF7 100%);
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 8px) 8px calc(env(safe-area-inset-bottom,0px) + 8px);
  }

  /* ── верхняя панель ── */
  .top{display:flex;align-items:center;gap:7px;flex:none}

  .goal{
    flex:none;min-width:48px;height:44px;padding:0 12px;border-radius:999px;
    background:linear-gradient(160deg,#FFD86E,#F2913A);color:#5A3200;
    display:grid;place-items:center;line-height:1;
    font-size:24px;font-weight:600;
    box-shadow:0 5px 16px rgba(14,71,64,.18);
    transition:transform .2s cubic-bezier(.3,1.5,.5,1);
  }
  .goal.pop{transform:scale(1.18)}
  .goal.done{background:linear-gradient(160deg,#9BE8CE,#4FC3A1);color:#0E4740;font-size:20px}

  .bar{
    flex:1;min-width:40px;height:16px;border-radius:999px;overflow:hidden;
    background:rgba(255,255,255,.6);
    box-shadow:inset 0 1px 3px rgba(14,71,64,.14);
  }
  .bar i{
    display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,#FFD86E,#4FC3A1);
    transition:width .3s cubic-bezier(.3,1.2,.5,1);
  }

  .time{
    flex:none;height:44px;padding:0 13px;border-radius:999px;
    background:rgba(255,255,255,.66);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(14,71,64,.13);
    display:grid;place-items:center;line-height:1;
    font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;
    min-width:70px;
  }

  .btn{
    width:44px;height:44px;flex:none;border:0;border-radius:50%;
    background:rgba(255,255,255,.66);color:#0E4740;text-decoration:none;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(14,71,64,.14);
    display:grid;place-items:center;cursor:pointer;transition:transform .12s;
  }
  .btn:active{transform:scale(.9)}
  .btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  /* ── поле ── */
  .grid{
    flex:1;min-height:0;width:100%;
    display:grid;gap:8px;
    justify-content:center;align-content:center;
    margin-top:8px;
  }
  .cell{
    border:0;border-radius:18px;cursor:pointer;padding:0;
    display:grid;place-items:center;line-height:1;
    font-family:inherit;font-size:inherit;font-weight:600;color:#0E4740;
    background:rgba(255,255,255,.82);
    box-shadow:0 6px 16px rgba(14,71,64,.14);
    transition:transform .12s,background .3s,color .3s,box-shadow .3s,opacity .3s;
  }
  .cell:active{transform:scale(.93)}
  .cell.done{color:#fff;box-shadow:0 3px 10px rgba(14,71,64,.1),inset 0 0 0 3px rgba(255,255,255,.4)}
  .cell.done{transform:none;pointer-events:none}
  .cell.pop{animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}
  .cell.bad{animation:shake .34s;background:rgba(255,190,180,.95)}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-4px)}}
  .cell.hint{animation:hint 1.1s ease-in-out infinite}
  @keyframes hint{0%,100%{box-shadow:0 6px 16px rgba(14,71,64,.14)}50%{box-shadow:0 0 0 5px rgba(255,216,110,.85),0 6px 18px rgba(14,71,64,.18)}}

  /* ── стартовый / финишный экран ── */
  .veil{
    position:fixed;inset:0;z-index:20;display:grid;place-items:center;
    background:rgba(111,207,186,.46);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    transition:opacity .3s;padding:18px;
  }
  .veil.hidden{opacity:0;pointer-events:none}
  .panel{
    width:100%;max-width:400px;text-align:center;
    background:rgba(255,255,255,.7);border-radius:30px;
    padding:22px 20px 26px;
    box-shadow:0 18px 44px rgba(14,71,64,.22);
    max-height:100%;overflow:auto;
  }
  .panel h1{font-size:clamp(24px,7vw,32px);font-weight:600;letter-spacing:.01em}
  .panel .ru{font-size:14px;color:rgba(14,71,64,.58);margin-top:2px}
  .result{margin-top:14px;font-size:clamp(34px,11vw,52px);font-weight:600;color:#0E4740;line-height:1;font-variant-numeric:tabular-nums}
  .result.hide{display:none}
  .note{margin-top:6px;font-size:15px;color:rgba(14,71,64,.62);min-height:20px}
  .rec{color:#E07B24;font-weight:600}

  .sizes{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:18px}
  .size{
    border:0;cursor:pointer;font-family:inherit;font-weight:600;font-size:16px;
    padding:10px 12px;border-radius:999px;color:#0E4740;
    background:rgba(255,255,255,.85);
    box-shadow:0 5px 14px rgba(14,71,64,.13);
    transition:transform .14s,background .2s,color .2s;
  }
  .size:active{transform:scale(.94)}
  .size.on{background:linear-gradient(160deg,#4FC3A1,#2E9E86);color:#fff}

  .big{
    margin:20px auto 0;
    width:min(40vw,150px);aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;
    display:grid;place-items:center;color:#0E4740;
    background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.98),rgba(255,255,255,.3) 30%,rgba(255,216,110,.5) 58%,rgba(79,195,161,.5) 80%,rgba(255,255,255,.92) 100%);
    box-shadow:0 18px 44px rgba(14,71,64,.25),inset 0 0 34px rgba(255,255,255,.6);
    animation:float 3.6s ease-in-out infinite;
  }
  .big svg{width:34%;height:34%;fill:currentColor;stroke:none}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

  .party{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
  .party i{position:absolute;width:12px;height:16px;border-radius:3px;animation:fall linear forwards}
  @keyframes fall{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(112vh) rotate(680deg)}}

  @media (prefers-reduced-motion:reduce){
    .big{animation:none}
    .cell.hint{animation:none;box-shadow:0 0 0 4px rgba(255,216,110,.9)}
  }
</style>
</head>
<body>

<script src="words.js"></script>

<div class="top">
  <div class="goal" id="goal">1</div>
  <div class="bar"><i id="fill"></i></div>
  <div class="time" id="time">0:00</div>
  <button class="btn" id="btnAgain" aria-label="Заново">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4h-4"/></svg>
  </button>
  <a class="btn" href="index.html" aria-label="Домой">
    <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
  </a>
</div>

<div class="grid" id="grid"></div>

<div class="veil" id="veil">
  <div class="panel">
    <h1 id="hdr">Der Reihe nach</h1>
    <div class="ru" id="sub">Нажимай числа по порядку</div>
    <div class="result hide" id="result">0:00</div>
    <div class="note" id="note"></div>
    <div class="sizes" id="sizes"></div>
    <button class="big" id="btnStart" aria-label="Играть">
      <svg viewBox="0 0 24 24"><path d="M8 4.8v14.4L20 12z"/></svg>
    </button>
  </div>
</div>

<div class="party" id="party"></div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const YW = window.YEVA_WORDS || null;

  const SIZES = [10, 20, 30, 40, 50];
  const K_SIZE = 'yeva.reihe.size';
  const K_BEST = 'yeva.reihe.best.';
  const VOICE = 'voice/de/';

  const PAL = ['#4FC3A1', '#58B8E8', '#F0A24B', '#E880A8', '#8E86E0', '#6FC45A', '#E8705C', '#39B3C4'];
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];

  let N = 10;          // размер набора
  let next = 1;        // какое число ищем
  let errs = 0;
  let t0 = 0, elapsed = 0, running = false, finished = false;
  let hintAt = 0, raf = 0, shown = '';

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* ── звук ── */
  let actx = null, master = null;
  const vBuf = {}, vBad = {}, vHot = {};   // готово / нет файла / уже качается

  function initAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.3;
    master.connect(actx.destination);
  }

  // числа 0–10 лежат в words.js как numbers, 11–50 — как numbersBig
  const NUMW = (() => {
    const m = {};
    const add = w => { if (w && typeof w.num === 'number') m[w.num] = w; };
    if (YW && YW.numbers) YW.numbers.forEach(add);
    if (YW && YW.numbersBig) YW.numbersBig.forEach(add);
    return m;
  })();
  const numWord = n => NUMW[n] || null;

  // тянем озвучку на пару шагов вперёд, а не все 50 файлов сразу
  function preload(from) {
    for (let i = from; i <= N && i < from + 4; i++) loadVoice(numWord(i));
  }
  const vUrl = w => VOICE + (YW && YW.slug ? YW.slug(w) : w.de) + '.mp3';

  function loadVoice(w) {
    if (!actx || !w) return;
    const u = vUrl(w);
    if (vBuf[u] || vBad[u] || vHot[u]) return;
    vHot[u] = 1;
    fetch(u)
      .then(r => r.ok ? r : fetch(u + '?v=' + Date.now(), { cache: 'no-store' }))
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(ab => actx.decodeAudioData(ab))
      .then(b => { vBuf[u] = b; })
      .catch(e => { vBad[u] = true; console.warn('[voice] нет ' + u + ' — ' + e.message); });
  }

  function say(n, delay) {
    const w = numWord(n);
    if (!actx || !w) return;
    const u = vUrl(w);
    if (!vBuf[u] && !vBad[u]) loadVoice(w);
    let tries = 0;
    setTimeout(function wait() {
      if (vBuf[u]) {
        const src = actx.createBufferSource(), g = actx.createGain();
        g.gain.value = 1.25;
        src.buffer = vBuf[u];
        src.connect(g); g.connect(master);
        src.start();
        return;
      }
      if (!vBad[u] && tries++ < 6) { setTimeout(wait, 120); return; }
      try {
        if (typeof speechSynthesis === 'undefined') return;
        speechSynthesis.cancel();
        const ut = new SpeechSynthesisUtterance(w.de);
        ut.lang = 'de-DE'; ut.rate = 0.9; ut.pitch = 1.15;
        speechSynthesis.speak(ut);
      } catch (e) {}
    }, delay || 0);
  }

  function tone(type, freq, at, dur, vol, to) {
    if (!actx) return;
    const t = actx.currentTime + at;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur * 0.9);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  }

  // шаг вверх по пентатонике: чем дальше, тем выше — «лесенка»
  const STEPS = [0, 2, 4, 7, 9];
  function blip(i) {
    const oct = Math.floor(i / STEPS.length) % 3;
    const semi = STEPS[i % STEPS.length] + oct * 12;
    tone('triangle', 523.25 * Math.pow(2, semi / 12), 0, 0.2, 0.3);
    tone('sine', 1046.5 * Math.pow(2, semi / 12), 0.01, 0.12, 0.1);
  }
  const nope = () => { tone('sine', 300, 0, 0.14, 0.2, 250); tone('sine', 232, 0.13, 0.22, 0.18, 190); };
  const fanfare = () => [0, 4, 7, 12, 7, 12, 16, 19].forEach((n, i) => tone('triangle', 392 * Math.pow(2, n / 12), i * 0.11, 0.42, 0.33));
  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  /* ── время ── */
  function fmt(ms, tenths) {
    const s = Math.max(0, ms) / 1000;
    const m = Math.floor(s / 60);
    const r = s - m * 60;
    if (tenths) return m + ':' + (r < 10 ? '0' : '') + r.toFixed(1);
    const sec = Math.floor(r);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function loop() {
    raf = 0;
    if (!running) return;
    elapsed = Date.now() - t0;
    const s = fmt(elapsed);
    if (s !== shown) { shown = s; $('time').textContent = s; }
    if (hintAt && Date.now() > hintAt) showHint();
    raf = requestAnimationFrame(loop);
  }
  function startClock() {
    if (running) return;
    running = true; t0 = Date.now() - elapsed;
    if (!raf) raf = requestAnimationFrame(loop);
  }
  function stopClock() {
    running = false;
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }

  /* ── подсказка ── */
  function armHint(ms) { hintAt = Date.now() + (ms || 6000); clearHint(); }
  function clearHint() {
    const h = $('grid').querySelector('.cell.hint');
    if (h) h.classList.remove('hint');
  }
  function showHint() {
    hintAt = 0;
    const c = cellOf(next);
    if (c) c.classList.add('hint');
  }

  const cellOf = n => $('grid').querySelector('[data-n="' + n + '"]');

  /* ── раскладка ── */
  function layout() {
    const box = $('grid');
    const W = box.clientWidth || window.innerWidth;
    const H = box.clientHeight || window.innerHeight * 0.8;
    const gap = N >= 30 ? 6 : 8;
    box.style.gap = gap + 'px';
    // только ровные прямоугольники: без «огрызка» в последнем ряду
    let best = { side: 0, cols: 1 };
    for (let cols = 1; cols <= N; cols++) {
      if (N % cols) continue;
      const rows = N / cols;
      const side = Math.min((W - (cols - 1) * gap) / cols, (H - (rows - 1) * gap) / rows);
      if (side > best.side) best = { side: side, cols: cols };
    }
    // клетки слегка растягиваются, чтобы занять весь экран (но не больше 1.5:1)
    const cols = best.cols, rows = N / cols;
    const cw = (W - (cols - 1) * gap) / cols;
    const ch = (H - (rows - 1) * gap) / rows;
    const w = Math.floor(Math.min(cw, ch * 1.5));
    const h = Math.floor(Math.min(ch, cw * 1.5));
    const side = Math.min(w, h);
    box.style.gridTemplateColumns = 'repeat(' + cols + ', ' + w + 'px)';
    box.style.gridAutoRows = h + 'px';
    box.style.fontSize = Math.max(12, Math.floor(side * (N > 40 ? 0.42 : 0.46))) + 'px';
    const r = Math.max(8, Math.round(side * 0.22)) + 'px';
    Array.prototype.forEach.call(box.children, c => { c.style.borderRadius = r; });
  }

  /* ── партия ── */
  function build() {
    const nums = [];
    for (let i = 1; i <= N; i++) nums.push(i);
    for (let i = nums.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = nums[i]; nums[i] = nums[j]; nums[j] = t;
    }
    $('grid').innerHTML = nums.map(n =>
      '<button class="cell" data-n="' + n + '">' + n + '</button>').join('');
    layout();
  }

  function paintHud() {
    const g = $('goal');
    if (next > N) { g.classList.add('done'); g.textContent = '★'; }
    else { g.classList.remove('done'); g.textContent = next; }
    g.classList.remove('pop');
    void g.offsetWidth;
    g.classList.add('pop');
    $('fill').style.width = Math.round((next - 1) / N * 100) + '%';
  }

  function reset() {
    stopClock();
    elapsed = 0; shown = ''; next = 1; errs = 0; finished = false;
    $('time').textContent = '0:00';
    build();
    paintHud();
    preload(1);
    armHint(7000);
  }

  function tap(cell) {
    if (finished) return;
    const n = +cell.dataset.n;
    initAudio();
    startClock();

    if (n !== next) {
      errs++;
      cell.classList.remove('bad');
      void cell.offsetWidth;
      cell.classList.add('bad');
      setTimeout(() => cell.classList.remove('bad'), 360);
      nope(); buzz(40);
      armHint(1200);
      return;
    }

    clearHint();
    cell.classList.add('done', 'pop');
    cell.style.background = PAL[(n - 1) % PAL.length];
    setTimeout(() => cell.classList.remove('pop'), 420);
    blip(n - 1);
    say(n, 40);
    next++;
    preload(next);
    paintHud();

    if (next > N) finish();
    else armHint(7000);
  }

  /* ── финиш ── */
  function finish() {
    finished = true;
    const ms = running ? Date.now() - t0 : elapsed;
    elapsed = ms;
    stopClock();
    $('time').textContent = fmt(ms);
    const k = K_BEST + N;
    const prev = +store.get(k, 0);
    const record = !prev || ms < prev;
    if (record) store.set(k, String(ms));

    party();
    setTimeout(() => {
      $('hdr').textContent = 'Fertig!';
      $('sub').textContent = 'Все числа по порядку';
      $('result').textContent = fmt(ms, true);
      $('result').classList.remove('hide');
      let note = '';
      if (record) note = '<span class="rec">★ новый рекорд!</span>';
      else note = 'лучшее: ' + fmt(prev, true);
      if (errs) note += ' · промахов: ' + errs;
      $('note').innerHTML = note;
      $('veil').classList.remove('hidden');
      paintSizes();
    }, 1500);
  }

  function party() {
    fanfare(); buzz([20, 60, 20, 60, 50]);
    const box = $('party');
    for (let i = 0; i < 80; i++) {
      const c = document.createElement('i');
      c.style.left = rand(0, 100) + 'vw';
      c.style.background = pick(PAL.concat(['#FFD86E']));
      c.style.animationDuration = rand(1.8, 3.4) + 's';
      c.style.animationDelay = rand(0, 0.7) + 's';
      box.appendChild(c);
    }
    setTimeout(() => { box.innerHTML = ''; }, 4200);
  }

  /* ── выбор размера ── */
  function paintSizes() {
    $('sizes').innerHTML = SIZES.map(s => {
      const best = +store.get(K_BEST + s, 0);
      return '<button class="size' + (s === N ? ' on' : '') + '" data-s="' + s + '">1–' + s +
        (best ? '<span style="font-size:12px;opacity:.6"> · ' + fmt(best, false) + '</span>' : '') + '</button>';
    }).join('');
  }

  $('sizes').addEventListener('click', e => {
    const b = e.target.closest('.size');
    if (!b) return;
    N = +b.dataset.s;
    store.set(K_SIZE, String(N));
    initAudio();
    tone('sine', 700, 0, 0.08, 0.16, 1000);
    paintSizes();
    reset();
  });

  /* ── полный экран ── */
  function goFullscreen() {
    // Установленная игра и так во весь экран. Запрос полноэкранного режима
    // добавляет только системную подсказку «проведите сверху вниз и нажмите
    // Назад» — ребёнок её не уберёт, а она закрывает нижний ряд.
    try {
      if ((window.matchMedia && (matchMedia('(display-mode: fullscreen)').matches ||
           matchMedia('(display-mode: standalone)').matches)) || navigator.standalone) return;
    } catch (e) {}
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!fn || document.fullscreenElement) return;
    try {
      const p = fn.call(el, { navigationUI: 'hide' });
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  $('btnStart').addEventListener('click', () => {
    goFullscreen();
    initAudio();
    preload(1);
    $('veil').classList.add('hidden');
    $('result').classList.add('hide');
    $('note').innerHTML = '';
    $('hdr').textContent = 'Der Reihe nach';
    $('sub').textContent = 'Нажимай числа по порядку';
    reset();
    setTimeout(layout, 220);
  });

  $('btnAgain').addEventListener('click', () => { initAudio(); reset(); });

  $('grid').addEventListener('click', e => {
    const c = e.target.closest('.cell');
    if (c) tap(c);
  });

  // Высота меняется не разом: системные полосы Android уезжают с анимацией,
  // и один пересчёт может попасть в промежуточный размер — тогда нижний ряд
  // оказывается за краем экрана. Поэтому пересчитываем несколько раз.
  let lastH = 0;
  function relayout() {
    [0, 120, 350, 800].forEach(ms => setTimeout(() => {
      const h = window.innerHeight;
      if (ms && h === lastH) return;     // ничего не менялось — не дёргаем
      lastH = h;
      layout();
    }, ms));
  }
  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', relayout);
  document.addEventListener('fullscreenchange', relayout);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', relayout);
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && actx && actx.state === 'suspended') actx.resume();
  });

  /* ── старт ── */
  N = SIZES.indexOf(+store.get(K_SIZE, 10)) >= 0 ? +store.get(K_SIZE, 10) : 10;
  paintSizes();
  reset();
})();
</script>
<script src="install.js"></script>
<script src="home.js"></script>
<script src="console.js"></script>
</body>
