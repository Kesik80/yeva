<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Schreiben</title>
<meta name="theme-color" content="#2FA39B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/icons/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<meta name="apple-mobile-web-app-title" content="YEVA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  html{background:#2FA39B}
  body{
    position:fixed;inset:0;
    font-family:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:#143D3A;
    background:
      radial-gradient(110% 70% at 84% 106%, rgba(255,230,180,.45), transparent 62%),
      radial-gradient(90% 60% at 8% 2%, rgba(215,245,240,.55), transparent 66%),
      linear-gradient(180deg,#2FA39B 0%,#6FC6BE 40%,#CDE9E5 76%,#F6FCFB 100%);
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 9px) 10px calc(env(safe-area-inset-bottom,0px) + 9px);
  }

  .top{display:flex;align-items:center;gap:8px;flex:none}
  .stars{
    display:flex;gap:3px;flex:1;min-width:0;overflow:hidden;
    background:rgba(255,255,255,.7);border-radius:999px;padding:9px 11px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(20,61,58,.13);
  }
  .stars i{flex:1 1 8px;max-width:15px;min-width:6px;aspect-ratio:1;border-radius:50%;
    background:rgba(20,61,58,.14);transition:transform .3s,background .3s}
  .stars i.on{background:linear-gradient(160deg,#FFD86E,#F2913A);transform:scale(1.12)}

  .btn{
    width:44px;height:44px;flex:none;border:0;border-radius:50%;
    background:rgba(255,255,255,.7);color:#143D3A;text-decoration:none;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(20,61,58,.14);
    display:grid;place-items:center;cursor:pointer;transition:transform .12s;
  }
  .btn:active{transform:scale(.9)}
  .btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh}

  /* ── лист с цифрой ── */
  .sheet{
    flex:none;background:rgba(255,255,255,.72);border-radius:30px;
    box-shadow:0 12px 32px rgba(20,61,58,.16);padding:10px;
    touch-action:none;
  }
  .sheet svg{display:block;touch-action:none}
  .road{fill:none;stroke:rgba(20,61,58,.14);stroke-linecap:round;stroke-linejoin:round}
  .dots{fill:none;stroke:rgba(20,61,58,.3);stroke-linecap:round;stroke-dasharray:.5 7}
  .ink{fill:none;stroke:#E8782F;stroke-linecap:round;stroke-linejoin:round;
    transition:stroke .3s}
  .done .ink{stroke:#2E9E86}
  .start{fill:#2E9E86;animation:beat 1.1s ease-in-out infinite}
  .start.hide{display:none}
  @keyframes beat{0%,100%{r:5.5}50%{r:8}}
  .pen{fill:#fff;stroke:#E8782F;stroke-width:3;opacity:0;transition:opacity .2s}
  .pen.on{opacity:1}
  .sheet.done{animation:flash .5s ease-in-out 2}
  @keyframes flash{50%{background:rgba(255,216,110,.75)}}

  .say{
    font-size:clamp(16px,5vw,26px);font-weight:600;color:rgba(20,61,58,.6);
    flex:none;text-align:center;min-height:1.3em;
  }
  .hint{
    font-size:clamp(12px,3.6vw,16px);font-weight:500;color:rgba(20,61,58,.42);
    flex:none;text-align:center;min-height:1.2em;
  }

  /* ── старт ── */
  .veil{
    position:fixed;inset:0;z-index:20;display:flex;
    background:rgba(111,198,190,.5);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    transition:opacity .3s;padding:18px;
    overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  }
  .veil.hidden{opacity:0;pointer-events:none}
  .panel{
    width:100%;max-width:400px;text-align:center;margin:auto;flex:none;
    background:rgba(255,255,255,.76);border-radius:30px;padding:22px 20px 26px;
    box-shadow:0 18px 44px rgba(20,61,58,.22);
  }
  .panel h1{font-size:clamp(24px,7vw,32px);font-weight:600}
  .panel .ru{font-size:14px;color:rgba(20,61,58,.58);margin-top:2px}
  .tip{margin-top:12px;font-size:12px;line-height:1.5;color:rgba(20,61,58,.5);padding:0 4px}
  .sizes{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:16px}
  .size{
    border:0;cursor:pointer;font-family:inherit;font-weight:600;font-size:16px;
    padding:11px 15px;border-radius:999px;color:#143D3A;background:rgba(255,255,255,.88);
    box-shadow:0 5px 14px rgba(20,61,58,.13);transition:transform .14s,background .2s,color .2s;
  }
  .size:active{transform:scale(.94)}
  .size.on{background:linear-gradient(160deg,#2FA39B,#1A7C75);color:#fff}
  .big{
    margin:20px auto 0;width:min(40vw,150px);aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;
    display:grid;place-items:center;color:#143D3A;
    background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.98),rgba(255,255,255,.3) 30%,rgba(255,216,110,.5) 58%,rgba(47,163,155,.45) 80%,rgba(255,255,255,.92) 100%);
    box-shadow:0 18px 44px rgba(20,61,58,.25),inset 0 0 34px rgba(255,255,255,.6);
    animation:float 3.6s ease-in-out infinite;
  }
  .big svg{width:34%;height:34%;fill:currentColor;stroke:none}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @media (max-height:560px){
    .panel{padding:14px 18px 16px}
    .panel h1{font-size:22px}
    .tip{margin-top:8px}
    .sizes{margin-top:11px;gap:7px}
    .size{padding:8px 13px;font-size:15px}
    .big{margin-top:12px;width:min(24vh,104px)}
  }

  .party{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
  .party i{position:absolute;width:12px;height:16px;border-radius:3px;animation:fall linear forwards}
  @keyframes fall{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(112vh) rotate(680deg)}}

  @media (prefers-reduced-motion:reduce){
    .big{animation:none}.start{animation:none}.sheet.done{animation:none}
  }
</style>
</head>
<body>

<script src="words.js"></script>

<div class="top">
  <div class="stars" id="stars"></div>
  <button class="btn" id="btnAgain" aria-label="Сначала">
    <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 5v6h-6"/></svg>
  </button>
  <button class="btn" id="btnNext" aria-label="Дальше">
    <svg viewBox="0 0 24 24"><path d="M5 12h13"/><path d="M13 6l6 6-6 6"/></svg>
  </button>
  <a class="btn" href="index.html" aria-label="Домой">
    <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
  </a>
</div>

<div class="stage">
  <div class="sheet" id="sheet"><svg id="paper" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div class="say" id="say"></div>
  <div class="hint" id="hint"></div>
</div>

<div class="veil" id="veil">
  <div class="panel">
    <h1>Schreiben</h1>
    <div class="ru">Обводилка цифр</div>
    <div class="tip">Поставь палец на зелёную точку и веди по дорожке. Цифра закрашивается следом, а в конце называет себя по-немецки</div>
    <div class="sizes" id="sizes"></div>
    <button class="big" id="btnStart" aria-label="Играть">
      <svg viewBox="0 0 24 24"><path d="M8 4.8v14.4L20 12z"/></svg>
    </button>
  </div>
</div>

<div class="party" id="party"></div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const YW = window.YEVA_WORDS;
  if (!YW || !YW.numbers) {
    document.body.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif">' +
      'Нужен words.js</div>';
    return;
  }

  /* Цифры как линии письма, а не как буквы шрифта: по каждой ведут
     пальцем от зелёной точки. Координаты в клетке 100×100, порядок
     штрихов — тот, которым пишут рукой. */
  const DIGITS = {
    0: ['M50 12 C28 12 18 30 18 50 C18 70 28 88 50 88 C72 88 82 70 82 50 C82 30 72 12 50 12'],
    1: ['M28 30 L50 12 L50 88'],
    2: ['M22 32 C22 16 40 8 58 12 C78 17 84 38 66 54 L20 88 L84 88'],
    3: ['M24 24 C34 10 64 8 70 26 C75 42 58 50 44 50 C60 50 78 56 76 72 C73 88 38 94 24 78'],
    4: ['M62 14 L16 66 L84 66', 'M62 14 L62 90'],
    5: ['M74 14 L34 14 L28 46 C50 34 80 44 78 64 C76 86 44 94 24 80'],
    6: ['M72 16 C46 14 24 34 24 58 C24 78 38 88 52 88 C68 88 80 78 80 66 C80 52 68 44 54 44 C40 44 28 52 24 62'],
    7: ['M20 16 L82 16 L44 90'],
    8: ['M50 50 C34 50 26 40 26 30 C26 18 38 12 50 12 C62 12 74 18 74 30 C74 40 66 50 50 50 C32 50 22 60 22 72 C22 84 36 90 50 90 C64 90 78 84 78 72 C78 60 68 50 50 50'],
    9: ['M78 46 C78 28 66 14 50 14 C34 14 24 26 24 40 C24 54 36 62 50 62 C66 62 76 54 78 46 C78 72 70 88 34 92']
  };
  const ORDER = [1, 2, 3, 4, 5, 6, 7, 8, 9, 0];

  // tol — как далеко от середины дорожки ещё засчитываем палец.
  // Было 15 при ширине дорожки 13: палец мог идти мимо неё и срезать
  // углы. 9,5 — это половина дорожки плюс немного: на телефоне около
  // 30 пикселей, детскому пальцу хватает, а поперёк цифры не пройдёшь.
  const CFG = { voice: 'voice/de/', tol: 9.5, look: 16 };
  const K_MODE = 'yeva.schreiben.mode';

  const NUM = {};
  (YW.numbers || []).forEach(w => { NUM[w.num] = w; });

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  let mode = 'row';            // 'row' — по порядку, 'mix' — вперемешку
  let idx = 0;                 // место в ORDER
  let digit = 1;
  let strokes = [];            // {el, ink, pts, L, done}
  let si = 0;                  // какой штрих ведём
  let k = 0;                   // до какой точки дошли
  let locked = true;
  let done = 0;                // сколько цифр за круг

  /* ── звук ── */
  let actx = null, master = null;
  const vBuf = {}, vBad = {}, vHot = {};

  function initAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.32;
    master.connect(actx.destination);
  }

  const vUrl = w => CFG.voice + YW.slug(w) + '.mp3';

  function load(w) {
    if (!actx || !w) return;
    const u = vUrl(w);
    if (vBuf[u] || vBad[u] || vHot[u]) return;
    vHot[u] = 1;
    fetch(u)
      .then(r => r.ok ? r : fetch(u + '?v=' + Date.now(), { cache: 'no-store' }))
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(ab => actx.decodeAudioData(ab))
      .then(buf => { vBuf[u] = buf; })
      .catch(e => { vBad[u] = true; console.warn('[voice] нет ' + u + ' — ' + e.message); });
  }

  function say(w) {
    if (!w) return;
    load(w);
    const u = vUrl(w);
    let tries = 0;
    (function wait() {
      if (vBuf[u]) {
        const src = actx.createBufferSource(), g = actx.createGain();
        g.gain.value = 1.25;
        src.buffer = vBuf[u];
        src.connect(g); g.connect(master);
        src.start();
        return;
      }
      if (vBad[u]) { speak(w); return; }
      if (tries++ < 10) { setTimeout(wait, 120); return; }
      speak(w);
    })();
  }

  function speak(w) {
    try {
      if (typeof speechSynthesis === 'undefined') return;
      speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(w.de);
      ut.lang = 'de-DE'; ut.rate = 0.9; ut.pitch = 1.1;
      speechSynthesis.speak(ut);
    } catch (e) {}
  }

  function tone(type, freq, at, dur, vol, to) {
    if (!actx) return;
    const t = actx.currentTime + at;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur * 0.9);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  }
  const blip = h => tone('sine', 520 + h * 28, 0, 0.07, 0.1, 620 + h * 28);
  const yay = () => [0, 4, 7, 12].forEach((n, i) => tone('triangle', 523.25 * Math.pow(2, n / 12), i * 0.07, 0.4, 0.3));
  const fanfare = () => [0, 4, 7, 12, 7, 12, 16].forEach((n, i) => tone('triangle', 392 * Math.pow(2, n / 12), i * 0.12, 0.42, 0.33));
  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  /* ── рисование цифры ── */
  function draw() {
    const svg = $('paper');
    const w = +(DIGITS[digit] ? 1 : 1);
    const road = 13, ink = 11;
    let h = '';
    DIGITS[digit].forEach((d, i) => {
      h += '<path class="road" d="' + d + '" stroke-width="' + road + '"/>';
    });
    DIGITS[digit].forEach(d => {
      h += '<path class="dots" d="' + d + '" stroke-width="3"/>';
    });
    DIGITS[digit].forEach((d, i) => {
      h += '<path class="ink" id="ink' + i + '" d="' + d + '" stroke-width="' + ink + '"/>';
    });
    h += '<circle class="start" id="startdot" r="6"/>';
    h += '<circle class="pen" id="pen" r="7"/>';
    svg.setAttribute('viewBox', '-9 -9 118 118');
    svg.innerHTML = h;

    strokes = DIGITS[digit].map((d, i) => {
      const el = $('ink' + i);
      const L = el.getTotalLength();
      const n = Math.max(30, Math.round(L / 1.6));
      const pts = [];
      for (let j = 0; j <= n; j++) {
        const p = el.getPointAtLength(L * j / n);
        pts.push({ x: p.x, y: p.y, l: L * j / n });
      }
      el.style.strokeDasharray = L;
      el.style.strokeDashoffset = L;
      return { el: el, L: L, pts: pts };
    });
    si = 0; k = 0;
    showStart();
    resize();
  }

  function showStart() {
    const dot = $('startdot');
    if (!dot) return;
    if (si >= strokes.length) { dot.classList.add('hide'); return; }
    const p = strokes[si].pts[Math.max(0, k)];
    dot.classList.remove('hide');
    dot.setAttribute('cx', p.x);
    dot.setAttribute('cy', p.y);
  }

  function movePen(p) {
    const pen = $('pen');
    if (!pen) return;
    pen.classList.add('on');
    pen.setAttribute('cx', p.x);
    pen.setAttribute('cy', p.y);
    // пока палец на экране, зелёная точка не нужна: под пальцем её всё
    // равно не видно, а вдвоём с пером они мельтешат
    const dot = $('startdot');
    if (dot) dot.classList.add('hide');
  }

  // лист — квадрат, занимает всё свободное место
  function resize() {
    const stage = document.querySelector('.stage');
    const other = $('say').offsetHeight + $('hint').offsetHeight + 24;
    const side = Math.max(160, Math.min(stage.clientWidth, stage.clientHeight - other));
    $('sheet').style.width = side + 'px';
    $('sheet').style.height = side + 'px';
    const svg = $('paper');
    svg.style.width = (side - 20) + 'px';
    svg.style.height = (side - 20) + 'px';
  }

  /* ── ведение пальцем ── */
  function toView(e) {
    const svg = $('paper');
    const r = svg.getBoundingClientRect();
    const t = (e.touches && e.touches[0]) || e;
    if (!r.width || !t || t.clientX == null) return null;
    const vb = svg.viewBox.baseVal;
    return {
      x: (t.clientX - r.left) / r.width * vb.width + vb.x,
      y: (t.clientY - r.top) / r.height * vb.height + vb.y
    };
  }

  function drag(e) {
    if (locked || si >= strokes.length) return;
    const p = toView(e);
    if (!p) return;
    const st = strokes[si];

    // Ищем самую дальнюю точку впереди, до которой палец дотянулся.
    // Назад не отматываем: ребёнок дрожит рукой, и откат выглядел бы
    // как будто у него отбирают сделанное.
    let best = -1;
    const end = Math.min(st.pts.length - 1, k + CFG.look);
    for (let j = k; j <= end; j++) {
      const q = st.pts[j];
      const dx = q.x - p.x, dy = q.y - p.y;
      if (dx * dx + dy * dy <= CFG.tol * CFG.tol) best = j;
    }
    if (best < 0) return;                     // палец в стороне — просто ждём

    if (best !== k) {
      const was = k;
      k = best;
      st.el.style.strokeDashoffset = st.L - st.pts[k].l;
      movePen(st.pts[k]);
      showStart();
      if (Math.floor(k / 8) !== Math.floor(was / 8)) blip(k / st.pts.length * 8);
    }

    if (k >= st.pts.length - 1) {             // штрих пройден
      st.el.style.strokeDashoffset = 0;
      si++; k = 0;
      if (si < strokes.length) {
        showStart();
        tone('triangle', 660, 0, 0.14, 0.18);
      } else {
        finish();
      }
    }
  }

  $('sheet').addEventListener('pointerdown', e => { initAudio(); drag(e); }, { passive: true });
  $('sheet').addEventListener('pointermove', e => {
    if (e.buttons || e.pointerType === 'touch') drag(e);
  }, { passive: true });
  // палец убрали — снова показываем, откуда продолжать
  $('sheet').addEventListener('pointerup', () => {
    $('pen').classList.remove('on');
    if (!locked && si < strokes.length) showStart();
  }, { passive: true });

  /* ── конец цифры ── */
  function finish() {
    locked = true;
    $('startdot').classList.add('hide');
    $('pen').classList.remove('on');
    $('paper').parentNode.classList.add('done');
    $('sheet').classList.add('done');
    yay(); buzz([20, 50, 20]);
    const w = NUM[digit];
    $('say').textContent = w ? w.de : String(digit);
    setTimeout(() => say(w), 260);

    done++;
    paintStars();
    if (done >= ORDER.length) { setTimeout(party, 1100); return; }
    setTimeout(next, 1800);
  }

  function party() {
    fanfare(); buzz([20, 60, 20, 60, 40]);
    const box = $('party');
    const colors = ['#FFD86E', '#E8782F', '#8FD3FF', '#7FC8A9', '#2FA39B'];
    for (let i = 0; i < 70; i++) {
      const c = document.createElement('i');
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
      c.style.animationDelay = (Math.random() * 0.7) + 's';
      box.appendChild(c);
    }
    setTimeout(() => { box.innerHTML = ''; }, 4200);
    done = 0;
    paintStars();
    setTimeout(next, 3200);
  }

  /* ── следующая цифра ── */
  function next() {
    if (mode === 'mix') {
      let d = digit;
      let guard = 0;
      while (d === digit && guard++ < 20) d = ORDER[Math.floor(Math.random() * ORDER.length)];
      digit = d;
    } else {
      idx = (idx + 1) % ORDER.length;
      digit = ORDER[idx];
    }
    start();
  }

  function start() {
    $('sheet').classList.remove('done');
    $('paper').parentNode.classList.remove('done');
    $('say').textContent = '';
    $('hint').textContent = 'веди от зелёной точки';
    draw();
    locked = false;
    load(NUM[digit]);
  }

  $('btnAgain').addEventListener('click', () => { initAudio(); start(); });
  $('btnNext').addEventListener('click', () => { initAudio(); next(); });

  function paintStars() {
    let h = '';
    for (let i = 0; i < ORDER.length; i++) h += '<i class="' + (i < done ? 'on' : '') + '"></i>';
    $('stars').innerHTML = h;
  }

  /* ── порядок цифр ── */
  function paintSizes() {
    const list = [['row', 'по порядку'], ['mix', 'вперемешку']];
    $('sizes').innerHTML = list.map(m =>
      '<button class="size' + (m[0] === mode ? ' on' : '') + '" data-m="' + m[0] + '">' +
      m[1] + '</button>').join('');
  }
  $('sizes').addEventListener('click', e => {
    const b = e.target.closest('.size');
    if (!b) return;
    mode = b.dataset.m;
    store.set(K_MODE, mode);
    paintSizes();
    initAudio();
    tone('sine', 700, 0, 0.08, 0.16, 1000);
  });

  /* ── старт ── */
  function goFullscreen() {
    // Установленная игра и так во весь экран. Запрос полноэкранного режима
    // добавляет только системную подсказку «проведите сверху вниз и нажмите
    // Назад» — ребёнок её не уберёт.
    try {
      if ((window.matchMedia && (matchMedia('(display-mode: fullscreen)').matches ||
           matchMedia('(display-mode: standalone)').matches)) || navigator.standalone) return;
    } catch (e) {}
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!fn || document.fullscreenElement) return;
    try {
      const p = fn.call(el, { navigationUI: 'hide' });
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  $('btnStart').addEventListener('click', () => {
    goFullscreen();
    initAudio();
    $('veil').classList.add('hidden');
    done = 0;
    paintStars();
    idx = 0; digit = ORDER[0];
    setTimeout(start, 60);
  });

  let lastH = 0;
  function relayout() {
    [0, 120, 350, 800].forEach(ms => setTimeout(() => {
      const h = window.innerHeight;
      if (ms && h === lastH) return;
      lastH = h;
      resize();
    }, ms));
  }
  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', relayout);
  document.addEventListener('fullscreenchange', relayout);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', relayout);

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && actx && actx.state === 'suspended') actx.resume();
  });

  mode = store.get(K_MODE, 'row') === 'mix' ? 'mix' : 'row';
  paintSizes();
  paintStars();
  digit = ORDER[0];
  draw();
  locked = true;
})();
</script>
