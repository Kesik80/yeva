<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fangen</title>
<meta name="theme-color" content="#F2A65A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/icons/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<meta name="apple-mobile-web-app-title" content="YEVA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  html{background:#F2A65A}
  body{
    position:fixed;inset:0;
    font-family:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:#4A2B10;
    background:linear-gradient(180deg,#F2A65A 0%,#F8C98A 38%,#FBE3C0 70%,#FDF4E6 100%);
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 9px) 10px calc(env(safe-area-inset-bottom,0px) + 9px);
  }

  /* ── верхняя полоса ── */
  .top{display:flex;align-items:center;gap:6px;flex:none}
  .track{
    position:relative;flex:1;min-width:0;height:38px;border-radius:999px;overflow:hidden;
    background:rgba(255,255,255,.76);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(74,43,16,.16);
  }
  .track .fill{
    position:absolute;left:0;top:0;bottom:0;width:0;
    background:linear-gradient(90deg,#9FDB74,#56B94B);transition:width .3s ease;
  }
  .track .marks{position:absolute;inset:0;pointer-events:none}
  .track .marks i{
    position:absolute;top:76%;width:8px;height:8px;margin:-4px 0 0 -4px;
    border-radius:50%;background:rgba(74,43,16,.22);
    transition:background .3s,transform .3s,box-shadow .3s;
  }
  .track .marks i.on{background:#fff;transform:scale(1.25);box-shadow:0 0 0 2px rgba(86,185,75,.95)}
  .track .cnt{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:13px;font-weight:600;color:#4A2B10;font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .track .cnt b{color:#B0591A;font-weight:600}

  .hp{
    flex:none;display:flex;gap:2.5px;align-items:center;
    background:rgba(255,255,255,.76);border-radius:999px;padding:10px 9px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(74,43,16,.16);font-size:13px;line-height:1;
  }
  .hp i{font-style:normal;color:#E8566B;transition:opacity .3s,transform .3s,color .3s}
  .hp i.off{opacity:.2;color:#4A2B10;transform:scale(.78)}
  .hp i.bye{animation:hbye .55s ease-out}
  .hp i.back{animation:hback .6s ease-out}
  @keyframes hbye{0%{transform:scale(1.5);opacity:1}35%{transform:scale(1.5) rotate(12deg)}
    100%{transform:scale(.78);opacity:.2}}
  @keyframes hback{0%{transform:scale(.78);opacity:.2}45%{transform:scale(1.6);opacity:1}
    100%{transform:scale(1);opacity:1}}

  .btn{
    width:40px;height:40px;flex:none;border:0;border-radius:50%;
    background:rgba(255,255,255,.76);color:#4A2B10;text-decoration:none;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(74,43,16,.17);
    display:grid;place-items:center;cursor:pointer;transition:transform .12s;
  }
  .btn:active{transform:scale(.9)}
  .btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  /* ── поле ── */
  .stage{
    flex:1;min-height:0;position:relative;overflow:hidden;
    margin-top:9px;border-radius:24px;cursor:grab;touch-action:none;
    background:
      radial-gradient(90% 46% at 50% 100%, rgba(150,214,120,.95), rgba(150,214,120,0) 70%),
      linear-gradient(180deg,#BFE9FB 0%,#DDF3FD 52%,#F2FBE8 100%);
    box-shadow:inset 0 2px 14px rgba(74,43,16,.1);
  }
  .stage:active{cursor:grabbing}
  .cloud{position:absolute;border-radius:999px;background:rgba(255,255,255,.72);pointer-events:none}
  .grass{
    position:absolute;left:-20px;right:-20px;bottom:-18px;height:40px;border-radius:14px;
    background:linear-gradient(180deg,#8FD16A,#5FA83F);
    box-shadow:0 -3px 0 rgba(255,255,255,.3) inset;pointer-events:none;
  }

  /* ── корзина ── */
  .basket{position:absolute;pointer-events:none;will-change:transform}
  .basket .mouth{
    position:absolute;left:0;right:0;top:0;height:26%;border-radius:999px;
    background:linear-gradient(180deg,#C98B4B,#A96B30);
    box-shadow:0 2px 0 rgba(255,255,255,.3) inset;
  }
  .basket .body{
    position:absolute;left:5%;right:5%;top:17%;bottom:0;
    border-radius:8px 8px 46% 46%/8px 8px 34% 34%;
    background:
      repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 7px,transparent 7px 14px),
      linear-gradient(180deg,#E0A862,#B9793A);
    box-shadow:0 6px 14px rgba(74,43,16,.28),inset 0 -6px 0 rgba(0,0,0,.1);
  }
  .basket.hit .body{animation:bump .3s}
  @keyframes bump{0%{transform:scaleY(1)}40%{transform:scaleY(.86) scaleX(1.06)}100%{transform:scaleY(1)}}
  .basket.ouch .body{animation:ouch .4s}
  @keyframes ouch{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
    60%{transform:translateX(6px)}}

  /* ── падающие предметы ── */
  .it{
    position:absolute;display:grid;place-items:center;pointer-events:none;
    will-change:transform;line-height:1;
  }
  .it.bad{filter:drop-shadow(0 3px 5px rgba(74,43,16,.3))}
  .it.gone{animation:gone .3s forwards}
  @keyframes gone{to{transform:scale(1.5);opacity:0}}

  .pop{
    position:absolute;pointer-events:none;z-index:9;white-space:nowrap;
    font-size:clamp(16px,4.6vw,21px);font-weight:600;color:#2E7D32;
    text-shadow:0 2px 7px rgba(255,255,255,.95),0 0 3px rgba(255,255,255,.9);
    animation:rise .9s ease-out forwards;
  }
  .pop.bad{color:#C0392B}
  @keyframes rise{
    0%{opacity:0;transform:translate(-50%,0) scale(.8)}
    22%{opacity:1;transform:translate(-50%,-14px) scale(1.12)}
    100%{opacity:0;transform:translate(-50%,-60px) scale(1)}
  }

  /* слово висит вверху, в пустом небе: внизу оно налезало на корзину */
  .word{
    position:absolute;left:50%;top:10px;transform:translateX(-50%);
    font-size:clamp(15px,4.4vw,20px);font-weight:600;color:#4A2B10;
    background:rgba(255,255,255,.85);border-radius:999px;padding:6px 15px;
    box-shadow:0 5px 14px rgba(74,43,16,.16);pointer-events:none;
    opacity:0;transition:opacity .25s;white-space:nowrap;max-width:92%;
    overflow:hidden;text-overflow:ellipsis;
  }
  .word.on{opacity:1}

  .hand{
    position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);
    font-size:15px;font-weight:600;color:#4A2B10;pointer-events:none;
    background:rgba(255,255,255,.85);border-radius:999px;padding:8px 16px;
    box-shadow:0 5px 14px rgba(74,43,16,.16);
    animation:nudge 1.6s ease-in-out infinite;transition:opacity .3s;
  }
  .hand.gone{opacity:0}
  @keyframes nudge{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-62%)}}

  .flash{
    position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) scale(.7);
    font-size:clamp(21px,6.6vw,33px);font-weight:600;color:#4A2B10;opacity:0;
    background:rgba(255,255,255,.93);border-radius:999px;padding:9px 22px;
    box-shadow:0 10px 26px rgba(74,43,16,.26);
    pointer-events:none;white-space:nowrap;z-index:12;
  }
  .flash.go{animation:flash 1.1s ease-out forwards}
  @keyframes flash{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
    22%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
    70%{opacity:1;transform:translate(-50%,-62%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-78%) scale(1)}
  }

  .gift{
    position:absolute;left:50%;top:40%;opacity:0;z-index:13;pointer-events:none;
    font-size:clamp(54px,18vw,100px);line-height:1;
    filter:drop-shadow(0 10px 22px rgba(74,43,16,.32));
    transform:translate(-50%,-50%) scale(.3);
  }
  .gift.go{animation:gift 1.7s cubic-bezier(.2,1.2,.4,1) forwards}
  @keyframes gift{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-18deg)}
    20%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(7deg)}
    52%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
    100%{opacity:0;transform:translate(-50%,-146%) scale(.55)}
  }

  /* ── салют ── */
  .boom{position:absolute;left:0;top:0;z-index:11;pointer-events:none}
  .boom b{
    position:absolute;border-radius:50%;border:7px solid rgba(255,150,40,.95);
    box-shadow:0 0 18px rgba(255,190,90,.75),inset 0 0 14px rgba(255,220,150,.6);
    animation:boom-ring .62s cubic-bezier(.2,.8,.3,1) forwards;
  }
  .boom i{
    position:absolute;border-radius:50%;
    box-shadow:0 0 10px rgba(255,255,255,.9),0 1px 3px rgba(74,48,23,.35);
    animation:boom-dot .9s cubic-bezier(.15,.7,.3,1) forwards;
  }
  @keyframes boom-ring{
    from{transform:translate(-50%,-50%) scale(.2);opacity:.95}
    to{transform:translate(-50%,-50%) scale(2.2);opacity:0}
  }
  @keyframes boom-dot{
    from{transform:translate(-50%,-50%) scale(1);opacity:1}
    to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3);opacity:0}
  }
  .party{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
  .party i{position:absolute;width:12px;height:16px;border-radius:3px;animation:fall linear forwards}
  @keyframes fall{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(112vh) rotate(680deg)}}

  /* ── старт и итог ── */
  .veil{
    position:fixed;inset:0;z-index:20;display:flex;
    background:rgba(248,201,138,.5);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    transition:opacity .3s;padding:18px;
    overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  }
  .veil.hidden{opacity:0;pointer-events:none}
  .panel{
    width:100%;max-width:400px;text-align:center;margin:auto;flex:none;
    background:rgba(255,255,255,.84);border-radius:30px;padding:22px 20px 26px;
    box-shadow:0 18px 44px rgba(74,43,16,.24);
  }
  .panel h1{font-size:clamp(23px,6.6vw,30px);font-weight:600}
  .panel .ru{font-size:14px;color:rgba(74,43,16,.6);margin-top:2px}
  .stats{
    margin-top:14px;font-size:13.5px;line-height:1.55;color:rgba(74,43,16,.68);
    background:rgba(255,255,255,.6);border-radius:16px;padding:10px 12px;
  }
  .stats b{color:#4A2B10;font-weight:600}
  .stats button{
    width:auto;margin:8px auto 0;padding:6px 12px;font-size:12px;border-radius:9px;
    border:0;background:rgba(74,43,16,.08);color:rgba(74,43,16,.6);
    font-family:inherit;cursor:pointer;display:block;
  }
  .zoo{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:9px;font-size:21px;line-height:1.1}
  .zoo span{transition:opacity .3s}
  .zoo span.off{opacity:.26;filter:grayscale(1)}
  .tip{margin-top:11px;font-size:12px;line-height:1.5;color:rgba(74,43,16,.55);padding:0 4px}
  .big{
    margin:20px auto 0;width:min(40vw,150px);aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;
    display:grid;place-items:center;color:#4A2B10;
    background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.98),rgba(255,255,255,.3) 30%,rgba(255,216,110,.5) 58%,rgba(242,166,90,.45) 80%,rgba(255,255,255,.92) 100%);
    box-shadow:0 18px 44px rgba(74,43,16,.26),inset 0 0 34px rgba(255,255,255,.6);
    animation:float 3.6s ease-in-out infinite;
  }
  .big svg{width:34%;height:34%;fill:currentColor;stroke:none}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @media (max-height:560px){
    .panel{padding:14px 18px 16px}
    .panel h1{font-size:21px}
    .stats{margin-top:9px;font-size:12.5px}
    .zoo{font-size:16px;gap:2px;margin-top:6px}
    .tip{margin-top:7px}
    .big{margin-top:12px;width:min(24vh,104px)}
  }
  @media (prefers-reduced-motion:reduce){
    .big,.hand{animation:none}
    .boom{display:none}
  }
</style>
</head>
<body>

<script src="words.js"></script>

<div class="top">
  <div class="track" id="track">
    <i class="fill" id="pfill"></i>
    <span class="marks" id="marks"></span>
    <b class="cnt" id="cnt"></b>
  </div>
  <div class="hp" id="hp"></div>
  <button class="btn" id="btnAgain" aria-label="Заново">
    <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.6 5.9"/><path d="M20 4v7h-7"/></svg>
  </button>
  <a class="btn" href="index.html" aria-label="Домой">
    <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
  </a>
</div>

<div class="stage" id="stage">
  <div class="grass"></div>
  <div class="basket" id="basket">
    <div class="body"></div>
    <div class="mouth"></div>
  </div>
  <div class="boom" id="boom"></div>
  <div class="gift" id="gift"></div>
  <div class="flash" id="flash"></div>
  <div class="word" id="word"></div>
  <div class="hand" id="hand">Zieh den Korb!</div>
</div>

<div class="veil" id="veil">
  <div class="panel">
    <h1>Fangen</h1>
    <div class="ru">Ловилка</div>
    <div class="stats" id="stats"></div>
    <div class="tip">Веди корзинку пальцем. Лови всё съедобное — каждый пойманный
      фрукт называется по-немецки. Камни и всякий мусор лови не надо: за них
      сгорает сердце. За каждые десять пойманных — игрушка в коллекцию и сердце обратно</div>
    <button class="big" id="btnStart" aria-label="Играть">
      <svg viewBox="0 0 24 24"><path d="M8 4.8v14.4L20 12z"/></svg>
    </button>
  </div>
</div>

<div class="party" id="party"></div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const YW = window.YEVA_WORDS || null;
  const VOICE = 'voice/de/';

  const K_LV = 'yeva.fangen.level';
  const K_BEST = 'yeva.fangen.best';
  const K_PTS = 'yeva.fangen.points';
  const K_ZOO = 'yeva.fangen.zoo';

  // призы этой игры — игрушки, чтобы не путались с коллекцией «Башни»
  const ZOO = ['\u{1F697}', '\u{1F682}', '\u{1F680}', '\u{1F388}', '\u{1F9F8}', '\u{1FA81}',
               '\u{1F3B9}', '⛵', '\u{1F3F0}', '\u{1F3A0}', '\u{1FA80}', '\u{1F3BA}',
               '\u{1F6F4}', '\u{1F3AA}', '\u{1F996}', '\u{1F3A8}'];

  // ловить не надо: ничего из этого не едят, и слова у них не произносятся
  const JUNK = ['\u{1FAA8}', '\u{1F97E}', '\u{1F9F1}', '⚙️', '\u{1F335}'];

  const CFG = {
    basket: 0.27,   // ширина корзины от ширины поля
    size: 0.13,     // размер падающего предмета от ширины поля
    mouth: 0.46,    // половина ловчей ширины корзины
    sweet: 0.15,    // поймал ровно серединой — три очка
    base: 10,       // цель первого уровня
    step: 5,        // прибавка за уровень
    top: 30,        // выше цель не поднимается
    prize: 10,      // приз за каждые столько пойманных
    lives: 5,
    lvMax: 12
  };
  const goalFor = lv => Math.min(CFG.top, CFG.base + CFG.step * (lv - 1));
  // с уровнем предметы падают быстрее и чаще, мусора становится больше
  const fallSec = lv => Math.max(1.3, 2.75 - 0.17 * (lv - 1));
  const gapSec = lv => Math.max(0.58, 1.45 - 0.11 * (lv - 1));
  const junkRate = lv => Math.min(0.32, 0.1 + 0.027 * (lv - 1));

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* ── еда: только то, что уже записано голосом ── */
  const FOOD = (() => {
    if (!YW || !YW.pictured) return [];
    const skip = { 'der Mund': 1 };
    return YW.pictured.filter(w => (w.s === 'nom' || /Kuchen|Eis$/.test(w.de)) && !skip[w.de]);
  })();

  /* ── звук ── */
  let actx = null, master = null;
  const vBuf = {}, vBad = {}, vHot = {};

  function initAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.3;
    master.connect(actx.destination);
  }

  const vUrl = w => VOICE + (YW && YW.slug ? YW.slug(w) : w.de) + '.mp3';

  function loadVoice(w) {
    if (!actx || !w) return;
    const u = vUrl(w);
    if (vBuf[u] || vBad[u] || vHot[u]) return;
    vHot[u] = 1;
    fetch(u)
      .then(r => r.ok ? r : fetch(u + '?v=' + Date.now(), { cache: 'no-store' }))
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(ab => actx.decodeAudioData(ab))
      .then(b => { vBuf[u] = b; })
      .catch(e => { vBad[u] = true; console.warn('[voice] нет ' + u + ' — ' + e.message); });
  }

  function say(w) {
    if (!actx || !w) return;
    const u = vUrl(w);
    if (!vBuf[u] && !vBad[u]) loadVoice(w);
    let tries = 0;
    (function wait() {
      if (vBuf[u]) {
        const src = actx.createBufferSource(), g = actx.createGain();
        g.gain.value = 1.25;
        src.buffer = vBuf[u];
        src.connect(g); g.connect(master);
        src.start();
        return;
      }
      if (!vBad[u] && tries++ < 6) { setTimeout(wait, 110); return; }
      try {
        if (typeof speechSynthesis === 'undefined') return;
        speechSynthesis.cancel();
        const ut = new SpeechSynthesisUtterance(w.de);
        ut.lang = 'de-DE'; ut.rate = 0.9; ut.pitch = 1.15;
        speechSynthesis.speak(ut);
      } catch (e) {}
    })();
  }

  function tone(type, freq, at, dur, vol, to) {
    if (!actx) return;
    const t = actx.currentTime + at;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur * 0.9);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  }

  const nom = () => { tone('triangle', 620, 0, 0.09, 0.3, 920); tone('sine', 300, 0.04, 0.12, 0.22); };
  const sweet = () => { nom(); tone('triangle', 1320, 0.1, 0.16, 0.22, 1760); };
  const ouch = () => { tone('sawtooth', 260, 0, 0.26, 0.26, 70); tone('square', 130, 0.03, 0.2, 0.14); };
  const yay = () => [523, 659, 784, 1046].forEach((f, i) => tone('triangle', f, i * 0.1, 0.3, 0.3));
  const sad = () => [392, 330, 262].forEach((f, i) => tone('triangle', f, i * 0.14, 0.3, 0.26));
  const buzz = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };

  /* ── размеры ── */
  let SW = 0, SH = 0, BW = 0, BH = 0, IS = 0, baseY = 0;
  function measure() {
    const r = $('stage').getBoundingClientRect();
    SW = r.width; SH = r.height;
    BW = Math.max(60, Math.min(170, Math.round(SW * CFG.basket)));
    BH = Math.round(BW * 0.62);
    IS = Math.max(28, Math.min(80, Math.round(SW * CFG.size)));
    baseY = Math.round(SH - BH - 14);        // верх корзины
    const b = $('basket');
    b.style.width = BW + 'px';
    b.style.height = BH + 'px';
    b.style.top = baseY + 'px';
    b.style.left = (-BW / 2) + 'px';
  }

  /* ── состояние ── */
  let level = 1, best = 0, target = CFG.base;
  let pts = 0, bestPts = 0, zoo = [], life = 0;
  let caught = 0;                 // пойманной еды за раунд
  let items = [], bx = 0, wantX = 0;
  let phase = 'wait';             // wait | play | over | won
  let raf = 0, last = 0, since = 0, nextGap = 0;
  let calm = false;               // для тестов: остановить самосев
  let timers = [];
  const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
  const clearLater = () => { timers.forEach(clearTimeout); timers = []; };

  function paintProgress() {
    $('pfill').style.width = Math.min(100, caught / target * 100).toFixed(1) + '%';
    $('cnt').innerHTML = caught + ' / ' + target + ' <b>◆ ' + pts + '</b>';
    const box = $('marks');
    const want = [];
    for (let p = CFG.prize; p < target; p += CFG.prize) want.push(p);
    if (box.children.length !== want.length) {
      box.innerHTML = '';
      want.forEach(p => {
        const i = document.createElement('i');
        i.style.left = (p / target * 100).toFixed(1) + '%';
        box.appendChild(i);
      });
    }
    want.forEach((p, i) => box.children[i].classList.toggle('on', caught >= p));
  }

  function anim(el, cls) {
    if (!el) return;
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function paintLives(hit) {
    const box = $('hp');
    if (box.children.length !== CFG.lives) {
      box.innerHTML = '';
      for (let i = 0; i < CFG.lives; i++) {
        const el = document.createElement('i');
        el.textContent = '♥';
        box.appendChild(el);
      }
    }
    for (let i = 0; i < CFG.lives; i++) box.children[i].classList.toggle('off', i >= life);
    if (hit === 'bye' && life >= 0 && life < CFG.lives) anim(box.children[life], 'bye');
    if (hit === 'back' && life > 0) anim(box.children[life - 1], 'back');
  }

  const zooHtml = () => '<div class="zoo">' + ZOO.map((e, i) =>
    '<span' + (zoo.indexOf(i) >= 0 ? '' : ' class="off"') + '>' + e + '</span>').join('') + '</div>';

  function flash(text) {
    const f = $('flash');
    f.textContent = text;
    anim(f, 'go');
  }

  function pop(text, x, y, bad) {
    const el = document.createElement('div');
    el.className = 'pop' + (bad ? ' bad' : '');
    el.textContent = text;
    el.style.left = Math.round(x) + 'px';
    el.style.top = Math.round(Math.max(20, y)) + 'px';
    $('stage').appendChild(el);
    setTimeout(() => el.remove(), 950);
  }

  /* ── предметы ── */
  function spawn() {
    const bad = FOOD.length === 0 || Math.random() < junkRate(level);
    const el = document.createElement('div');
    el.className = 'it' + (bad ? ' bad' : '');
    el.style.width = IS + 'px';
    el.style.height = IS + 'px';
    el.style.fontSize = Math.round(IS * 0.86) + 'px';
    const word = bad ? null : FOOD[Math.floor(Math.random() * FOOD.length)];
    el.textContent = bad ? JUNK[Math.floor(Math.random() * JUNK.length)] : word.e;
    const pad = IS * 0.7;
    const x = pad + Math.random() * Math.max(1, SW - pad * 2);
    const it = { el: el, x: x, y: -IS, v: (baseY + IS) / fallSec(level), bad: bad, word: word };
    el.style.transform = 'translate(' + (x - IS / 2).toFixed(1) + 'px,' + it.y.toFixed(1) + 'px)';
    $('stage').appendChild(el);
    items.push(it);
    if (word) loadVoice(word);
  }

  function drop(it, i) {
    it.el.remove();
    items.splice(i, 1);
  }

  function catchIt(it, i) {
    const dx = Math.abs(it.x - bx);
    it.el.classList.add('gone');
    const el = it.el;
    setTimeout(() => el.remove(), 320);
    items.splice(i, 1);

    if (it.bad) {
      anim($('basket'), 'ouch');
      ouch(); buzz([40, 70, 40]);
      life--;
      paintLives('bye');
      pop('−♥', it.x, baseY - 26, true);
      pts = Math.max(0, pts - 1);
      paintProgress();
      if (life <= 0) { later(() => finish('lives'), 520); flash('Vorbei!'); }
      return;
    }

    anim($('basket'), 'hit');
    $('hand').classList.add('gone');
    caught++;
    const dead = dx <= BW * CFG.sweet;
    pts += dead ? 3 : 1;
    if (dead) { sweet(); pop('+3', it.x, baseY - 26); } else { nom(); pop('+1', it.x, baseY - 26); }
    buzz(dead ? [10, 30, 10] : 14);
    say(it.word);
    showWord(it.word);
    if (caught > best) { best = caught; store.set(K_BEST, best); }
    if (pts > bestPts) { bestPts = pts; store.set(K_PTS, bestPts); }
    paintProgress();

    const gift = caught % CFG.prize === 0 ? givePrize(it.x) : false;
    if (caught >= target) { later(win, gift ? 1200 : 420); phase = 'won'; }
  }

  let wordTimer = 0;
  function showWord(w) {
    if (!w) return;
    const el = $('word');
    el.textContent = w.de;
    el.classList.add('on');
    clearTimeout(wordTimer);
    wordTimer = setTimeout(() => el.classList.remove('on'), 1400);
  }

  /* ── приз ── */
  function givePrize(x) {
    let idx;
    if (zoo.length < ZOO.length) { idx = zoo.length; zoo.push(idx); store.set(K_ZOO, zoo.join(',')); }
    else idx = Math.floor(Math.random() * ZOO.length);
    const g = $('gift');
    g.textContent = ZOO[idx];
    anim(g, 'go');
    boom(x, baseY - 40);
    confetti(26);
    yay(); buzz([15, 40, 15, 40, 15]);
    if (life < CFG.lives) {
      life++;
      paintLives('back');
      tone('triangle', 740, 0.5, 0.18, 0.2, 1180);
    }
    return true;
  }

  let boomClear = 0;
  function boom(x, y) {
    const box = $('boom');
    clearTimeout(boomClear);
    box.innerHTML = '';
    box.style.left = Math.round(x) + 'px';
    box.style.top = Math.round(y) + 'px';
    const d = Math.round(Math.min(SW, SH) * 0.34);
    [0, 0.14].forEach(delay => {
      const ring = document.createElement('b');
      ring.style.width = ring.style.height = Math.round(d * (delay ? 0.62 : 1)) + 'px';
      ring.style.animationDelay = delay + 's';
      box.appendChild(ring);
    });
    const C = ['#E8705C', '#F0A24B', '#5FC45A', '#4FC3A1', '#58B8E8', '#8E86E0', '#E880A8'];
    for (let i = 0; i < 30; i++) {
      const dot = document.createElement('i');
      const ang = Math.random() * Math.PI * 2;
      const dist = d * (0.45 + Math.random() * 0.95);
      const sz = Math.max(7, Math.round(d * (0.05 + Math.random() * 0.08)));
      dot.style.width = dot.style.height = sz + 'px';
      dot.style.background = C[i % C.length];
      dot.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(0) + 'px');
      dot.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(0) + 'px');
      dot.style.animationDelay = (Math.random() * 0.12).toFixed(2) + 's';
      box.appendChild(dot);
    }
    boomClear = setTimeout(() => { box.innerHTML = ''; }, 1200);
  }

  function confetti(n) {
    const box = $('party');
    const C = ['#E8705C', '#F0A24B', '#5FC45A', '#4FC3A1', '#58B8E8', '#8E86E0', '#E880A8'];
    for (let i = 0; i < n; i++) {
      const c = document.createElement('i');
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.background = C[i % C.length];
      c.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
      c.style.animationDelay = (Math.random() * 0.6) + 's';
      box.appendChild(c);
    }
    setTimeout(() => { box.innerHTML = ''; }, 4200);
  }

  /* ── конец раунда ── */
  function clearItems() {
    items.forEach(it => it.el.remove());
    items = [];
  }

  function finish(why) {
    phase = 'over';
    clearItems();
    sad();
    later(() => {
      $('stats').innerHTML = 'Поймано <b>' + caught + '</b> · очков <b>' + pts + '</b><br>' +
        'Рекорд: <b>' + best + '</b> за раунд, <b>' + bestPts + '</b> очков<br>' +
        '<span style="opacity:.75">' + (why === 'lives'
          ? 'Сердца кончились — уровень остаётся, попробуй ещё раз'
          : 'Попробуй ещё раз') + '</span>' + zooHtml();
      $('veil').classList.remove('hidden');
    }, 1100);
  }

  function win() {
    phase = 'won';
    clearItems();
    yay(); buzz([20, 50, 20, 50, 20]);
    boom(SW / 2, SH * 0.42);
    confetti(48);
    flash('Super!');
    if (level < CFG.lvMax) level++;
    store.set(K_LV, level);
    later(() => {
      flash('Stufe ' + level + ' · ' + goalFor(level));
      tone('triangle', 880, 0, 0.2, 0.25, 1320);
    }, 1200);
    later(round, 2600);
  }

  /* ── ход времени ── */
  function tick(t) {
    raf = requestAnimationFrame(tick);
    const dt = Math.min(0.05, (t - last) / 1000 || 0);
    last = t;

    // корзина догоняет палец — так движение мягче дёрганого прыжка
    bx += (wantX - bx) * Math.min(1, dt * 18);
    $('basket').style.transform = 'translateX(' + bx.toFixed(1) + 'px)';

    if (phase !== 'play') return;

    since += dt;
    if (!calm && since >= nextGap) {
      since = 0;
      nextGap = gapSec(level) * (0.75 + Math.random() * 0.5);
      spawn();
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.v * dt;
      it.el.style.transform = 'translate(' + (it.x - IS / 2).toFixed(1) + 'px,' + it.y.toFixed(1) + 'px)';
      // ловчая зона — горловина корзины
      if (it.y + IS * 0.55 >= baseY && it.y < baseY + BH * 0.6) {
        if (Math.abs(it.x - bx) <= BW * CFG.mouth) { catchIt(it, i); continue; }
      }
      if (it.y > SH + IS) drop(it, i);
    }
  }

  /* ── раунд ── */
  function round() {
    clearLater();
    clearItems();
    caught = 0; pts = 0;
    life = CFG.lives;
    target = goalFor(level);
    since = 0;
    nextGap = 0.5;
    $('gift').classList.remove('go');
    $('word').classList.remove('on');
    paintProgress(); paintLives();
    phase = 'play';
  }

  function clouds() {
    const st = $('stage');
    st.querySelectorAll('.cloud').forEach(c => c.remove());
    for (let i = 0; i < 3; i++) {
      const c = document.createElement('div');
      const w = SW * (0.18 + Math.random() * 0.2);
      c.className = 'cloud';
      c.style.width = w + 'px';
      c.style.height = (w * 0.34) + 'px';
      c.style.left = (Math.random() * 74) + '%';
      c.style.top = (8 + Math.random() * 36) + '%';
      c.style.opacity = (0.3 + Math.random() * 0.3).toFixed(2);
      st.appendChild(c);
    }
  }

  function start() {
    initAudio();
    FOOD.slice(0, 8).forEach(loadVoice);
    $('veil').classList.add('hidden');
    measure();
    clouds();
    bx = wantX = SW / 2;
    round();
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
  }

  /* ── палец ── */
  function aim(e) {
    const r = $('stage').getBoundingClientRect();
    wantX = Math.max(BW / 2, Math.min(SW - BW / 2, e.clientX - r.left));
    $('hand').classList.add('gone');
  }
  const st = $('stage');
  st.addEventListener('pointerdown', e => {
    e.preventDefault();
    initAudio();
    try { st.setPointerCapture(e.pointerId); } catch (err) {}
    aim(e);
  });
  st.addEventListener('pointermove', e => {
    if (e.pressure === 0 && e.pointerType === 'touch') return;
    if (e.buttons || e.pointerType === 'touch') aim(e);
  });
  document.addEventListener('keydown', e => {
    const step = SW * 0.12;
    if (e.key === 'ArrowLeft') { wantX = Math.max(BW / 2, wantX - step); e.preventDefault(); }
    if (e.key === 'ArrowRight') { wantX = Math.min(SW - BW / 2, wantX + step); e.preventDefault(); }
  });

  $('btnStart').addEventListener('click', start);
  $('btnAgain').addEventListener('click', () => {
    if (!$('veil').classList.contains('hidden')) return;
    round();
  });

  let rz = 0;
  window.addEventListener('resize', () => {
    clearTimeout(rz);
    rz = setTimeout(() => {
      const oldW = SW || 1;
      measure();
      clouds();
      const k = SW / oldW;
      bx *= k; wantX *= k;
      items.forEach(it => { it.x *= k; it.v = (baseY + IS) / fallSec(level); });
    }, 180);
  });

  /* ── первый экран ── */
  level = Math.max(1, Math.min(CFG.lvMax, +store.get(K_LV, 1) || 1));
  best = Math.max(0, +store.get(K_BEST, 0) || 0);
  bestPts = Math.max(0, +store.get(K_PTS, 0) || 0);
  zoo = String(store.get(K_ZOO, '')).split(',')
    .filter(v => v !== '')
    .map(v => +v)
    .filter(v => Number.isInteger(v) && v >= 0 && v < ZOO.length);
  measure();
  target = goalFor(level);
  life = CFG.lives;
  paintProgress(); paintLives();

  function panel() {
    $('stats').innerHTML = 'Уровень <b>' + level + '</b> · поймать <b>' + target + '</b><br>' +
      'Рекорд: <b>' + best + '</b> за раунд, <b>' + bestPts + '</b> очков<br>' +
      '<span style="opacity:.75">Игрушек собрано: <b>' + zoo.length + '</b> из ' + ZOO.length + '</span>' +
      zooHtml() +
      (level > 1 || best || zoo.length ? '<button id="btnReset">начать сначала</button>' : '');
    const rst = $('btnReset');
    if (rst) rst.addEventListener('click', () => {
      level = 1; best = 0; bestPts = 0; zoo = [];
      store.set(K_LV, 1); store.set(K_BEST, 0); store.set(K_PTS, 0); store.set(K_ZOO, '');
      target = goalFor(1);
      paintProgress(); panel();
    });
  }
  panel();

  window.YEVA_FANG = {
    state: () => ({ phase: phase, level: level, target: target, caught: caught, pts: pts,
                    life: life, best: best, bestPts: bestPts, zoo: zoo.slice(),
                    bx: bx, BW: BW, IS: IS, baseY: baseY, SW: SW, SH: SH,
                    food: FOOD.length,
                    items: items.map(i => ({ x: i.x, y: i.y, bad: i.bad, de: i.word ? i.word.de : null })) }),
    calm: on => { calm = !!on; },
    moveTo: x => { wantX = Math.max(BW / 2, Math.min(SW - BW / 2, x)); bx = wantX; },
    // для тестов: уронить предмет точно в заданное место
    put: (bad, x) => {
      const before = items.length;
      spawn();
      const it = items[items.length - 1];
      if (items.length === before) return null;
      it.bad = !!bad;
      it.el.className = 'it' + (bad ? ' bad' : '');
      if (bad) { it.word = null; it.el.textContent = JUNK[0]; }
      else if (!it.word) { it.word = FOOD[0]; it.el.textContent = FOOD[0].e; }
      it.x = typeof x === 'number' ? x : it.x;
      it.y = baseY - IS;
      return it.word ? it.word.de : null;
    }
  };
})();
</script>
<script src="install.js"></script>
<script src="console.js"></script>
</body>
