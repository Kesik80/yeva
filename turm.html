<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Turm</title>
<meta name="theme-color" content="#5FB4E8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/icons/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<meta name="apple-mobile-web-app-title" content="YEVA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  html{background:#5FB4E8}
  body{
    position:fixed;inset:0;
    font-family:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:#15384F;
    background:linear-gradient(180deg,#3C9BD6 0%,#6CC0EC 42%,#A9DCF5 72%,#DCF1FB 100%);
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 9px) 10px calc(env(safe-area-inset-bottom,0px) + 9px);
  }

  /* ── верхняя полоса ── */
  .top{display:flex;align-items:center;gap:8px;flex:none}
  /* Полоса вместо точек: целей теперь до тридцати блоков, тридцать
     точек в строку не влезают. На полосе отмечены места призов —
     видно, сколько осталось до следующего зверя. */
  .track{
    position:relative;flex:1;min-width:0;height:38px;border-radius:999px;overflow:hidden;
    background:rgba(255,255,255,.72);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(21,56,79,.14);
  }
  .track .fill{
    position:absolute;left:0;top:0;bottom:0;width:0;
    background:linear-gradient(90deg,#FFD86E,#F2913A);transition:width .35s ease;
  }
  .track .marks{position:absolute;inset:0;pointer-events:none}
  /* отметки у нижнего края: полоса на телефоне узкая, по центру они
     налезали на счёт */
  .track .marks i{
    position:absolute;top:76%;width:8px;height:8px;margin:-4px 0 0 -4px;
    border-radius:50%;background:rgba(21,56,79,.22);
    transition:background .3s,transform .3s,box-shadow .3s;
  }
  .track .marks i.on{background:#fff;transform:scale(1.25);box-shadow:0 0 0 2px rgba(242,145,58,.95)}
  .track .cnt{
    position:absolute;inset:0;display:grid;place-items:center;
    font-size:13.5px;font-weight:600;color:#15384F;font-variant-numeric:tabular-nums;
  }
  .score{
    flex:none;display:flex;gap:8px;align-items:center;
    background:rgba(255,255,255,.72);border-radius:999px;padding:9px 11px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(21,56,79,.14);
    font-size:14.5px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;
  }
  .score .lv{color:#1F7FB8}
  .score .bs{color:#C47E1A}

  .btn{
    width:44px;height:44px;flex:none;border:0;border-radius:50%;
    background:rgba(255,255,255,.72);color:#15384F;text-decoration:none;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(21,56,79,.15);
    display:grid;place-items:center;cursor:pointer;transition:transform .12s;
  }
  .btn:active{transform:scale(.9)}
  .btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  /* ── игровое поле ── */
  .stage{
    flex:1;min-height:0;position:relative;overflow:hidden;
    margin-top:9px;border-radius:24px;cursor:pointer;
    background:
      radial-gradient(120% 60% at 50% 104%, rgba(255,240,200,.5), transparent 60%),
      linear-gradient(180deg,#8FD0F2 0%,#BBE4F8 55%,#E8F6FD 100%);
    box-shadow:inset 0 2px 14px rgba(21,56,79,.1);
  }

  .cloud{position:absolute;border-radius:999px;background:rgba(255,255,255,.72);pointer-events:none}

  /* ── кран ── */
  .rail{
    position:absolute;left:0;right:0;height:9px;border-radius:0 0 6px 6px;
    background:linear-gradient(180deg,#6C7F8E,#495C6B);
    box-shadow:0 3px 0 rgba(21,56,79,.16);
  }
  .cart{position:absolute;width:38px;height:17px;margin-left:-19px;border-radius:5px;
    background:linear-gradient(180deg,#FFD05A,#E8982C);
    box-shadow:0 3px 7px rgba(21,56,79,.26)}
  .rope{position:absolute;left:50%;top:15px;width:3px;margin-left:-1.5px;
    background:rgba(40,60,74,.75);border-radius:2px;transform-origin:50% 0}
  .hook{position:absolute;left:50%;bottom:-9px;width:15px;height:13px;margin-left:-7.5px;
    border:3px solid rgba(40,60,74,.85);border-top:0;border-radius:0 0 9px 9px}

  /* ── блок ── */
  .blk{
    position:absolute;border-radius:11px;display:grid;place-items:center;
    font-size:0;font-weight:600;color:rgba(255,255,255,.95);
    text-shadow:0 2px 3px rgba(21,56,79,.3);
    box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(0,0,0,.14),
               0 3px 8px rgba(21,56,79,.2);
  }
  /* цифра поверх накладок у бочки и сундука */
  .blk span{position:relative;z-index:1}

  /* ── узоры ──────────────────────────────────────────────────
     Все блоки строго прямоугольные с плоским верхом и низом: круглые
     бока разрушали ощущение, что блоки лежат друг на друге. Разница
     только в накладках и размере. */
  .blk.f1{border-radius:7px}
  .blk.f1::before{content:'';position:absolute;inset:14%;border-radius:4px;
    border:2.5px solid rgba(255,255,255,.34)}
  .blk.f2::before{content:'';position:absolute;left:0;right:0;top:0;height:32%;
    border-radius:10px 10px 0 0;background:rgba(255,255,255,.26);
    border-bottom:2px solid rgba(255,255,255,.3)}
  .blk.f3{border-radius:8px}
  .blk.f3::before{content:'';position:absolute;inset:0;border-radius:8px;
    background:linear-gradient(90deg,transparent 30%,rgba(255,255,255,.26) 30%,
      rgba(255,255,255,.26) 35%,transparent 35%,transparent 65%,
      rgba(255,255,255,.26) 65%,rgba(255,255,255,.26) 70%,transparent 70%)}
  .blk.f4::before{content:'';position:absolute;inset:0;border-radius:10px;
    background:linear-gradient(180deg,transparent 24%,rgba(255,255,255,.26) 24%,
      rgba(255,255,255,.26) 32%,transparent 32%,transparent 68%,
      rgba(255,255,255,.26) 68%,rgba(255,255,255,.26) 76%,transparent 76%)}
  /* косая штриховка: цоколь снизу слишком походил на крышку сверху */
  .blk.f5{border-radius:13px;overflow:hidden}
  .blk.f5::before{content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,255,255,.2) 10px 20px)}

  /* каждый десятый — призовой, его видно заранее */
  .blk.gold{
    background:linear-gradient(160deg,#FFE792,#EFA324);
    box-shadow:inset 0 3px 0 rgba(255,255,255,.6),inset 0 -4px 0 rgba(150,86,0,.22),
               0 0 0 3px rgba(255,255,255,.6),0 4px 16px rgba(240,168,44,.65);
    color:#6B3C00;text-shadow:0 1px 0 rgba(255,255,255,.5);
  }
  .blk{transition:left .25s ease}
  .blk.live{z-index:6;transition:none}
  /* качается сам блок вокруг своей середины: его место не меняется */
  .blk.wob{animation:wob 1.25s ease-in-out infinite}
  @keyframes wob{0%,100%{transform:rotate(var(--t))}50%{transform:rotate(calc(var(--t) * 1.5))}}
  .blk.pop{animation:pop .34s cubic-bezier(.3,1.5,.5,1)}
  @keyframes pop{0%{transform:scaleY(.72) scaleX(1.1)}60%{transform:scaleY(1.06) scaleX(.97)}100%{transform:none}}
  .blk.drop{transition:transform .7s cubic-bezier(.3,.1,.7,.5),opacity .5s ease-in .2s;opacity:0}

  /* ── башня ── */
  /* башня стоит на траве в 22 px от низа поля, иначе нижний блок
     срезается краем и выглядит утонувшим */
  .world{position:absolute;left:0;right:0;bottom:22px;height:0;transition:transform .45s cubic-bezier(.3,0,.2,1)}
  .tower{position:absolute;left:0;right:0;bottom:0;height:0}
  .ground{
    position:absolute;left:-20px;right:-20px;bottom:-24px;height:28px;border-radius:10px;
    background:linear-gradient(180deg,#8FD16A,#5FA83F);
    box-shadow:0 -3px 0 rgba(255,255,255,.32) inset;
  }

  /* ── подсказки поверх поля ── */
  .hand{
    position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
    font-size:15px;font-weight:600;color:#15384F;pointer-events:none;
    background:rgba(255,255,255,.8);border-radius:999px;padding:7px 15px;
    box-shadow:0 5px 14px rgba(21,56,79,.16);
    animation:nudge 1.5s ease-in-out infinite;transition:opacity .3s;
  }
  .hand.gone{opacity:0}
  @keyframes nudge{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-7px)}}

  /* плашкой, а не голым текстом: белое по светлому небу не читается */
  .flash{
    position:absolute;left:50%;top:36%;transform:translate(-50%,-50%) scale(.7);
    font-size:clamp(21px,6.6vw,33px);font-weight:600;color:#15384F;opacity:0;
    background:rgba(255,255,255,.93);border-radius:999px;padding:9px 22px;
    box-shadow:0 10px 26px rgba(21,56,79,.26);
    pointer-events:none;white-space:nowrap;
  }
  .flash.go{animation:flash 1.1s ease-out forwards}
  @keyframes flash{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
    22%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
    70%{opacity:1;transform:translate(-50%,-62%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-78%) scale(1)}
  }

  /* очки за точное попадание всплывают над блоком */
  .plus{
    position:absolute;font-size:clamp(17px,5vw,23px);font-weight:600;color:#1C8F6E;
    pointer-events:none;z-index:11;white-space:nowrap;
    text-shadow:0 2px 7px rgba(255,255,255,.95),0 0 3px rgba(255,255,255,.9);
    animation:rise .95s ease-out forwards;
  }
  @keyframes rise{
    0%{opacity:0;transform:translate(-50%,0) scale(.8)}
    22%{opacity:1;transform:translate(-50%,-14px) scale(1.12)}
    100%{opacity:0;transform:translate(-50%,-62px) scale(1)}
  }

  /* приз за каждые десять блоков */
  .gift{
    position:absolute;left:50%;top:42%;opacity:0;z-index:13;pointer-events:none;
    font-size:clamp(54px,18vw,100px);line-height:1;
    filter:drop-shadow(0 10px 22px rgba(21,56,79,.32));
    transform:translate(-50%,-50%) scale(.3);
  }
  .gift.go{animation:gift 1.7s cubic-bezier(.2,1.2,.4,1) forwards}
  @keyframes gift{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-18deg)}
    20%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(7deg)}
    52%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
    100%{opacity:0;transform:translate(-50%,-146%) scale(.55)}
  }

  /* ── салют ── */
  .boom{position:absolute;left:0;top:0;z-index:12;pointer-events:none}
  .boom b{
    position:absolute;border-radius:50%;border:7px solid rgba(255,150,40,.95);
    box-shadow:0 0 18px rgba(255,190,90,.75),inset 0 0 14px rgba(255,220,150,.6);
    animation:boom-ring .62s cubic-bezier(.2,.8,.3,1) forwards;
  }
  .boom i{
    position:absolute;border-radius:50%;
    box-shadow:0 0 10px rgba(255,255,255,.9),0 1px 3px rgba(74,48,23,.35);
    animation:boom-dot .9s cubic-bezier(.15,.7,.3,1) forwards;
  }
  @keyframes boom-ring{
    from{transform:translate(-50%,-50%) scale(.2);opacity:.95}
    to{transform:translate(-50%,-50%) scale(2.2);opacity:0}
  }
  @keyframes boom-dot{
    from{transform:translate(-50%,-50%) scale(1);opacity:1}
    to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3);opacity:0}
  }
  .party{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
  .party i{position:absolute;width:12px;height:16px;border-radius:3px;animation:fall linear forwards}
  @keyframes fall{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(112vh) rotate(680deg)}}

  /* ── старт и итог ── */
  .veil{
    position:fixed;inset:0;z-index:20;display:flex;
    background:rgba(108,192,236,.5);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    transition:opacity .3s;padding:18px;
    overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  }
  .veil.hidden{opacity:0;pointer-events:none}
  .panel{
    width:100%;max-width:400px;text-align:center;margin:auto;flex:none;
    background:rgba(255,255,255,.8);border-radius:30px;padding:22px 20px 26px;
    box-shadow:0 18px 44px rgba(21,56,79,.24);
  }
  .panel h1{font-size:clamp(23px,6.6vw,30px);font-weight:600}
  .panel .ru{font-size:14px;color:rgba(21,56,79,.6);margin-top:2px}
  .stats{
    margin-top:14px;font-size:13.5px;line-height:1.55;color:rgba(21,56,79,.65);
    background:rgba(255,255,255,.6);border-radius:16px;padding:10px 12px;
  }
  .stats b{color:#15384F;font-weight:600}
  .zoo{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:9px;font-size:21px;line-height:1.1}
  .zoo span{transition:opacity .3s}
  .zoo span.off{opacity:.26;filter:grayscale(1)}
  .stats button{
    width:auto;margin:8px auto 0;padding:6px 12px;font-size:12px;border-radius:9px;
    border:0;background:rgba(21,56,79,.07);color:rgba(21,56,79,.6);
    font-family:inherit;cursor:pointer;display:block;
  }
  .tip{margin-top:11px;font-size:12px;line-height:1.5;color:rgba(21,56,79,.52);padding:0 4px}
  .big{
    margin:20px auto 0;width:min(40vw,150px);aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;
    display:grid;place-items:center;color:#15384F;
    background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.98),rgba(255,255,255,.3) 30%,rgba(255,216,110,.5) 58%,rgba(95,180,232,.45) 80%,rgba(255,255,255,.92) 100%);
    box-shadow:0 18px 44px rgba(21,56,79,.26),inset 0 0 34px rgba(255,255,255,.6);
    animation:float 3.6s ease-in-out infinite;
  }
  .big svg{width:34%;height:34%;fill:currentColor;stroke:none}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @media (max-height:560px){
    .panel{padding:14px 18px 16px}
    .panel h1{font-size:21px}
    .stats{margin-top:9px;font-size:12.5px}
    .zoo{font-size:16px;gap:2px;margin-top:6px}
    .tip{margin-top:7px}
    .big{margin-top:12px;width:min(24vh,104px)}
  }

  @media (prefers-reduced-motion:reduce){
    .big,.hand,.blk.wob{animation:none}
    .boom{display:none}
  }
</style>
</head>
<body>

<script src="words.js"></script>

<div class="top">
  <div class="track" id="track">
    <i class="fill" id="pfill"></i>
    <span class="marks" id="marks"></span>
    <b class="cnt" id="cnt"></b>
  </div>
  <div class="score" id="score"></div>
  <button class="btn" id="btnAgain" aria-label="Заново">
    <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.6 5.9"/><path d="M20 4v7h-7"/></svg>
  </button>
  <a class="btn" href="index.html" aria-label="Домой">
    <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
  </a>
</div>

<div class="stage" id="stage">
  <div class="rail" id="rail"></div>
  <div class="cart" id="cart">
    <div class="rope" id="rope"><div class="hook"></div></div>
  </div>
  <div class="world" id="world">
    <div class="ground"></div>
    <div class="tower" id="tower"></div>
  </div>
  <div class="boom" id="boom"></div>
  <div class="gift" id="gift"></div>
  <div class="flash" id="flash"></div>
  <div class="hand" id="hand">Tippe!</div>
</div>

<div class="veil" id="veil">
  <div class="panel">
    <h1>Turm</h1>
    <div class="ru">Башня</div>
    <div class="stats" id="stats"></div>
    <div class="tip">Кран катается вверху. Нажми на поле — и блок упадёт.
      Ставь ровно: за точное попадание три очка, а за каждые десять блоков —
      новый зверь в коллекцию. Если башня перекосится, она развалится.
      Каждый блок кран называет по-немецки — так и считаем до самого верха</div>
    <button class="big" id="btnStart" aria-label="Играть">
      <svg viewBox="0 0 24 24"><path d="M8 4.8v14.4L20 12z"/></svg>
    </button>
  </div>
</div>

<div class="party" id="party"></div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const YW = window.YEVA_WORDS || null;
  const VOICE = 'voice/de/';

  const K_LV = 'yeva.turm.level';
  const K_BEST = 'yeva.turm.best';
  const K_PTS = 'yeva.turm.points';
  const K_ZOO = 'yeva.turm.zoo';

  // призовые звери: по одному за каждые десять блоков. Пока собраны
  // не все, выдаётся следующий невиданный — за новым и возвращаются
  const ZOO = ['\u{1F43B}', '\u{1F98A}', '\u{1F438}', '\u{1F435}', '\u{1F981}', '\u{1F428}',
               '\u{1F43C}', '\u{1F984}', '\u{1F422}', '\u{1F419}', '\u{1F989}', '\u{1F98B}',
               '\u{1F42C}', '\u{1F41D}', '\u{1F994}', '\u{1F427}'];
  const FORMS = 6;      // столько узоров у блоков
  // Длина блока тоже гуляет — это и есть разнообразие вместо круглых
  // боков. Узкий блок честно хуже держит следующий: опора и правда
  // меньше. Поэтому два необычных подряд не выпадают, а первый блок
  // раунда и призовой всегда обычные.
  const WK = { wide: 1.32, slim: 0.76 };

  const CFG = {
    wide: 0.23,     // ширина блока от ширины поля
    tall: 0.78,     // высота блока от его ширины
    // Соскальзывание нарочно строже, чем опрокидывание: блок, лёгший
    // меньше чем наполовину на опору, просто падает вниз. Поэтому один
    // косой бросок башню не валит — валит накопленный перекос в одну
    // сторону, как и задумано.
    slip: 0.44,     // дальше этого блок не удержится и соскользнёт
    // Блоки слегка цепляются друг за друга, как «дупло»: опора считается
    // шире, чем она есть. Без этого трёх неряшливых броска в одну сторону
    // хватало, чтобы всё рухнуло без предупреждения — для трёхлетки это
    // просто обида. Теперь башня успевает накрениться и покачаться.
    grip: 1.4,
    snap: 0.22,     // ближе этого блок прилипает и встаёт ровно
    neat: 0.11,     // а ближе этого — «в точку», три очка
    // Усадка: каждый удар чуть подталкивает блоки к линии основания.
    // Без неё ошибки складываются в случайное блуждание, у башни
    // появляется потолок по высоте и до тридцати не дойти никому.
    // Два процента за удар — на глаз незаметно (блок, уехавший на
    // 40 px, сдвигается меньше чем на миллиметр), но за тридцать
    // ударов перекос уполовинивается.
    settle: 0.02,
    tilt: 4.2,      // на столько кренится блок у худшего стыка
    line: 0.58,     // на какой высоте поля держим верх башни
    hook: 0.17,     // где висит блок на крюке
    base: 10,       // блоков в первом раунде
    step: 5,        // на столько цель растёт с каждым уровнем
    top: 30,        // больше этого цель пока не поднимается
    prize: 10,      // приз за каждые столько блоков
    lvMax: 12
  };
  const goalFor = lv => Math.min(CFG.top, CFG.base + CFG.step * (lv - 1));

  const COLORS = ['#E8705C', '#F0A24B', '#5FC45A', '#4FC3A1', '#58B8E8',
                  '#8E86E0', '#E880A8', '#39B3C4'];

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* ── звук ── */
  let actx = null, master = null;
  const vBuf = {}, vBad = {}, vHot = {};

  function initAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.3;
    master.connect(actx.destination);
  }

  // числа 0–10 лежат в words.js как numbers, 11–50 — как numbersBig
  const NUMW = (() => {
    const m = {};
    const add = w => { if (w && typeof w.num === 'number') m[w.num] = w; };
    if (YW && YW.numbers) YW.numbers.forEach(add);
    if (YW && YW.numbersBig) YW.numbersBig.forEach(add);
    return m;
  })();
  const numWord = n => NUMW[n] || null;
  const vUrl = w => VOICE + (YW && YW.slug ? YW.slug(w) : w.de) + '.mp3';

  function loadVoice(w) {
    if (!actx || !w) return;
    const u = vUrl(w);
    if (vBuf[u] || vBad[u] || vHot[u]) return;
    vHot[u] = 1;
    fetch(u)
      .then(r => r.ok ? r : fetch(u + '?v=' + Date.now(), { cache: 'no-store' }))
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(ab => actx.decodeAudioData(ab))
      .then(b => { vBuf[u] = b; })
      .catch(e => { vBad[u] = true; console.warn('[voice] нет ' + u + ' — ' + e.message); });
  }

  // тянем вперёд только то, что скоро понадобится
  function preload(from) {
    for (let i = from; i <= target + 2 && i <= 50; i++) loadVoice(numWord(i));
  }

  function say(n, delay) {
    const w = numWord(n);
    if (!actx || !w) return;
    const u = vUrl(w);
    if (!vBuf[u] && !vBad[u]) loadVoice(w);
    let tries = 0;
    setTimeout(function wait() {
      if (vBuf[u]) {
        const src = actx.createBufferSource(), g = actx.createGain();
        g.gain.value = 1.25;
        src.buffer = vBuf[u];
        src.connect(g); g.connect(master);
        src.start();
        return;
      }
      if (!vBad[u] && tries++ < 6) { setTimeout(wait, 120); return; }
      try {
        if (typeof speechSynthesis === 'undefined') return;
        speechSynthesis.cancel();
        const ut = new SpeechSynthesisUtterance(w.de);
        ut.lang = 'de-DE'; ut.rate = 0.9; ut.pitch = 1.15;
        speechSynthesis.speak(ut);
      } catch (e) {}
    }, delay || 0);
  }

  function tone(type, freq, at, dur, vol, to) {
    if (!actx) return;
    const t = actx.currentTime + at;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur * 0.9);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  }

  const thud = () => { tone('sine', 150, 0, 0.16, 0.5, 60); tone('triangle', 320, 0, 0.07, 0.18); };
  const clack = () => { tone('square', 700, 0, 0.05, 0.1); tone('sine', 190, 0.01, 0.2, 0.45, 70); };
  const slipSnd = () => { tone('sawtooth', 300, 0, 0.3, 0.14, 90); };
  const crash = () => {
    for (let i = 0; i < 7; i++) tone('triangle', 260 - i * 22, i * 0.075, 0.22, 0.34, 70);
    tone('sine', 90, 0.1, 0.7, 0.5, 40);
  };
  const yay = () => [523, 659, 784, 1046].forEach((f, i) => tone('triangle', f, i * 0.1, 0.3, 0.3));
  const buzz = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };

  /* ── размеры поля ── */
  let SW = 0, SH = 0, W = 0, H = 0, hookY = 0, ropeLen = 0;

  function measure() {
    const r = $('stage').getBoundingClientRect();
    SW = r.width; SH = r.height;
    W = Math.max(46, Math.min(112, Math.round(SW * CFG.wide)));
    H = Math.round(W * CFG.tall);
    hookY = Math.round(SH * CFG.hook);
    const railY = Math.round(SH * 0.045);
    ropeLen = Math.max(14, hookY - railY - 22);
    $('rail').style.top = railY + 'px';
    $('cart').style.top = (railY + 7) + 'px';
    $('rope').style.height = ropeLen + 'px';
  }

  /* ── состояние ── */
  let level = 1, best = 0, target = CFG.base;
  let pts = 0, bestPts = 0, zoo = [];
  let liveForm = 0, bag = [], liveW = 0, lastWK = 1;
  let blocks = [];            // { x, el } — x это центр блока
  let cartX = 0, dir = 1, speed = 0, swing = 0;
  let live = null;            // блок на крюке или в полёте
  let fallV = 0, liveY = 0, liveX = 0;
  let phase = 'wait';         // wait | hang | fall | over | won
  let raf = 0, last = 0, clock = 0;

  // Отложенные шаги игры (подать блок, показать итог, начать раунд)
  // держим на учёте: иначе «заново», нажатое во время салюта или
  // падения, через пару секунд получает сброс от старого таймера
  // и обрывает уже начатый раунд.
  let timers = [];
  const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
  const clearLater = () => { timers.forEach(clearTimeout); timers = []; };

  const GROUND = 22;                        // на столько трава поднята над низом поля
  const baseY = () => SH - GROUND;          // экранный y земли
  const camY = () => Math.max(0, blocks.length * H - (baseY() - SH * CFG.line));
  const towerTop = () => baseY() - blocks.length * H + camY();   // экранный y верха башни

  /* ── равновесие ───────────────────────────────────────────────
     Башня валится не от того, что блок лежит криво, а от того, что
     общий центр тяжести всего, что лежит выше какого-то стыка, вышел
     за опору под ним. Проверяем каждый стык и берём самый плохой:
     именно он и переломится. */
  function balance() {
    const rs = [], sg = [];
    let worst = 0, sign = 1, at = 0;
    for (let k = 1; k < blocks.length; k++) {
      let sum = 0;
      for (let i = k; i < blocks.length; i++) sum += blocks[i].x;
      const com = sum / (blocks.length - k);
      const off = com - blocks[k - 1].x;
      const r = Math.abs(off) / (blocks[k - 1].w / 2 * CFG.grip);
      rs[k] = r; sg[k] = off < 0 ? -1 : 1;
      if (r > worst) { worst = r; sign = sg[k]; at = k; }
    }
    return { r: worst, sign: sign, at: at, rs: rs, sg: sg };
  }

  /* Кренятся сами блоки, каждый вокруг своей середины, а башня
     целиком — нет. Раньше поворачивалась вся башня вокруг земли:
     на экране она уезжала вбок, а блок падал туда, где игра держала
     её БЕЗ поворота. Ребёнок целился в одно место, блок ложился в
     другое, и чем сильнее крен, тем больше расходились картинка и
     правда. Поворот вокруг середины блока ничего не сдвигает, так
     что прицел теперь не врёт. */
  function paintTower() {
    const b = balance();
    blocks.forEach((blk, i) => {
      const r = Math.min(1, b.rs[i] || 0);
      const deg = (r * CFG.tilt * (b.sg[i] || 1)).toFixed(2) + 'deg';
      blk.el.style.setProperty('--t', deg);
      blk.el.style.transform = 'rotate(' + deg + ')';
      blk.el.classList.toggle('wob', r > 0.62);
    });
    $('world').style.transform = 'translateY(' + camY().toFixed(1) + 'px)';
  }

  function paintProgress() {
    const n = blocks.length;
    $('pfill').style.width = Math.min(100, n / target * 100).toFixed(1) + '%';
    $('cnt').textContent = n + ' / ' + target;
    const box = $('marks');
    // отметки призов — только те, что раньше цели: последний приз и так
    // совпадает с концом раунда
    const want = [];
    for (let p = CFG.prize; p < target; p += CFG.prize) want.push(p);
    if (box.children.length !== want.length) {
      box.innerHTML = '';
      want.forEach(p => {
        const i = document.createElement('i');
        i.style.left = (p / target * 100).toFixed(1) + '%';
        box.appendChild(i);
      });
    }
    want.forEach((p, i) => box.children[i].classList.toggle('on', n >= p));
  }

  function paintScore() {
    $('score').innerHTML = '<span class="lv">Stufe ' + level + '</span>' +
      '<span class="bs">◆ ' + pts + '</span>';
  }

  function zooHtml() {
    return '<div class="zoo">' + ZOO.map((e, i) =>
      '<span' + (zoo.indexOf(i) >= 0 ? '' : ' class="off"') + '>' + e + '</span>').join('') + '</div>';
  }

  function flash(text) {
    const f = $('flash');
    f.textContent = text;
    f.classList.remove('go');
    void f.offsetWidth;
    f.classList.add('go');
  }

  /* ── блоки ── */
  // силуэты тянем мешком, а не подряд: соседи всегда разные, но и
  // ни одна форма надолго не пропадает
  function nextForm() {
    if (!bag.length) {
      for (let i = 0; i < FORMS; i++) bag.push(i);
      for (let i = bag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = bag[i]; bag[i] = bag[j]; bag[j] = t;
      }
      // на стыке мешков форма могла повториться — отодвигаем её
      if (bag[bag.length - 1] === liveForm && bag.length > 1) {
        const t = bag[bag.length - 1]; bag[bag.length - 1] = bag[0]; bag[0] = t;
      }
    }
    return bag.pop();
  }

  const isPrize = n => n % CFG.prize === 0;

  // длина следующего блока: обычная, длинная или узкая
  function nextWidth(n) {
    if (n === 1 || level < 2 || isPrize(n) || lastWK !== 1) { lastWK = 1; return W; }
    const r = Math.random();
    lastWK = r < 0.2 ? WK.wide : r < 0.36 ? WK.slim : 1;
    return Math.round(W * lastWK);
  }

  function makeEl(n, x, w, form, cls) {
    const el = document.createElement('div');
    el.className = 'blk f' + form + (isPrize(n) ? ' gold' : '') + (cls ? ' ' + cls : '');
    el.style.width = w + 'px';
    el.style.height = H + 'px';
    if (!isPrize(n)) el.style.background = COLORS[(n - 1) % COLORS.length];
    el.style.fontSize = Math.round(H * 0.46) + 'px';
    el.innerHTML = '<span></span>';
    el.firstChild.textContent = n;
    el.style.left = Math.round(x - w / 2) + 'px';
    return el;
  }

  function hang() {
    if (phase === 'over' || phase === 'won') return;
    const n = blocks.length + 1;
    liveForm = nextForm();
    liveW = nextWidth(n);
    live = makeEl(n, cartX, liveW, liveForm, 'live');
    live.style.top = hookY + 'px';
    $('stage').appendChild(live);
    liveY = hookY;
    phase = 'hang';
    preload(n);
  }

  function drop(forceX) {
    if (phase !== 'hang' || !live) return;
    initAudio();
    $('hand').classList.add('gone');
    liveX = typeof forceX === 'number' ? forceX : cartX + swingX();
    live.style.left = Math.round(liveX - liveW / 2) + 'px';
    fallV = 0;
    phase = 'fall';
    clack();
  }

  // с пятого уровня груз ещё и качается на тросе: угол троса и
  // смещение блока считаем из одной величины, иначе блок уезжает
  // от крюка
  const swingDeg = () => level < 5 ? 0
    : Math.sin(clock * 2.1) * (9 + 2.6 * Math.min(level - 5, 4));
  const swingX = () => ropeLen * Math.sin(swingDeg() * Math.PI / 180);

  function land() {
    const n = blocks.length + 1;
    const top = blocks.length ? blocks[blocks.length - 1] : null;
    const prev = top ? top.x : liveX;
    // мерки берём от опоры, а не от своего блока: узкий держит хуже,
    // длинный — лучше, и это честно и для попадания, и для равновесия
    const sup = top ? top.w : liveW;
    let x = liveX;
    const dx = x - prev;

    // мимо: держаться не на чем, блок соскальзывает
    if (top && Math.abs(dx) > sup * CFG.slip) {
      slip(dx < 0 ? -1 : 1);
      return;
    }
    // Прилипание: если блок лёг близко к линии, он встаёт ровно.
    // Окно щедрое (0.22 ширины опоры), иначе мелкие ошибки копятся
    // в случайное блуждание и выше пятнадцати не подняться. Очки при
    // этом остаются строгими: три дают только за попадание в точку.
    let fit = 0;                       // 0 — криво, 1 — ровно, 2 — в точку
    if (top && Math.abs(dx) <= sup * CFG.neat) { x = prev; fit = 2; }
    else if (top && Math.abs(dx) <= sup * CFG.snap) { x = prev; fit = 1; }

    const el = makeEl(n, x, liveW, liveForm, 'pop');
    el.style.bottom = ((n - 1) * H) + 'px';
    $('tower').appendChild(el);
    if (live) { live.remove(); live = null; }
    blocks.push({ x: x, w: liveW, el: el });

    thud(); buzz(fit === 2 ? [12, 40, 12] : 18);
    if (fit) tone('triangle', fit === 2 ? 1180 : 980, 0.02, 0.18, 0.2);
    say(n, 60);

    // очки: криво — одно, ровно — два, точно в точку — три
    pts += fit === 2 ? 3 : fit === 1 ? 2 : 1;
    if (fit) {
      if (fit === 2) tone('triangle', 1570, 0.09, 0.16, 0.18);
      plus('+' + (fit === 2 ? 3 : 2), x, towerTop());
    }

    // усадка: подталкиваем уже лежащие блоки к линии основания
    if (blocks.length > 2) {
      const bx = blocks[0].x;
      for (let i = 1; i < blocks.length - 1; i++) {
        const blk = blocks[i];
        blk.x += (bx - blk.x) * CFG.settle;
        blk.el.style.left = Math.round(blk.x - blk.w / 2) + 'px';
      }
    }

    paintProgress(); paintScore(); paintTower();

    const b = balance();
    if (b.r >= 1) { later(() => collapse(b.at), 260); return; }

    if (blocks.length > best) { best = blocks.length; store.set(K_BEST, best); }
    if (pts > bestPts) { bestPts = pts; store.set(K_PTS, bestPts); }

    const gift = isPrize(blocks.length) ? givePrize() : false;
    if (blocks.length >= target) { later(win, gift ? 1100 : 420); return; }
    later(hang, gift ? 1500 : 240);
  }

  // всплывающие очки над местом, куда сел блок
  function plus(text, x, y) {
    const el = document.createElement('div');
    el.className = 'plus';
    el.textContent = text;
    el.style.left = Math.round(x) + 'px';
    el.style.top = Math.round(Math.max(24, y - 6)) + 'px';
    $('stage').appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  /* ── приз за каждые десять блоков ── */
  function givePrize() {
    let idx;
    if (zoo.length < ZOO.length) { idx = zoo.length; zoo.push(idx); store.set(K_ZOO, zoo.join(',')); }
    else idx = Math.floor(Math.random() * ZOO.length);
    const g = $('gift');
    g.textContent = ZOO[idx];
    g.classList.remove('go');
    void g.offsetWidth;
    g.classList.add('go');
    boom(blocks[blocks.length - 1].x, Math.max(26, towerTop()));
    confetti(26);
    yay(); buzz([15, 40, 15, 40, 15]);
    return true;
  }

  // блок не удержался и улетел вниз
  function slip(side) {
    if (!live) return;
    const el = live;
    live = null;
    el.classList.add('drop');
    el.style.transform = 'translate(' + (side * SW * 0.4).toFixed(0) + 'px,' +
      (SH * 1.1).toFixed(0) + 'px) rotate(' + (side * 220) + 'deg)';
    setTimeout(() => el.remove(), 900);
    slipSnd(); buzz([30, 60, 30]);
    flash('Daneben!');
    phase = 'wait';
    later(hang, 700);
  }

  /* ── всё рушится ── */
  function collapse(at) {
    phase = 'over';
    crash(); buzz([40, 80, 40, 80, 120]);
    blocks.forEach(b2 => b2.el.classList.remove('wob'));
    // сверху вниз: верхние летят дальше и раньше
    for (let i = blocks.length - 1; i >= at; i--) {
      const el = blocks[i].el;
      const side = Math.random() < 0.5 ? -1 : 1;
      const d = (blocks.length - i) * 0.045;
      el.style.transition = 'transform .9s cubic-bezier(.3,.1,.7,.6) ' + d.toFixed(2) +
        's, opacity .5s ease-in ' + (d + 0.45).toFixed(2) + 's';
      el.style.transform = 'translate(' + (side * (40 + Math.random() * SW * 0.5)).toFixed(0) +
        'px,' + (SH * 0.9).toFixed(0) + 'px) rotate(' + (side * (120 + Math.random() * 260)).toFixed(0) + 'deg)';
      el.style.opacity = '0';
    }
    if (live) { live.remove(); live = null; }
    flash('Oh nein!');
    later(() => {
      $('stats').innerHTML = 'Башня упала на <b>' + blocks.length + '</b> блоке · очков <b>' + pts + '</b><br>' +
        'Рекорд: <b>' + best + '</b> блоков, <b>' + bestPts + '</b> очков' +
        '<div style="margin-top:4px;opacity:.75">Уровень остаётся — попробуй ещё раз</div>' +
        zooHtml();
      $('veil').classList.remove('hidden');
    }, 1500);
  }

  /* ── раунд взят ── */
  function win() {
    phase = 'won';
    yay(); buzz([20, 50, 20, 50, 20]);
    boom(blocks[blocks.length - 1].x, Math.max(26, towerTop()));
    confetti(48);
    flash('Super!');
    if (live) { live.remove(); live = null; }
    if (level < CFG.lvMax) level++;
    store.set(K_LV, level);
    later(() => {
      flash('Stufe ' + level + ' · ' + goalFor(level));
      tone('triangle', 880, 0, 0.2, 0.25, 1320);
    }, 1200);
    later(round, 2600);
  }

  let boomClear = 0;
  function boom(x, y) {
    const box = $('boom');
    // приз и победа идут один за другим: уборка от первого салюта
    // успевала стереть второй
    clearTimeout(boomClear);
    box.innerHTML = '';
    box.style.left = Math.round(x) + 'px';
    box.style.top = Math.round(y) + 'px';
    const d = Math.round(Math.min(SW, SH) * 0.34);
    [0, 0.14].forEach(delay => {
      const ring = document.createElement('b');
      ring.style.width = ring.style.height = Math.round(d * (delay ? 0.62 : 1)) + 'px';
      ring.style.animationDelay = delay + 's';
      box.appendChild(ring);
    });
    for (let i = 0; i < 32; i++) {
      const dot = document.createElement('i');
      const ang = Math.random() * Math.PI * 2;
      const dist = d * (0.45 + Math.random() * 0.95);
      const sz = Math.max(7, Math.round(d * (0.05 + Math.random() * 0.08)));
      dot.style.width = dot.style.height = sz + 'px';
      dot.style.background = COLORS[i % COLORS.length];
      dot.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(0) + 'px');
      dot.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(0) + 'px');
      dot.style.animationDelay = (Math.random() * 0.12).toFixed(2) + 's';
      box.appendChild(dot);
    }
    boomClear = setTimeout(() => { box.innerHTML = ''; }, 1200);
  }

  function confetti(n) {
    const box = $('party');
    for (let i = 0; i < n; i++) {
      const c = document.createElement('i');
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.background = COLORS[i % COLORS.length];
      c.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
      c.style.animationDelay = (Math.random() * 0.6) + 's';
      box.appendChild(c);
    }
    setTimeout(() => { box.innerHTML = ''; }, 4200);
  }

  /* ── ход времени ── */
  function tick(t) {
    raf = requestAnimationFrame(tick);
    const dt = Math.min(0.05, (t - last) / 1000 || 0);
    last = t;
    if (phase === 'over') return;
    clock += dt;

    // тележка крана: длинный блок не должен уезжать за край поля
    const half = (liveW || W) * 0.56;
    const lo = Math.min(half, SW / 2), hi = Math.max(SW - half, SW / 2);
    cartX += dir * speed * dt;
    if (cartX > hi) { cartX = hi; dir = -1; }
    if (cartX < lo) { cartX = lo; dir = 1; }
    $('cart').style.left = cartX.toFixed(1) + 'px';

    // качание на тросе появляется на высоких уровнях
    swing = swingDeg();
    $('rope').style.transform = 'rotate(' + swing.toFixed(2) + 'deg)';

    if (phase === 'hang' && live) {
      live.style.left = Math.round(cartX + swingX() - liveW / 2) + 'px';
      return;
    }
    if (phase === 'fall' && live) {
      fallV += SH * 2.8 * dt;
      liveY += fallV * dt;
      const stop = towerTop() - H;
      if (liveY >= stop) { liveY = stop; live.style.top = liveY.toFixed(1) + 'px'; land(); return; }
      live.style.top = liveY.toFixed(1) + 'px';
    }
  }

  /* ── раунд ── */
  function round() {
    clearLater();
    $('tower').innerHTML = '';
    blocks = [];
    target = goalFor(level);
    speed = SW * Math.min(1.05, 0.30 + 0.075 * (level - 1));
    pts = 0;
    bag = [];
    lastWK = 1;
    liveW = W;
    if (live) { live.remove(); live = null; }
    $('gift').classList.remove('go');
    paintProgress(); paintScore(); paintTower();
    phase = 'wait';
    hang();
  }

  function clouds() {
    const st = $('stage');
    st.querySelectorAll('.cloud').forEach(c => c.remove());
    for (let i = 0; i < 4; i++) {
      const c = document.createElement('div');
      c.className = 'cloud';
      const w = SW * (0.18 + Math.random() * 0.22);
      c.style.width = w + 'px';
      c.style.height = (w * 0.34) + 'px';
      c.style.left = (Math.random() * 78) + '%';
      c.style.top = (18 + Math.random() * 52) + '%';
      c.style.opacity = (0.25 + Math.random() * 0.3).toFixed(2);
      st.appendChild(c);
    }
  }

  function start() {
    initAudio();
    $('veil').classList.add('hidden');
    measure();
    clouds();
    round();
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
  }

  /* ── ввод ── */
  $('stage').addEventListener('pointerdown', e => {
    e.preventDefault();
    drop();
  });
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); drop(); }
  });
  $('btnStart').addEventListener('click', start);
  $('btnAgain').addEventListener('click', () => {
    if (!$('veil').classList.contains('hidden')) return;
    phase = 'wait';
    round();
  });

  let rz = 0;
  window.addEventListener('resize', () => {
    clearTimeout(rz);
    rz = setTimeout(() => {
      const oldW = W;
      measure();
      clouds();
      if (!oldW || oldW === W) { paintTower(); return; }
      // ширина блока поменялась — перекладываем башню заново
      const k = W / oldW;
      blocks.forEach((b, i) => {
        b.x = b.x * k;
        b.w = Math.round(b.w * k);          // длинные и узкие тянутся вместе со всеми
        b.el.style.width = b.w + 'px';
        b.el.style.height = H + 'px';
        b.el.style.left = Math.round(b.x - b.w / 2) + 'px';
        b.el.style.bottom = (i * H) + 'px';
        b.el.style.fontSize = Math.round(H * 0.46) + 'px';
      });
      if (live) {
        liveW = Math.round(liveW * k);
        live.style.width = liveW + 'px';
        live.style.height = H + 'px';
        live.style.fontSize = Math.round(H * 0.46) + 'px';
      }
      paintTower();
    }, 180);
  });

  /* ── первый экран ── */
  level = Math.max(1, Math.min(CFG.lvMax, +store.get(K_LV, 1) || 1));
  best = Math.max(0, +store.get(K_BEST, 0) || 0);
  bestPts = Math.max(0, +store.get(K_PTS, 0) || 0);
  // пустая строка даёт [''], а +'' это ноль — без отсева пустая
  // коллекция читалась бы как «один медведь уже есть»
  zoo = String(store.get(K_ZOO, '')).split(',')
    .filter(v => v !== '')
    .map(v => +v)
    .filter(v => Number.isInteger(v) && v >= 0 && v < ZOO.length);
  measure();
  target = goalFor(level);
  paintProgress(); paintScore();

  function panel() {
    $('stats').innerHTML = 'Уровень <b>' + level + '</b> · собрать <b>' + target + '</b> блоков<br>' +
      'Рекорд: <b>' + best + '</b> блоков, <b>' + bestPts + '</b> очков<br>' +
      '<span style="opacity:.75">Зверей собрано: <b>' + zoo.length + '</b> из ' + ZOO.length + '</span>' +
      zooHtml() +
      (level > 1 || best || zoo.length ? '<button id="btnReset">начать сначала</button>' : '');
    const rst = $('btnReset');
    if (rst) rst.addEventListener('click', () => {
      level = 1; best = 0; bestPts = 0; zoo = [];
      store.set(K_LV, 1); store.set(K_BEST, 0); store.set(K_PTS, 0); store.set(K_ZOO, '');
      target = goalFor(1);
      paintProgress(); paintScore(); panel();
    });
  }
  panel();

  window.YEVA_TURM = {
    state: () => ({ phase: phase, level: level, target: target, best: best,
                    pts: pts, bestPts: bestPts, zoo: zoo.slice(),
                    n: blocks.length, xs: blocks.map(b => b.x), W: W, H: H,
                    ws: blocks.map(b => b.w), liveW: liveW,
                    cartX: cartX, speed: speed, cam: camY(), bal: balance(),
                    forms: blocks.map(b => (b.el.className.match(/\bf(\d)\b/) || [0, -1])[1]) }),
    drop: drop,
    put: x => drop(x)
  };
})();
</script>
<script src="install.js"></script>
<script src="console.js"></script>
</body>
</html>
