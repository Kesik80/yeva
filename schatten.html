<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Schatten</title>
<meta name="theme-color" content="#6E6AA8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/icons/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<meta name="apple-mobile-web-app-title" content="YEVA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  html{background:#6E6AA8}
  body{
    position:fixed;inset:0;
    font-family:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:#2A2748;
    background:linear-gradient(180deg,#6E6AA8 0%,#938FC6 38%,#C9C5E6 72%,#F0EEF8 100%);
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 9px) 10px calc(env(safe-area-inset-bottom,0px) + 9px);
  }

  .top{display:flex;align-items:center;gap:6px;flex:none}
  .track{
    position:relative;flex:1;min-width:0;height:38px;border-radius:999px;overflow:hidden;
    background:rgba(255,255,255,.78);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(42,39,72,.17);
  }
  .track .fill{position:absolute;left:0;top:0;bottom:0;width:0;
    background:linear-gradient(90deg,#B9A6F2,#7B5FD6);transition:width .3s ease}
  .track .marks{position:absolute;inset:0;pointer-events:none}
  .track .marks i{position:absolute;top:76%;width:8px;height:8px;margin:-4px 0 0 -4px;
    border-radius:50%;background:rgba(42,39,72,.22);
    transition:background .3s,transform .3s,box-shadow .3s}
  .track .marks i.on{background:#fff;transform:scale(1.25);box-shadow:0 0 0 2px rgba(123,95,214,.95)}
  .track .cnt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:13px;font-weight:600;color:#2A2748;font-variant-numeric:tabular-nums;white-space:nowrap}
  .track .cnt b{color:#6A4FC0;font-weight:600}

  .hp{
    flex:none;display:flex;gap:2.5px;align-items:center;
    background:rgba(255,255,255,.78);border-radius:999px;padding:10px 9px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(42,39,72,.17);font-size:13px;line-height:1;
  }
  .hp i{font-style:normal;color:#E8566B;transition:opacity .3s,transform .3s,color .3s}
  .hp i.off{opacity:.2;color:#2A2748;transform:scale(.78)}
  .hp i.bye{animation:hbye .55s ease-out}
  .hp i.back{animation:hback .6s ease-out}
  @keyframes hbye{0%{transform:scale(1.5);opacity:1}35%{transform:scale(1.5) rotate(12deg)}
    100%{transform:scale(.78);opacity:.2}}
  @keyframes hback{0%{transform:scale(.78);opacity:.2}45%{transform:scale(1.6);opacity:1}
    100%{transform:scale(1);opacity:1}}

  .btn{
    width:40px;height:40px;flex:none;border:0;border-radius:50%;
    background:rgba(255,255,255,.78);color:#2A2748;text-decoration:none;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(42,39,72,.18);
    display:grid;place-items:center;cursor:pointer;transition:transform .12s;
  }
  .btn:active{transform:scale(.9)}
  .btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  /* ── поле ── */
  .stage{
    flex:1;min-height:0;position:relative;display:flex;flex-direction:column;
    gap:1.2vh;padding:10px;margin-top:9px;border-radius:24px;overflow:hidden;
    background:
      radial-gradient(100% 56% at 50% 0%, rgba(255,246,214,.55), transparent 62%),
      linear-gradient(180deg,#E8E4F6 0%,#F4F1FB 56%,#FBFAFE 100%);
    box-shadow:inset 0 2px 14px rgba(42,39,72,.1);
  }

  /* сам предмет */
  .thing{
    flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding-top:2px;
  }
  .thing .pic{
    font-size:clamp(56px,18vh,136px);line-height:1;
    filter:drop-shadow(0 8px 10px rgba(42,39,72,.22));
    transition:transform .25s;
  }
  .thing.pulse .pic{animation:bob .6s ease-out}
  @keyframes bob{0%{transform:scale(1)}35%{transform:scale(1.14) rotate(-4deg)}100%{transform:scale(1)}}
  .name{
    display:flex;align-items:center;gap:8px;cursor:pointer;border:0;font-family:inherit;
    background:rgba(255,255,255,.9);border-radius:999px;padding:7px 14px 7px 11px;
    box-shadow:0 5px 15px rgba(42,39,72,.18);
    font-size:clamp(15px,4.4vw,20px);font-weight:600;color:#2A2748;white-space:nowrap;
  }
  .name svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;
    stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  .name.say{animation:saypulse .5s}
  @keyframes saypulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  /* тени */
  /* строки делят свободную высоту поровну: иначе карточки росли по
     содержимому и в альбомной ориентации сжимались до 33 px */
  /* колонки и высоту строк проставляет sizeShadows: на долях карточки
     вытягивались в столбик, а неполный ряд жался влево */
  .grid{
    flex:1;min-height:0;display:grid;gap:clamp(7px,2.2vw,13px);
    grid-template-columns:repeat(3,1fr);
    align-content:center;justify-content:center;
  }
  .sh{
    position:relative;border:0;cursor:pointer;font-family:inherit;
    background:rgba(255,255,255,.82);border-radius:22px;
    box-shadow:0 7px 18px rgba(42,39,72,.14),inset 0 -3px 0 rgba(42,39,72,.05);
    display:grid;place-items:center;min-height:0;overflow:hidden;
    transition:transform .14s,background .3s,box-shadow .3s;
  }
  .sh:active{transform:scale(.95)}
  .sh span{
    font-size:34px;line-height:1;
    filter:brightness(0) opacity(.8);
    transition:filter .45s;
  }
  .sh.right{background:linear-gradient(160deg,#C8F0D8,#6FCB97)}
  .sh.right span{filter:none}
  .sh.wrong{background:rgba(255,196,188,.95);animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}22%{transform:translateX(-9px)}
    55%{transform:translateX(8px)}80%{transform:translateX(-4px)}}
  .sh.tip{animation:tip 1.2s ease-in-out infinite}
  @keyframes tip{0%,100%{box-shadow:0 7px 18px rgba(42,39,72,.14)}
    50%{box-shadow:0 0 0 7px rgba(255,216,110,.9),0 7px 18px rgba(42,39,72,.16)}}

  .pop{
    position:absolute;pointer-events:none;z-index:9;white-space:nowrap;
    font-size:clamp(16px,4.6vw,21px);font-weight:600;color:#2E8B57;
    text-shadow:0 2px 7px rgba(255,255,255,.95);animation:rise .9s ease-out forwards;
  }
  .pop.bad{color:#C0392B}
  @keyframes rise{
    0%{opacity:0;transform:translate(-50%,0) scale(.8)}
    22%{opacity:1;transform:translate(-50%,-14px) scale(1.12)}
    100%{opacity:0;transform:translate(-50%,-58px) scale(1)}
  }

  .flash{
    position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.7);
    font-size:clamp(21px,6.6vw,33px);font-weight:600;color:#2A2748;opacity:0;
    background:rgba(255,255,255,.94);border-radius:999px;padding:9px 22px;
    box-shadow:0 10px 26px rgba(42,39,72,.26);pointer-events:none;white-space:nowrap;z-index:12;
  }
  .flash.go{animation:flash 1.1s ease-out forwards}
  @keyframes flash{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
    22%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
    70%{opacity:1;transform:translate(-50%,-62%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-78%) scale(1)}
  }

  .gift{
    position:absolute;left:50%;top:42%;opacity:0;z-index:13;pointer-events:none;
    font-size:clamp(54px,18vw,100px);line-height:1;
    filter:drop-shadow(0 10px 22px rgba(42,39,72,.32));
    transform:translate(-50%,-50%) scale(.3);
  }
  .gift.go{animation:gift 1.7s cubic-bezier(.2,1.2,.4,1) forwards}
  @keyframes gift{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-18deg)}
    20%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(7deg)}
    52%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
    100%{opacity:0;transform:translate(-50%,-146%) scale(.55)}
  }

  .boom{position:absolute;left:0;top:0;z-index:11;pointer-events:none}
  .boom b{position:absolute;border-radius:50%;border:7px solid rgba(255,190,90,.95);
    box-shadow:0 0 18px rgba(255,210,130,.75),inset 0 0 14px rgba(255,230,180,.6);
    animation:boom-ring .62s cubic-bezier(.2,.8,.3,1) forwards}
  .boom i{position:absolute;border-radius:50%;
    box-shadow:0 0 10px rgba(255,255,255,.9),0 1px 3px rgba(42,39,72,.35);
    animation:boom-dot .9s cubic-bezier(.15,.7,.3,1) forwards}
  @keyframes boom-ring{from{transform:translate(-50%,-50%) scale(.2);opacity:.95}
    to{transform:translate(-50%,-50%) scale(2.2);opacity:0}}
  @keyframes boom-dot{from{transform:translate(-50%,-50%) scale(1);opacity:1}
    to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3);opacity:0}}
  .party{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
  .party i{position:absolute;width:12px;height:16px;border-radius:3px;animation:fall linear forwards}
  @keyframes fall{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(112vh) rotate(680deg)}}

  .veil{
    position:fixed;inset:0;z-index:20;display:flex;
    background:rgba(147,143,198,.5);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    transition:opacity .3s;padding:18px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  }
  .veil.hidden{opacity:0;pointer-events:none}
  .panel{
    width:100%;max-width:400px;text-align:center;margin:auto;flex:none;
    background:rgba(255,255,255,.86);border-radius:30px;padding:22px 20px 26px;
    box-shadow:0 18px 44px rgba(42,39,72,.26);
  }
  .panel h1{font-size:clamp(23px,6.6vw,30px);font-weight:600}
  .panel .ru{font-size:14px;color:rgba(42,39,72,.6);margin-top:2px}
  .stats{
    margin-top:14px;font-size:13.5px;line-height:1.55;color:rgba(42,39,72,.68);
    background:rgba(255,255,255,.6);border-radius:16px;padding:10px 12px;
  }
  .stats b{color:#2A2748;font-weight:600}
  .stats button{
    width:auto;margin:8px auto 0;padding:6px 12px;font-size:12px;border-radius:9px;
    border:0;background:rgba(42,39,72,.08);color:rgba(42,39,72,.6);
    font-family:inherit;cursor:pointer;display:block;
  }
  .zoo{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:9px;font-size:21px;line-height:1.1}
  .zoo span{transition:opacity .3s}
  .zoo span.off{opacity:.26;filter:grayscale(1)}
  .tip{margin-top:11px;font-size:12px;line-height:1.5;color:rgba(42,39,72,.55);padding:0 4px}
  .big{
    margin:20px auto 0;width:min(40vw,150px);aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;
    display:grid;place-items:center;color:#2A2748;
    background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.98),rgba(255,255,255,.3) 30%,rgba(185,166,242,.5) 58%,rgba(110,106,168,.45) 80%,rgba(255,255,255,.92) 100%);
    box-shadow:0 18px 44px rgba(42,39,72,.3),inset 0 0 34px rgba(255,255,255,.6);
    animation:float 3.6s ease-in-out infinite;
  }
  .big svg{width:34%;height:34%;fill:currentColor;stroke:none}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  /* в альбомной ориентации предмет уходит вбок: сверху на шесть
     теней высоты не остаётся */
  @media (max-height:520px){
    .stage{flex-direction:row;align-items:stretch;gap:10px}
    .thing{flex:0 0 31%;max-width:200px;padding-top:0;justify-content:center}
    .thing .pic{font-size:clamp(38px,20vh,76px)}
    .grid{flex:1;min-width:0;min-height:0}
  }
  @media (max-height:560px){
    .panel{padding:14px 18px 16px}
    .panel h1{font-size:21px}
    .stats{margin-top:9px;font-size:12.5px}
    .zoo{font-size:16px;gap:2px;margin-top:6px}
    .tip{margin-top:7px}
    .big{margin-top:12px;width:min(24vh,104px)}
    .thing .pic{font-size:clamp(38px,13vh,70px)}
  }
  @media (prefers-reduced-motion:reduce){
    .big{animation:none}.sh.tip{animation:none;box-shadow:0 0 0 6px rgba(255,216,110,.9)}
    .boom{display:none}
  }
</style>
</head>
<body>

<script src="words.js"></script>

<div class="top">
  <div class="track" id="track">
    <i class="fill" id="pfill"></i>
    <span class="marks" id="marks"></span>
    <b class="cnt" id="cnt"></b>
  </div>
  <div class="hp" id="hp"></div>
  <button class="btn" id="btnAgain" aria-label="Заново">
    <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.6 5.9"/><path d="M20 4v7h-7"/></svg>
  </button>
  <a class="btn" href="index.html" aria-label="Домой">
    <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
  </a>
</div>

<div class="stage" id="stage">
  <div class="thing" id="thing">
    <div class="pic" id="pic"></div>
    <button class="name" id="name" aria-label="Повторить">
      <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M16 9.2a4 4 0 0 1 0 5.6"/><path d="M18.6 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
      <span id="nameText"></span>
    </button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="boom" id="boom"></div>
  <div class="gift" id="gift"></div>
  <div class="flash" id="flash"></div>
</div>

<div class="veil" id="veil">
  <div class="panel">
    <h1>Schatten</h1>
    <div class="ru">Тени</div>
    <div class="stats" id="stats"></div>
    <div class="tip">Наверху предмет, внизу тени. Найди ту, что его.
      Спешить некуда — часов тут нет. Нажми на подпись, чтобы услышать слово ещё раз</div>
    <button class="big" id="btnStart" aria-label="Играть">
      <svg viewBox="0 0 24 24"><path d="M8 4.8v14.4L20 12z"/></svg>
    </button>
  </div>
</div>

<div class="party" id="party"></div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const YW = window.YEVA_WORDS || null;
  const VOICE = 'voice/de/';

  const K_LV = 'yeva.schatten.level';
  const K_BEST = 'yeva.schatten.best';
  const K_PTS = 'yeva.schatten.points';
  const K_ZOO = 'yeva.schatten.zoo';

  // призы этой игры — ночное небо, чтобы не путались с другими
  const ZOO = ['\u{1F319}', '⭐', '\u{1F31F}', '☄️', '\u{1FA90}', '\u{1F30C}',
               '\u{1F52D}', '\u{1F321}️', '\u{1F9E9}', '\u{1F3AD}', '\u{1F5FA}️', '\u{1F9ED}',
               '\u{1F3F5}️', '\u{1F52E}', '\u{1F342}', '\u{1F344}'];

  // Тень читается только у вещей с внятным силуэтом. Цифры в рамке,
  // кружки и половина лица в тени превращаются в пятно — их не берём.
  const SKIP = ['\u{1F642}', '\u{1F441}️', '\u{1F30D}', '\u{1FA90}', '\u{1F445}', '\u{1F311}'];
  const SHAPES = (() => {
    if (!YW || !YW.pictured) return [];
    return YW.pictured.filter(w => {
      const e = w.e || '';
      if (!e) return false;
      if (/[0-9]️?⃣/.test(e) || e === '\u{1F51F}') return false;  // цифры в рамке
      return SKIP.indexOf(e) < 0;
    });
  })();

  const CFG = {
    base: 10, step: 5, top: 30,
    prize: 10,
    lives: 5,
    lvMax: 12
  };
  const goalFor = lv => Math.min(CFG.top, CFG.base + CFG.step * (lv - 1));
  const howMany = lv => Math.min(6, 2 + lv);        // теней на выбор

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* ── звук ── */
  let actx = null, master = null;
  const vBuf = {}, vBad = {}, vHot = {};

  function initAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.3;
    master.connect(actx.destination);
  }

  const vUrl = w => VOICE + (YW && YW.slug ? YW.slug(w) : w.de) + '.mp3';

  function loadVoice(w) {
    if (!actx || !w) return;
    const u = vUrl(w);
    if (vBuf[u] || vBad[u] || vHot[u]) return;
    vHot[u] = 1;
    fetch(u)
      .then(r => r.ok ? r : fetch(u + '?v=' + Date.now(), { cache: 'no-store' }))
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(ab => actx.decodeAudioData(ab))
      .then(b => { vBuf[u] = b; })
      .catch(e => { vBad[u] = true; console.warn('[voice] нет ' + u + ' — ' + e.message); });
  }

  function say(w) {
    if (!actx || !w) return;
    const u = vUrl(w);
    if (!vBuf[u] && !vBad[u]) loadVoice(w);
    let tries = 0;
    (function wait() {
      if (vBuf[u]) {
        const src = actx.createBufferSource(), g = actx.createGain();
        g.gain.value = 1.25;
        src.buffer = vBuf[u];
        src.connect(g); g.connect(master);
        src.start();
        return;
      }
      if (!vBad[u] && tries++ < 8) { setTimeout(wait, 110); return; }
      try {
        if (typeof speechSynthesis === 'undefined') return;
        speechSynthesis.cancel();
        const ut = new SpeechSynthesisUtterance(w.de);
        ut.lang = 'de-DE'; ut.rate = 0.9; ut.pitch = 1.15;
        speechSynthesis.speak(ut);
      } catch (e) {}
    })();
  }

  function tone(type, freq, at, dur, vol, to) {
    if (!actx) return;
    const t = actx.currentTime + at;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur * 0.9);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  }

  const ding = () => { tone('triangle', 740, 0, 0.14, 0.26, 1180); tone('sine', 370, 0.05, 0.2, 0.18); };
  const nope = () => tone('sawtooth', 240, 0, 0.24, 0.22, 90);
  const yay = () => [523, 659, 784, 1046].forEach((f, i) => tone('triangle', f, i * 0.1, 0.3, 0.3));
  const sad = () => [392, 330, 262].forEach((f, i) => tone('triangle', f, i * 0.14, 0.3, 0.26));
  const buzz = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };

  /* ── состояние ── */
  let level = 1, best = 0, target = CFG.base;
  let pts = 0, bestPts = 0, zoo = [], life = 0;
  let got = 0, wrong = 0, locked = false;
  let now = null, picks = [], seen = [];
  let phase = 'wait';
  let timers = [];
  const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
  const clearLater = () => { timers.forEach(clearTimeout); timers = []; };

  function paintProgress() {
    $('pfill').style.width = Math.min(100, got / target * 100).toFixed(1) + '%';
    $('cnt').innerHTML = got + ' / ' + target + ' <b>◆ ' + pts + '</b>';
    const box = $('marks');
    const want = [];
    for (let p = CFG.prize; p < target; p += CFG.prize) want.push(p);
    if (box.children.length !== want.length) {
      box.innerHTML = '';
      want.forEach(p => {
        const i = document.createElement('i');
        i.style.left = (p / target * 100).toFixed(1) + '%';
        box.appendChild(i);
      });
    }
    want.forEach((p, i) => box.children[i].classList.toggle('on', got >= p));
  }

  function anim(el, cls) {
    if (!el) return;
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function paintLives(hit) {
    const box = $('hp');
    if (box.children.length !== CFG.lives) {
      box.innerHTML = '';
      for (let i = 0; i < CFG.lives; i++) {
        const el = document.createElement('i');
        el.textContent = '♥';
        box.appendChild(el);
      }
    }
    for (let i = 0; i < CFG.lives; i++) box.children[i].classList.toggle('off', i >= life);
    if (hit === 'bye' && life >= 0 && life < CFG.lives) anim(box.children[life], 'bye');
    if (hit === 'back' && life > 0) anim(box.children[life - 1], 'back');
  }

  const zooHtml = () => '<div class="zoo">' + ZOO.map((e, i) =>
    '<span' + (zoo.indexOf(i) >= 0 ? '' : ' class="off"') + '>' + e + '</span>').join('') + '</div>';

  function flash(text) {
    const f = $('flash');
    f.textContent = text;
    anim(f, 'go');
  }

  function pop(text, el, bad) {
    const r = el.getBoundingClientRect(), s = $('stage').getBoundingClientRect();
    const d = document.createElement('div');
    d.className = 'pop' + (bad ? ' bad' : '');
    d.textContent = text;
    d.style.left = Math.round(r.left - s.left + r.width / 2) + 'px';
    d.style.top = Math.round(Math.max(6, r.top - s.top - 4)) + 'px';
    $('stage').appendChild(d);
    setTimeout(() => d.remove(), 950);
  }

  /* ── раунд за раундом ── */
  // слова не повторяются, пока не кончится запас
  function freshWord() {
    if (seen.length >= SHAPES.length) seen = [];
    let w = null, guard = 0;
    do { w = SHAPES[Math.floor(Math.random() * SHAPES.length)]; guard++; }
    while (seen.indexOf(w.de) >= 0 && guard < 200);
    seen.push(w.de);
    return w;
  }

  function nextRound() {
    if (!SHAPES.length) return;
    wrong = 0;
    locked = false;
    now = freshWord();
    const n = howMany(level);
    picks = [now];
    const used = { [now.e]: 1 };
    let guard = 0;
    while (picks.length < n && guard++ < 400) {
      const w = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      if (used[w.e]) continue;
      used[w.e] = 1;
      picks.push(w);
    }
    for (let i = picks.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = picks[i]; picks[i] = picks[j]; picks[j] = t;
    }

    $('pic').textContent = now.e;
    $('nameText').textContent = now.de;
    anim($('thing'), 'pulse');

    const g = $('grid');
    g.innerHTML = '';
    picks.forEach(w => {
      const b = document.createElement('button');
      b.className = 'sh';
      b.dataset.de = w.de;
      const s = document.createElement('span');
      s.textContent = w.e;
      b.appendChild(s);
      b.addEventListener('click', () => choose(b, w));
      g.appendChild(b);
    });
    sizeShadows();
    say(now);
    loadVoice(now);
  }

  // Раскладку считаем руками: на долях карточки выходили вытянутыми
  // в столбик, а в неполном ряду жались к левому краю.
  function sizeShadows() {
    const g = $('grid');
    const n = g.children.length;
    if (!n) return;
    requestAnimationFrame(() => {
      const box = g.getBoundingClientRect();
      if (!box.width || !box.height) return;
      const cols = n === 4 ? 2 : n <= 3 ? n : 3;
      const rows = Math.ceil(n / cols);
      const gap = parseFloat(getComputedStyle(g).columnGap) || 10;
      const colW = (box.width - (cols - 1) * gap) / cols;
      let rowH = (box.height - (rows - 1) * gap) / rows;
      rowH = Math.max(52, Math.min(rowH, colW * (rows > 1 ? 1.5 : 1.1)));
      g.style.gridTemplateColumns = 'repeat(' + cols + ',' + colW.toFixed(1) + 'px)';
      g.style.gridAutoRows = rowH.toFixed(1) + 'px';
      const px = Math.max(22, Math.round(Math.min(colW, rowH) * 0.6));
      Array.prototype.forEach.call(g.children, b => {
        if (b.firstChild) b.firstChild.style.fontSize = px + 'px';
      });
    });
  }

  function choose(el, w) {
    if (locked || phase !== 'play') return;
    if (w.de === now.de) {
      locked = true;
      el.classList.add('right');
      got++;
      const clean = wrong === 0;
      pts += clean ? 3 : 1;
      ding(); buzz(clean ? [10, 30, 10] : 14);
      pop(clean ? '+3' : '+1', el);
      say(now);
      if (got > best) { best = got; store.set(K_BEST, best); }
      if (pts > bestPts) { bestPts = pts; store.set(K_PTS, bestPts); }
      paintProgress();

      const r = el.getBoundingClientRect(), st = $('stage').getBoundingClientRect();
      const gift = got % CFG.prize === 0
        ? givePrize(r.left - st.left + r.width / 2, r.top - st.top + r.height / 2) : false;
      if (got >= target) { phase = 'won'; later(win, gift ? 1200 : 620); return; }
      later(nextRound, gift ? 1800 : 820);
      return;
    }
    // не та тень
    wrong++;
    anim(el, 'wrong');
    nope(); buzz([40, 70, 40]);
    life--;
    paintLives('bye');
    pts = Math.max(0, pts - 1);
    pop('−♥', el, true);
    paintProgress();
    if (life <= 0) { phase = 'over'; locked = true; flash('Vorbei!'); later(() => finish('lives'), 620); return; }
    if (wrong >= 2) {
      const right = Array.prototype.find.call($('grid').children, b => b.dataset.de === now.de);
      if (right) right.classList.add('tip');
    }
    later(() => { if (phase === 'play') say(now); }, 500);
  }

  /* ── приз ── */
  function givePrize(x, y) {
    let idx;
    if (zoo.length < ZOO.length) { idx = zoo.length; zoo.push(idx); store.set(K_ZOO, zoo.join(',')); }
    else idx = Math.floor(Math.random() * ZOO.length);
    const g = $('gift');
    g.textContent = ZOO[idx];
    anim(g, 'go');
    boom(x, y);
    confetti(26);
    yay(); buzz([15, 40, 15, 40, 15]);
    if (life < CFG.lives) {
      life++;
      paintLives('back');
      tone('triangle', 740, 0.5, 0.18, 0.2, 1180);
    }
    return true;
  }

  const PAL = ['#E8705C', '#F0A24B', '#5FC45A', '#4FC3A1', '#58B8E8', '#8E86E0', '#E880A8'];
  let boomClear = 0;
  function boom(x, y) {
    const box = $('boom');
    clearTimeout(boomClear);
    box.innerHTML = '';
    box.style.left = Math.round(x) + 'px';
    box.style.top = Math.round(y) + 'px';
    const r = $('stage').getBoundingClientRect();
    const d = Math.round(Math.min(r.width, r.height) * 0.34);
    [0, 0.14].forEach(delay => {
      const ring = document.createElement('b');
      ring.style.width = ring.style.height = Math.round(d * (delay ? 0.62 : 1)) + 'px';
      ring.style.animationDelay = delay + 's';
      box.appendChild(ring);
    });
    for (let i = 0; i < 30; i++) {
      const dot = document.createElement('i');
      const ang = Math.random() * Math.PI * 2;
      const dist = d * (0.45 + Math.random() * 0.95);
      const sz = Math.max(7, Math.round(d * (0.05 + Math.random() * 0.08)));
      dot.style.width = dot.style.height = sz + 'px';
      dot.style.background = PAL[i % PAL.length];
      dot.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(0) + 'px');
      dot.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(0) + 'px');
      dot.style.animationDelay = (Math.random() * 0.12).toFixed(2) + 's';
      box.appendChild(dot);
    }
    boomClear = setTimeout(() => { box.innerHTML = ''; }, 1200);
  }

  function confetti(n) {
    const box = $('party');
    for (let i = 0; i < n; i++) {
      const c = document.createElement('i');
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.background = PAL[i % PAL.length];
      c.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
      c.style.animationDelay = (Math.random() * 0.6) + 's';
      box.appendChild(c);
    }
    setTimeout(() => { box.innerHTML = ''; }, 4200);
  }

  /* ── конец раунда ── */
  function finish(why) {
    phase = 'over';
    sad();
    later(() => {
      $('stats').innerHTML = 'Угадано <b>' + got + '</b> · очков <b>' + pts + '</b><br>' +
        'Рекорд: <b>' + best + '</b> за раунд, <b>' + bestPts + '</b> очков<br>' +
        '<span style="opacity:.75">' + (why === 'lives'
          ? 'Сердца кончились — уровень остаётся, попробуй ещё раз'
          : 'Попробуй ещё раз') + '</span>' + zooHtml();
      $('veil').classList.remove('hidden');
    }, 1000);
  }

  function win() {
    phase = 'won';
    yay(); buzz([20, 50, 20, 50, 20]);
    const r = $('stage').getBoundingClientRect();
    boom(r.width / 2, r.height * 0.42);
    confetti(48);
    flash('Super!');
    if (level < CFG.lvMax) level++;
    store.set(K_LV, level);
    later(() => {
      flash('Stufe ' + level + ' · ' + goalFor(level));
      tone('triangle', 880, 0, 0.2, 0.25, 1320);
    }, 1200);
    later(round, 2600);
  }

  function round() {
    clearLater();
    got = 0; pts = 0; wrong = 0;
    life = CFG.lives;
    target = goalFor(level);
    $('gift').classList.remove('go');
    paintProgress(); paintLives();
    phase = 'play';
    nextRound();
  }

  function start() {
    initAudio();
    $('veil').classList.add('hidden');
    round();
  }

  $('name').addEventListener('click', e => {
    e.stopPropagation();
    initAudio();
    if (now) { anim($('name'), 'say'); say(now); }
  });
  let rz = 0;
  window.addEventListener('resize', () => {
    clearTimeout(rz);
    rz = setTimeout(sizeShadows, 160);
  });

  $('btnStart').addEventListener('click', start);
  $('btnAgain').addEventListener('click', () => {
    if (!$('veil').classList.contains('hidden')) return;
    round();
  });

  /* ── первый экран ── */
  level = Math.max(1, Math.min(CFG.lvMax, +store.get(K_LV, 1) || 1));
  best = Math.max(0, +store.get(K_BEST, 0) || 0);
  bestPts = Math.max(0, +store.get(K_PTS, 0) || 0);
  zoo = String(store.get(K_ZOO, '')).split(',')
    .filter(v => v !== '').map(v => +v)
    .filter(v => Number.isInteger(v) && v >= 0 && v < ZOO.length);
  target = goalFor(level);
  life = CFG.lives;
  paintProgress(); paintLives();

  function panel() {
    $('stats').innerHTML = 'Уровень <b>' + level + '</b> · угадать <b>' + target + '</b>' +
      ' · теней на выбор <b>' + howMany(level) + '</b><br>' +
      'Рекорд: <b>' + best + '</b> за раунд, <b>' + bestPts + '</b> очков<br>' +
      '<span style="opacity:.75">Находок собрано: <b>' + zoo.length + '</b> из ' + ZOO.length + '</span>' +
      zooHtml() +
      (level > 1 || best || zoo.length ? '<button id="btnReset">начать сначала</button>' : '');
    const rst = $('btnReset');
    if (rst) rst.addEventListener('click', () => {
      level = 1; best = 0; bestPts = 0; zoo = [];
      store.set(K_LV, 1); store.set(K_BEST, 0); store.set(K_PTS, 0); store.set(K_ZOO, '');
      target = goalFor(1);
      paintProgress(); panel();
    });
  }
  panel();

  window.YEVA_SCHATTEN = {
    state: () => ({ phase: phase, level: level, target: target, got: got, pts: pts, life: life,
                    best: best, bestPts: bestPts, zoo: zoo.slice(), wrong: wrong,
                    pool: SHAPES.length,
                    now: now ? { de: now.de, e: now.e } : null,
                    cards: Array.prototype.map.call($('grid').children, b => ({
                      de: b.dataset.de, right: b.classList.contains('right'),
                      tip: b.classList.contains('tip') })) }),
    tap: de => {
      const b = Array.prototype.find.call($('grid').children, x => x.dataset.de === de);
      if (b) b.click();
      return !!b;
    }
  };
})();
</script>
<script src="install.js"></script>
<script src="console.js"></script>
