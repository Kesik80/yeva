<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Голоса для игр — YEVA</title>
<meta name="theme-color" content="#EEF4FB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:'Fredoka',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
    background:linear-gradient(180deg,#EDF3FA 0%,#F8FBFE 100%);
    color:#1E3D57;min-height:100vh;line-height:1.5;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 30px);
  }
  .wrap{max-width:660px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  h1{font-size:21px;font-weight:600}
  .back{font-size:14px;color:#2F8FC4;text-decoration:none}
  .card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 4px 16px rgba(30,61,87,.07)}
  label{display:block;font-size:12px;font-weight:600;color:#5B7A93;margin-bottom:5px;letter-spacing:.02em}
  input,select{
    width:100%;padding:11px 13px;font-size:16px;font-family:inherit;color:#1E3D57;
    border:1.5px solid #D9E4EE;border-radius:11px;background:#FBFDFF;outline:none;
  }
  input:focus,select:focus{border-color:#4FA8D8}
  .row{display:flex;gap:10px;margin-top:11px}
  .row>*{flex:1;min-width:0}
  button{
    width:100%;padding:13px;font-size:15px;font-weight:600;font-family:inherit;
    border:0;border-radius:12px;background:#2F8FC4;color:#fff;cursor:pointer;margin-top:11px;
  }
  button:disabled{background:#BCCDDA;cursor:default}
  button.ghost{background:#E9F2F9;color:#2C6E96}
  button.go{background:#1F9B6E}
  .bar{height:9px;border-radius:999px;background:#E6EEF6;overflow:hidden;margin-top:12px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5BC8A8,#F0B429);transition:width .2s}
  .note{font-size:12.5px;color:#5B7A93;margin-top:9px}
  code{background:#EDF3FA;padding:1px 5px;border-radius:5px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
  .list{margin-top:12px;max-height:280px;overflow:auto;border-top:1px solid #EFF4F9}
  .item{
    display:flex;align-items:center;gap:9px;padding:7px 2px;border-bottom:1px solid #F2F6FA;font-size:14px;
  }
  .item .w{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .st{font-size:12px;width:66px;text-align:right;flex:none}
  .item .play{
    width:32px;height:32px;flex:none;border-radius:50%;background:#EAF3F9;color:#2C6E96;
    display:grid;place-items:center;font-size:14px;margin:0;padding:0;
  }
  .ok{color:#1F8A5F}
  .err{color:#C0392B}
  .wait{color:#9AAEBE}
  .log{margin-top:10px;font-size:12.5px;color:#5B7A93;max-height:130px;overflow:auto}
  .log div{padding:2px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Голоса для игр</h1>
    <a class="back" href="index.html">← назад</a>
  </div>

  <div class="card">
    <div class="row" style="margin-top:0">
      <div>
        <label for="voice">Голос</label>
        <select id="voice"></select>
      </div>
      <div>
        <label for="lang">Язык</label>
        <select id="lang">
          <option value="de" selected>Немецкий</option>
          <option value="ru">Русский</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label for="repo">Репозиторий</label>
        <input id="repo" value="Kesik80/yeva" autocomplete="off">
      </div>
    </div>
    <div class="row">
      <div>
        <label for="admin">Пароль записи <span style="font-weight:500">(ADMIN_TOKEN)</span></label>
        <input id="admin" type="password" autocomplete="off" placeholder="если задан в Vercel">
      </div>
    </div>
    <button class="ghost" id="btnTest">Послушать пробу этим голосом</button>
    <div class="note" id="est"></div>
  </div>

  <div class="card">
    <button id="btnGen">1 · Озвучить все слова</button>
    <button class="go" id="btnPub" disabled>2 · Записать в репозиторий одним коммитом</button>
    <button class="ghost" id="btnZip" disabled>Или скачать ZIP на телефон</button>
    <div class="bar"><i id="fill"></i></div>
    <div class="log" id="log"></div>
    <div class="list" id="list"></div>
  </div>

  <div class="card">
    <div class="note" style="margin:0">
      Файлы лягут в <code>voice/de/</code> под именами вида <code>katze.mp3</code> — игра ищет их именно там.
      Ключ ElevenLabs живёт только в переменных Vercel, в браузер он не попадает.
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(() => {
  'use strict';

  // Тот же список, что в игре. de — с артиклем, имя файла строится из него.
  const A = (ru, de) => ({ ru: ru, de: de });
  const WORDS = [
    A('кошка','die Katze'), A('собака','der Hund'), A('корова','die Kuh'), A('овечка','das Schaf'),
    A('козочка','die Ziege'), A('поросёнок','das Schwein'), A('курочка','das Huhn'), A('утка','die Ente'),
    A('лошадка','das Pferd'), A('мышка','die Maus'), A('пчела','die Biene'), A('лягушка','der Frosch'),
    A('птичка','der Vogel'),
    A('зайчик','der Hase'), A('лисичка','der Fuchs'), A('белочка','das Eichhörnchen'), A('олень','das Reh'),
    A('мишка','der Bär'), A('ёжик','der Igel'), A('бабочка','der Schmetterling'), A('улитка','die Schnecke'),
    A('божья коровка','der Marienkäfer'), A('кабанчик','das Wildschwein'),
    A('сова','die Eule'), A('летучая мышь','die Fledermaus'), A('волк','der Wolf'), A('енот','der Waschbär'),
    A('рыбка','der Fisch'), A('рыба-шар','der Kugelfisch'), A('осьминог','der Krake'), A('крабик','die Krabbe'),
    A('черепаха','die Schildkröte'), A('дельфин','der Delfin'), A('кит','der Wal'), A('кальмар','der Tintenfisch'),
    A('омар','der Hummer'), A('креветка','die Garnele'), A('тюлень','die Robbe'), A('акула','der Hai'),
    A('пингвин','der Pinguin'),
    A('ракета','die Rakete'), A('инопланетянин','das Alien'), A('планета','der Planet'), A('звёздочка','der Stern'),
    A('тарелка','das Ufo'), A('комета','der Komet'), A('луна','der Mond'), A('солнышко','die Sonne'),
    A('робот','der Roboter'), A('земля','die Erde')
  ];

  // те же голоса, что в tts-widget.js
  const VOICES = {
    Roger:'CwhRBWXzGAHq8TQ4Fs17', Laura:'FGY2WhTYpPnrIDTdsKH5', Liam:'TX3LPaxmHKxFdv7VOQHJ',
    Matilda:'XrExE9yKIg1WjnnlVkGX', Will:'bIHbv24MWmeRgasZH58o', Jessica:'cgSgspJ2msm6clMCkdW9',
    Eric:'cjVigY5qzO86Huf0OWal', Brian:'nPczCjzI2devNBz1zQrb', Daniel:'onwK4e9ZLuTAKqWW03F9',
    Lily:'pFZP5JQG7iQjIQuC4Bku', Bill:'pqHfZKP75CvOlQylNhV4'
  };
  const FEM = ['Laura','Matilda','Jessica','Lily'];

  const $ = id => document.getElementById(id);
  const log = (m, cls) => {
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = m;
    $('log').prepend(d);
  };

  const slug = a => a.de.replace(/^(der|die|das)\s+/i, '')
    .toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');

  // одно животное встречается в нескольких мирах — озвучиваем один раз
  const uniq = [];
  const seen = {};
  WORDS.forEach(a => { const s = slug(a); if (!seen[s]) { seen[s] = 1; uniq.push(a); } });

  const done = {};   // slug -> base64

  // голоса в выпадашку
  $('voice').innerHTML = Object.keys(VOICES)
    .map(n => `<option value="${n}"${n === 'Matilda' ? ' selected' : ''}>${n} · ${FEM.includes(n) ? 'ж' : 'м'}</option>`)
    .join('');

  // сохраняем настройки между заходами, кроме пароля
  try {
    const saved = JSON.parse(localStorage.getItem('voicegen') || '{}');
    if (saved.voice) $('voice').value = saved.voice;
    if (saved.lang) $('lang').value = saved.lang;
    if (saved.repo) $('repo').value = saved.repo;
  } catch (e) {}
  const remember = () => {
    try {
      localStorage.setItem('voicegen', JSON.stringify({
        voice: $('voice').value, lang: $('lang').value, repo: $('repo').value
      }));
    } catch (e) {}
  };
  ['voice','lang','repo'].forEach(id => $(id).addEventListener('change', () => { remember(); estimate(); render(); }));

  function estimate() {
    const lang = $('lang').value;
    const chars = uniq.reduce((n, a) => n + (lang === 'de' ? a.de : a.ru).length, 0);
    $('est').textContent = uniq.length + ' слов, около ' + chars +
      ' символов за прогон. Бесплатный тариф ElevenLabs — 10 000 кредитов в месяц, 1 символ ≈ 1 кредит.';
  }

  function render() {
    const lang = $('lang').value;
    $('list').innerHTML = uniq.map(a => {
      const s = slug(a);
      const has = !!done[s];
      return `<div class="item">
        <button class="play" data-slug="${s}" ${has ? '' : 'disabled'}>▶</button>
        <span class="w">${lang === 'de' ? a.de : a.ru}</span>
        <span class="st ${has ? 'ok' : 'wait'}">${has ? s + '.mp3' : '—'}</span>
      </div>`;
    }).join('');
  }

  $('list').addEventListener('click', e => {
    const b = e.target.closest('.play');
    if (!b || b.disabled) return;
    const b64 = done[b.dataset.slug];
    if (!b64) return;
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    new Audio(URL.createObjectURL(new Blob([bytes], { type: 'audio/mpeg' }))).play();
  });

  async function speak(text, save, path) {
    const r = await fetch('/api/speak', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: text,
        voiceId: VOICES[$('voice').value],
        lang: $('lang').value,
        save: !!save,
        path: path,
        repo: $('repo').value.trim(),
        adminToken: $('admin').value
      })
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    return data;
  }

  $('btnTest').addEventListener('click', async () => {
    const a = uniq[0], lang = $('lang').value;
    $('btnTest').disabled = true;
    try {
      const d = await speak(lang === 'de' ? a.de : a.ru, false);
      const bytes = Uint8Array.from(atob(d.audio), c => c.charCodeAt(0));
      new Audio(URL.createObjectURL(new Blob([bytes], { type: 'audio/mpeg' }))).play();
      log('проба: ' + (lang === 'de' ? a.de : a.ru) + ' · ' + $('voice').value, 'ok');
    } catch (e) { log('проба не вышла: ' + e.message, 'err'); }
    $('btnTest').disabled = false;
  });

  $('btnGen').addEventListener('click', async () => {
    const lang = $('lang').value;
    $('btnGen').disabled = true;
    let ok = 0, bad = 0, n = 0;
    for (const a of uniq) {
      const s = slug(a);
      if (done[s]) { ok++; n++; continue; }
      try {
        const d = await speak(lang === 'de' ? a.de : a.ru, false);
        done[s] = d.audio;
        ok++;
      } catch (e) {
        bad++;
        log('✗ ' + (lang === 'de' ? a.de : a.ru) + ' — ' + e.message, 'err');
      }
      n++;
      $('fill').style.width = (n / uniq.length * 100).toFixed(1) + '%';
      render();
      await new Promise(r => setTimeout(r, 250));
    }
    log('озвучено ' + ok + ', ошибок ' + bad, bad ? 'err' : 'ok');
    $('btnPub').disabled = ok === 0;
    $('btnZip').disabled = ok === 0;
    $('btnGen').disabled = false;
  });

  $('btnPub').addEventListener('click', async () => {
    const lang = $('lang').value;
    const files = Object.keys(done).map(s => ({
      path: 'voice/' + lang + '/' + s + '.mp3',
      content: done[s]
    }));
    if (!files.length) return;
    $('btnPub').disabled = true;
    try {
      const r = await fetch('/api/commit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          repo: $('repo').value.trim(),
          message: 'Голоса для игры: ' + files.length + ' слов, ' + $('voice').value + ', ' + lang,
          files: files,
          adminToken: $('admin').value
        })
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      log('записано ' + d.count + ' файлов одним коммитом ' + String(d.commit).slice(0, 7), 'ok');
    } catch (e) {
      log('коммит не прошёл: ' + e.message, 'err');
    }
    $('btnPub').disabled = false;
  });

  $('btnZip').addEventListener('click', async () => {
    const lang = $('lang').value;
    const zip = new JSZip();
    const dir = zip.folder('voice').folder(lang);
    Object.keys(done).forEach(s => dir.file(s + '.mp3', done[s], { base64: true }));
    const blob = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'voice_' + lang + '.zip';
    a.click();
    log('ZIP собран', 'ok');
  });

  estimate();
  render();
})();
</script>
<script src="console.js"></script>
</body>
</html>
