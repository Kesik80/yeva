<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Голоса для игр — YEVA</title>
<meta name="theme-color" content="#EEF4FB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:'Fredoka',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
    background:linear-gradient(180deg,#EDF3FA 0%,#F8FBFE 100%);
    color:#1E3D57;min-height:100vh;line-height:1.5;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 30px);
  }
  .wrap{max-width:680px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  h1{font-size:21px;font-weight:600}
  .back{font-size:14px;color:#2F8FC4;text-decoration:none}
  .card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 4px 16px rgba(30,61,87,.07)}
  label{display:block;font-size:12px;font-weight:600;color:#5B7A93;margin-bottom:5px;letter-spacing:.02em}
  input,select{
    width:100%;padding:11px 13px;font-size:16px;font-family:inherit;color:#1E3D57;
    border:1.5px solid #D9E4EE;border-radius:11px;background:#FBFDFF;outline:none;
  }
  input:focus,select:focus{border-color:#4FA8D8}
  .row{display:flex;gap:10px;margin-top:11px}
  .row>*{flex:1;min-width:0}
  button{
    width:100%;padding:12px;font-size:15px;font-weight:600;font-family:inherit;
    border:0;border-radius:12px;background:#2F8FC4;color:#fff;cursor:pointer;margin-top:10px;
  }
  button:disabled{background:#BCCDDA;cursor:default}
  button.ghost{background:#E9F2F9;color:#2C6E96}
  button.go{background:#1F9B6E}
  button.slim{padding:9px;font-size:13.5px;margin-top:8px}

  /* три рода */
  .gen{border-radius:14px;padding:13px;margin-top:11px;border:1.5px solid}
  .gen:first-of-type{margin-top:0}
  .gen h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .gen .cnt{font-size:12px;font-weight:500;color:#7A8FA3;margin-left:auto}
  .der{background:#EEF4FF;border-color:#C7D9F5}
  .der h3{color:#2B5DA8}
  .die{background:#FFF0F4;border-color:#F6CBD8}
  .die h3{color:#B03A63}
  .das{background:#EFFAF3;border-color:#C4E8D3}
  .das h3{color:#1F7A50}

  .bar{height:9px;border-radius:999px;background:#E6EEF6;overflow:hidden;margin-top:12px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5BC8A8,#F0B429);transition:width .2s}
  .bar.busy i{
    width:100%;background:linear-gradient(90deg,rgba(91,200,168,0) 0%,#5BC8A8 45%,#F0B429 55%,rgba(240,180,41,0) 100%);
    background-size:45% 100%;background-repeat:no-repeat;animation:slide 1.05s linear infinite;transition:none;
  }
  @keyframes slide{from{background-position:-45% 0}to{background-position:145% 0}}
  .note{font-size:12.5px;color:#5B7A93;margin-top:9px}
  code{background:#EDF3FA;padding:1px 5px;border-radius:5px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
  .chk{display:flex;align-items:center;gap:9px;margin-top:11px;font-size:14px}
  .chk input{width:19px;height:19px;flex:none}

  .list{margin-top:10px;max-height:340px;overflow:auto;border-top:1px solid #EFF4F9}
  .grp{font-size:12px;font-weight:600;color:#7A8FA3;padding:9px 2px 4px}
  .item{display:flex;align-items:center;gap:9px;padding:6px 2px;border-bottom:1px solid #F2F6FA;font-size:14px}
  .item .w{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .st{font-size:11.5px;width:74px;text-align:right;flex:none}
  .item .play{
    width:31px;height:31px;flex:none;border-radius:50%;background:#EAF3F9;color:#2C6E96;
    display:grid;place-items:center;font-size:13px;margin:0;padding:0;
  }
  .item .play:disabled{background:#F3F6F9;color:#C3D0DA}
  .have{color:#1F8A5F}
  .fresh{color:#B77B0B}
  .miss{color:#B9C6D2}
  .err{color:#C0392B}
  input[type=range]{width:100%;padding:0;height:26px;background:transparent;border:0;accent-color:#2F8FC4}
  .preset{display:flex;gap:9px}
  .preset button{margin-top:0}
  .hint{font-weight:500;color:#93A8BA;font-size:11.5px}
  label b{color:#2F8FC4;font-variant-numeric:tabular-nums}
  .log{margin-top:10px;font-size:12.5px;color:#5B7A93;max-height:120px;overflow:auto}
  .log div{padding:2px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Голоса для игр</h1>
    <a class="back" href="index.html">← назад</a>
  </div>

  <div class="card">
    <div class="row" style="margin-top:0">
      <div>
        <label for="lang">Язык</label>
        <select id="lang">
          <option value="de" selected>Немецкий</option>
          <option value="ru">Русский</option>
        </select>
      </div>
      <div>
        <label for="repo">Репозиторий</label>
        <input id="repo" value="Kesik80/yeva" autocomplete="off">
      </div>
    </div>
    <div class="row">
      <div>
        <label for="admin">Пароль записи <span style="font-weight:500">(ADMIN_TOKEN)</span></label>
        <input id="admin" type="password" autocomplete="off" placeholder="если задан в Vercel">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="gen der">
      <h3>der · мужской <span class="cnt" id="cnt-der"></span></h3>
      <select id="v-der"></select>
      <button class="ghost slim" data-sample="der">Послушать пробу</button>
    </div>
    <div class="gen die">
      <h3>die · женский <span class="cnt" id="cnt-die"></span></h3>
      <select id="v-die"></select>
      <button class="ghost slim" data-sample="die">Послушать пробу</button>
    </div>
    <div class="gen das">
      <h3>das · средний <span class="cnt" id="cnt-das"></span></h3>
      <select id="v-das"></select>
      <button class="ghost slim" data-sample="das">Послушать пробу</button>
    </div>
  </div>

  <div class="card">
    <div style="font-size:13px;font-weight:600;color:#5B7A93;margin-bottom:9px">КАК ЧИТАТЬ</div>
    <div class="preset">
      <button class="ghost slim" data-preset="flat">Ровно, для одного слова</button>
      <button class="ghost slim" data-preset="live">Живо, как раньше</button>
    </div>
    <label style="margin-top:12px">Ровность <b id="vStab"></b> <span class="hint">выше — меньше эмоций и разброса</span></label>
    <input type="range" id="stab" min="0" max="1" step="0.05">
    <label style="margin-top:10px">Похожесть на голос <b id="vSim"></b></label>
    <input type="range" id="sim" min="0" max="1" step="0.05">
    <label style="margin-top:10px">Артистичность <b id="vStyle"></b> <span class="hint">для слов держи на нуле</span></label>
    <input type="range" id="style" min="0" max="1" step="0.05">
    <label style="margin-top:10px">Скорость <b id="vSpeed"></b></label>
    <input type="range" id="speed" min="0.7" max="1.2" step="0.02">
    <div class="chk">
      <input type="checkbox" id="dot">
      <label for="dot" style="margin:0;font-size:14px;font-weight:500;color:#1E3D57">
        Слать «Die Katze.» с заглавной и точкой
      </label>
    </div>
    <div class="chk">
      <input type="checkbox" id="ctx">
      <label for="ctx" style="margin:0;font-size:14px;font-weight:500;color:#1E3D57">
        Подставлять невидимый контекст фразы
      </label>
    </div>
  </div>

  <div class="card">
    <button class="ghost" id="btnCheck">1 · Проверить, каких слов не хватает</button>
    <div class="chk">
      <input type="checkbox" id="redo">
      <label for="redo" style="margin:0;font-size:14px;font-weight:500;color:#1E3D57">
        перезаписать и те, что уже есть
      </label>
    </div>
    <button id="btnGen">2 · Озвучить недостающие</button>
    <button class="go" id="btnPub" disabled>3 · Записать одним коммитом</button>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div class="log" id="log"></div>
    <div class="list" id="list"></div>
  </div>

  <div class="card">
    <div class="note" style="margin:0">
      Проверка стучится по адресу <code>voice/de/katze.mp3</code> на этом же сайте, так что видно ровно то, что видит игра.
      Уже записанные слова повторно не тратят кредиты.
    </div>
  </div>
</div>

<script src="words.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(() => {
  'use strict';

  // словарь общий с игрой, лежит в words.js
  const YW = window.YEVA_WORDS;
  if (!YW) {
    document.body.innerHTML =
      '<div style="padding:40px;text-align:center">Не загрузился <b>words.js</b>. ' +
      'Положи его в корень рядом с этой страницей.</div>';
    return;
  }

  const VOICES = {
    Roger:'CwhRBWXzGAHq8TQ4Fs17', Laura:'FGY2WhTYpPnrIDTdsKH5', Liam:'TX3LPaxmHKxFdv7VOQHJ',
    Matilda:'XrExE9yKIg1WjnnlVkGX', Will:'bIHbv24MWmeRgasZH58o', Jessica:'cgSgspJ2msm6clMCkdW9',
    Eric:'cjVigY5qzO86Huf0OWal', Brian:'nPczCjzI2devNBz1zQrb', Daniel:'onwK4e9ZLuTAKqWW03F9',
    Lily:'pFZP5JQG7iQjIQuC4Bku', Bill:'pqHfZKP75CvOlQylNhV4'
  };
  const FEM = ['Laura','Matilda','Jessica','Lily'];
  const GENDERS = ['der', 'die', 'das'];
  const DEFAULTS = { der: 'Roger', die: 'Matilda', das: 'Daniel' };

  const $ = id => document.getElementById(id);
  const log = (m, cls) => {
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = m;
    $('log').prepend(d);
  };

  const gender = YW.gender;
  const slug = YW.slug;
  const uniq = YW.unique;   // уже без повторов

  const fresh = {};    // slug -> base64, только что озвученное
  const onSite = {};   // slug -> true, уже лежит в репозитории

  const urlFor = a => 'voice/' + $('lang').value + '/' + slug(a) + '.mp3';

  // ── голоса в три списка ─────────────────────────────────────
  const opts = sel => Object.keys(VOICES)
    .map(n => `<option value="${n}"${n === sel ? ' selected' : ''}>${n} · ${FEM.includes(n) ? 'ж' : 'м'}</option>`)
    .join('');
  GENDERS.forEach(g => { $('v-' + g).innerHTML = opts(DEFAULTS[g]); });

  let needPreset = false;   // применим после того, как всё объявлено
  try {
    const sv = JSON.parse(localStorage.getItem('voicegen2') || '{}');
    GENDERS.forEach(g => { if (sv[g] && VOICES[sv[g]]) $('v-' + g).value = sv[g]; });
    if (sv.lang) $('lang').value = sv.lang;
    if (sv.repo) $('repo').value = sv.repo;
    if (sv.stab !== undefined) {
      $('stab').value = sv.stab; $('sim').value = sv.sim;
      $('style').value = sv.style; $('speed').value = sv.speed;
      $('dot').checked = !!sv.dot; $('ctx').checked = !!sv.ctx;
    } else { needPreset = true; }
  } catch (e) { needPreset = true; }
  const remember = () => {
    try {
      const o = { lang: $('lang').value, repo: $('repo').value,
                  stab: $('stab').value, sim: $('sim').value,
                  style: $('style').value, speed: $('speed').value,
                  dot: $('dot').checked, ctx: $('ctx').checked };
      GENDERS.forEach(g => { o[g] = $('v-' + g).value; });
      localStorage.setItem('voicegen2', JSON.stringify(o));
    } catch (e) {}
  };
  GENDERS.forEach(g => $('v-' + g).addEventListener('change', remember));
  $('repo').addEventListener('change', remember);
  $('lang').addEventListener('change', () => {
    remember();
    for (const k in onSite) delete onSite[k];
    render();
    log('язык переключён — проверь заново, какие файлы есть');
  });

  GENDERS.forEach(g => {
    const n = uniq.filter(a => gender(a) === g).length;
    $('cnt-' + g).textContent = n + ' слов';
  });

  // ── как читать ──────────────────────────────────────────────
  const PRESETS = {
    flat: { stab: 0.85, sim: 0.8,  style: 0,   speed: 0.92, dot: true,  ctx: true  },
    live: { stab: 0.5,  sim: 0.75, style: 0,   speed: 1,    dot: false, ctx: false }
  };
  // Контекст читается моделью «в уме» ради ровной интонации,
  // вслух он не произносится.
  const CTX_BEFORE = 'Wir lernen heute neue Wörter. ';
  const CTX_AFTER  = ' Und jetzt das nächste Wort.';

  function readSettings() {
    return {
      stability: parseFloat($('stab').value),
      similarity_boost: parseFloat($('sim').value),
      style: parseFloat($('style').value),
      speed: parseFloat($('speed').value),
      use_speaker_boost: true
    };
  }
  function showSettings() {
    $('vStab').textContent = (+$('stab').value).toFixed(2);
    $('vSim').textContent = (+$('sim').value).toFixed(2);
    $('vStyle').textContent = (+$('style').value).toFixed(2);
    $('vSpeed').textContent = (+$('speed').value).toFixed(2) + '×';
    remember();
  }
  function applyPreset(name) {
    const p = PRESETS[name];
    $('stab').value = p.stab; $('sim').value = p.sim;
    $('style').value = p.style; $('speed').value = p.speed;
    $('dot').checked = p.dot; $('ctx').checked = p.ctx;
    showSettings();
    log('настройки: ' + (name === 'flat' ? 'ровно, для одного слова' : 'живо, как раньше'));
  }
  document.querySelectorAll('[data-preset]').forEach(b =>
    b.addEventListener('click', () => applyPreset(b.dataset.preset)));
  ['stab','sim','style','speed'].forEach(id => $(id).addEventListener('input', showSettings));
  ['dot','ctx'].forEach(id => $(id).addEventListener('change', remember));

  // текст, который реально уходит в модель
  function phrase(a) {
    const lang = $('lang').value;
    let t = lang === 'de' ? a.de : a.ru;
    if ($('dot').checked) t = t.charAt(0).toUpperCase() + t.slice(1) + '.';
    return t;
  }

  // ── запрос к твоей функции ──────────────────────────────────
  async function speak(text, voiceName) {
    const r = await fetch('/api/speak', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: text,
        voiceId: VOICES[voiceName],
        lang: $('lang').value,
        save: false,
        repo: $('repo').value.trim(),
        adminToken: $('admin').value,
        voiceSettings: readSettings(),
        previousText: $('ctx').checked ? CTX_BEFORE : undefined,
        nextText: $('ctx').checked ? CTX_AFTER : undefined
      })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    return d.audio;
  }

  // единый индикатор: кнопка меняет надпись и блокируется, полоса бежит
  function busy(btn, text) {
    if (btn.dataset.label === undefined) btn.dataset.label = btn.textContent;
    btn.textContent = text;
    btn.disabled = true;
    $('bar').classList.add('busy');
  }
  function idle(btn) {
    if (btn.dataset.label !== undefined) btn.textContent = btn.dataset.label;
    btn.disabled = false;
    $('bar').classList.remove('busy');
  }

  const playB64 = b64 => {
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    new Audio(URL.createObjectURL(new Blob([bytes], { type: 'audio/mpeg' }))).play();
  };

  // ── проба голоса на слове нужного рода ──────────────────────
  document.querySelectorAll('[data-sample]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const g = btn.dataset.sample;
      const a = uniq.find(x => gender(x) === g);
      const lang = $('lang').value;
      busy(btn, 'генерирую…');
      try {
        const b64 = await speak(phrase(a), $('v-' + g).value);
        playB64(b64);
        log('проба ' + g + ': ' + (lang === 'de' ? a.de : a.ru) + ' · ' + $('v-' + g).value, 'have');
      } catch (e) { log('проба ' + g + ' не вышла: ' + e.message, 'err'); }
      idle(btn);
    });
  });

  // ── что уже лежит на сайте ──────────────────────────────────
  async function exists(a) {
    try {
      const r = await fetch(urlFor(a), { method: 'HEAD', cache: 'no-store' });
      const ct = r.headers.get('content-type') || '';
      return r.ok && (ct.indexOf('audio') >= 0 || ct.indexOf('octet-stream') >= 0);
    } catch (e) { return false; }
  }

  $('btnCheck').addEventListener('click', async () => {
    let n = 0, have = 0;
    busy($('btnCheck'), 'проверяю…');
    $('bar').classList.remove('busy');   // тут прогресс настоящий
    const queue = uniq.slice();
    async function worker() {
      while (queue.length) {
        const a = queue.shift();
        const ok = await exists(a);
        if (ok) { onSite[slug(a)] = true; have++; } else { delete onSite[slug(a)]; }
        n++;
        $('fill').style.width = (n / uniq.length * 100).toFixed(1) + '%';
        $('btnCheck').textContent = 'проверяю… ' + n + ' / ' + uniq.length;
        if (n % 5 === 0) render();
      }
    }
    await Promise.all([worker(), worker(), worker(), worker()]);
    render();
    log('на сайте есть ' + have + ' из ' + uniq.length + ', не хватает ' + (uniq.length - have),
        have === uniq.length ? 'have' : 'fresh');
    idle($('btnCheck'));
  });

  // ── озвучка ─────────────────────────────────────────────────
  $('btnGen').addEventListener('click', async () => {
    const lang = $('lang').value;
    const redo = $('redo').checked;
    const todo = uniq.filter(a => redo || (!onSite[slug(a)] && !fresh[slug(a)]));
    if (!todo.length) { log('нечего озвучивать — всё уже есть', 'have'); return; }

    let ok = 0, bad = 0, n = 0;
    busy($('btnGen'), 'озвучиваю…');
    $('bar').classList.remove('busy');   // тут прогресс настоящий
    for (const a of todo) {
      const g = gender(a);
      try {
        fresh[slug(a)] = await speak(phrase(a), $('v-' + g).value);
        ok++;
      } catch (e) {
        bad++;
        log('✗ ' + a.de + ' — ' + e.message, 'err');
      }
      n++;
      $('fill').style.width = (n / todo.length * 100).toFixed(1) + '%';
      $('btnGen').textContent = 'озвучиваю… ' + n + ' / ' + todo.length;
      render();
      await new Promise(r => setTimeout(r, 250));
    }
    log('озвучено ' + ok + ', ошибок ' + bad, bad ? 'err' : 'have');
    idle($('btnGen'));
    $('btnPub').disabled = ok === 0;
  });

  // ── публикация ──────────────────────────────────────────────
  $('btnPub').addEventListener('click', async () => {
    const lang = $('lang').value;
    const files = Object.keys(fresh).map(s => ({
      path: 'voice/' + lang + '/' + s + '.mp3',
      content: fresh[s]
    }));
    if (!files.length) return;
    busy($('btnPub'), 'записываю ' + files.length + ' файлов…');
    log('отправляю ' + files.length + ' файлов в ' + $('repo').value.trim() + ', это займёт несколько секунд');
    try {
      const r = await fetch('/api/commit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          repo: $('repo').value.trim(),
          message: 'Голоса: ' + files.length + ' слов · ' +
                   GENDERS.map(g => g + '=' + $('v-' + g).value).join(' ') +
                   ' · ровность ' + (+$('stab').value).toFixed(2) +
                   ' скорость ' + (+$('speed').value).toFixed(2),
          files: files,
          adminToken: $('admin').value
        })
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      log('коммит ' + String(d.commit).slice(0, 7) + ' · файлов ' + d.count +
          ' · появятся на сайте после пересборки', 'have');
      Object.keys(fresh).forEach(s => { onSite[s] = true; });
      render();
    } catch (e) { log('коммит не прошёл: ' + e.message, 'err'); }
    idle($('btnPub'));
  });

  // ── список ──────────────────────────────────────────────────
  function render() {
    const lang = $('lang').value;
    let html = '';
    GENDERS.forEach(g => {
      const list = uniq.filter(a => gender(a) === g);
      const missing = list.filter(a => !onSite[slug(a)] && !fresh[slug(a)]).length;
      html += `<div class="grp">${g} · ${$('v-' + g).value} · нет ${missing} из ${list.length}</div>`;
      html += list.map(a => {
        const s = slug(a);
        const isFresh = !!fresh[s], isOn = !!onSite[s];
        const cls = isFresh ? 'fresh' : (isOn ? 'have' : 'miss');
        const txt = isFresh ? 'новое' : (isOn ? 'есть' : 'нет');
        return `<div class="item">
          <button class="play" data-slug="${s}" ${(isFresh || isOn) ? '' : 'disabled'}>▶</button>
          <span class="w">${lang === 'de' ? a.de : a.ru}</span>
          <span class="st ${cls}">${txt}</span>
        </div>`;
      }).join('');
    });
    $('list').innerHTML = html;
  }

  $('list').addEventListener('click', e => {
    const b = e.target.closest('.play');
    if (!b || b.disabled) return;
    const s = b.dataset.slug;
    if (fresh[s]) { playB64(fresh[s]); return; }
    new Audio('voice/' + $('lang').value + '/' + s + '.mp3').play();
  });

  if (needPreset) applyPreset('flat');
  showSettings();
  render();
})();
</script>
<script src="console.js"></script>
</body>
</html>
