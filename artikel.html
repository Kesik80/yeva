<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Der Die Das</title>
<meta name="theme-color" content="#5B6BC0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/icons/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<meta name="apple-mobile-web-app-title" content="YEVA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  html{background:#5B6BC0}
  body{
    position:fixed;inset:0;
    font-family:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:#20264F;
    background:
      radial-gradient(110% 70% at 84% 106%, rgba(255,226,180,.4), transparent 62%),
      radial-gradient(90% 60% at 8% 2%, rgba(210,235,255,.5), transparent 66%),
      linear-gradient(180deg,#5B6BC0 0%,#8E9AD8 40%,#D5DBF2 76%,#F7F8FF 100%);
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 9px) 10px calc(env(safe-area-inset-bottom,0px) + 9px);
  }

  .top{display:flex;align-items:center;gap:8px;flex:none}
  .stars{
    display:flex;gap:3px;flex:1;min-width:0;overflow:hidden;
    background:rgba(255,255,255,.7);border-radius:999px;padding:9px 11px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(32,38,79,.13);
  }
  .stars i{flex:1 1 8px;max-width:15px;min-width:6px;aspect-ratio:1;border-radius:50%;
    background:rgba(32,38,79,.14);transition:transform .3s,background .3s}
  .stars i.on{background:linear-gradient(160deg,#FFD86E,#F2913A);transform:scale(1.12)}
  .score{
    flex:none;display:flex;gap:7px;align-items:center;
    background:rgba(255,255,255,.7);border-radius:999px;padding:9px 11px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(32,38,79,.13);
    font-size:14.5px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;
  }
  .score .ok{color:#2E9E86}
  .score .bad{color:#C0616B}

  .btn{
    width:44px;height:44px;flex:none;border:0;border-radius:50%;
    background:rgba(255,255,255,.7);color:#20264F;text-decoration:none;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(32,38,79,.14);
    display:grid;place-items:center;cursor:pointer;transition:transform .12s;
  }
  .btn:active{transform:scale(.9)}
  .btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:1.6vh}
  /* карточка живёт по центру свободного места, домики всегда внизу —
     большой палец ребёнка достаёт до них, не перекрывая картинку */
  .mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:1.2vh;width:100%}

  /* ── карточка со словом ── */
  .card{
    display:grid;place-items:center;gap:.6vh;
    background:rgba(255,255,255,.78);border-radius:30px;
    padding:clamp(10px,3vh,22px) clamp(16px,6vw,34px);
    box-shadow:0 12px 32px rgba(32,38,79,.16);
    transition:transform .45s cubic-bezier(.4,0,.3,1),opacity .35s;
  }
  .card .pic{font-size:clamp(54px,17vh,110px);line-height:1}
  .card .word{
    font-size:clamp(22px,6.4vw,34px);font-weight:600;line-height:1.2;
    color:#20264F;white-space:nowrap;
  }
  .card .word b{font-weight:600;opacity:0;transition:opacity .3s}
  .card.done .word b{opacity:1}
  .card .word b.der{color:#2F6FD0}
  .card .word b.die{color:#D0397E}
  .card .word b.das{color:#2E9052}
  .card.gone{opacity:0}
  @keyframes pop{from{transform:scale(.4);opacity:0}}
  .card.fresh{animation:pop .4s cubic-bezier(.3,1.5,.5,1)}

  .say{
    font-size:clamp(12px,3.6vw,16px);font-weight:500;color:rgba(32,38,79,.46);
    flex:none;text-align:center;padding:0 8px;min-height:1.3em;
  }

  /* ── три домика ── */
  .houses{display:flex;gap:clamp(7px,2.6vw,14px);width:100%;flex:none}
  .house{
    flex:1 1 0;border:0;cursor:pointer;font-family:inherit;
    border-radius:26px;padding:clamp(12px,2.4vh,20px) 4px;
    font-size:clamp(22px,7vw,34px);font-weight:600;color:#fff;
    box-shadow:0 8px 22px rgba(32,38,79,.18);
    transition:transform .14s,filter .25s,box-shadow .25s;
  }
  .house:active{transform:scale(.95)}
  .house[data-a="der"]{background:linear-gradient(160deg,#5E9BE8,#2F6FD0)}
  .house[data-a="die"]{background:linear-gradient(160deg,#F06AA6,#D0397E)}
  .house[data-a="das"]{background:linear-gradient(160deg,#5FBE7E,#2E9052)}
  .house.wrong{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}22%{transform:translateX(-9px)}
    55%{transform:translateX(8px)}80%{transform:translateX(-4px)}}
  .house.hint{animation:hint 1.1s ease-in-out infinite}
  @keyframes hint{0%,100%{box-shadow:0 8px 22px rgba(32,38,79,.18)}
    50%{box-shadow:0 0 0 7px rgba(255,216,110,.9),0 8px 22px rgba(32,38,79,.2)}}
  .house.right{filter:brightness(1.12)}
  .houses.off .house{opacity:.5}

  /* ── старт ── */
  .veil{
    position:fixed;inset:0;z-index:20;display:flex;
    background:rgba(142,154,216,.5);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    transition:opacity .3s;padding:18px;
    overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  }
  .veil.hidden{opacity:0;pointer-events:none}
  .panel{
    width:100%;max-width:400px;text-align:center;margin:auto;flex:none;
    background:rgba(255,255,255,.76);border-radius:30px;padding:22px 20px 26px;
    box-shadow:0 18px 44px rgba(32,38,79,.22);
  }
  .panel h1{font-size:clamp(24px,7vw,32px);font-weight:600}
  .panel .ru{font-size:14px;color:rgba(32,38,79,.58);margin-top:2px}
  .stats{
    margin-top:14px;font-size:13.5px;line-height:1.55;color:rgba(32,38,79,.62);
    background:rgba(255,255,255,.55);border-radius:16px;padding:10px 12px;
  }
  .stats b{color:#20264F;font-weight:600}
  .stats .hard{font-size:12.5px;color:rgba(32,38,79,.5)}
  .stats button{
    width:auto;margin:8px auto 0;padding:6px 12px;font-size:12px;border-radius:9px;
    border:0;background:rgba(32,38,79,.07);color:rgba(32,38,79,.6);
    font-family:inherit;cursor:pointer;display:block;
  }
  .tip{margin-top:11px;font-size:12px;line-height:1.5;color:rgba(32,38,79,.5);padding:0 4px}
  .tip i{font-style:normal;font-weight:600}
  .tip i.der{color:#2F6FD0}.tip i.die{color:#D0397E}.tip i.das{color:#2E9052}
  .big{
    margin:20px auto 0;width:min(40vw,150px);aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;
    display:grid;place-items:center;color:#20264F;
    background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.98),rgba(255,255,255,.3) 30%,rgba(255,216,110,.5) 58%,rgba(91,107,192,.45) 80%,rgba(255,255,255,.92) 100%);
    box-shadow:0 18px 44px rgba(32,38,79,.25),inset 0 0 34px rgba(255,255,255,.6);
    animation:float 3.6s ease-in-out infinite;
  }
  .big svg{width:34%;height:34%;fill:currentColor;stroke:none}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @media (max-height:560px){
    .panel{padding:14px 18px 16px}
    .panel h1{font-size:22px}
    .stats{margin-top:9px;font-size:12.5px}
    .tip{margin-top:7px}
    .big{margin-top:12px;width:min(24vh,104px)}
  }

  .party{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
  .party i{position:absolute;width:12px;height:16px;border-radius:3px;animation:fall linear forwards}
  @keyframes fall{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(112vh) rotate(680deg)}}

  @media (prefers-reduced-motion:reduce){
    .big{animation:none}.card{transition:opacity .2s}.card.fresh{animation:none}
    .house.hint{animation:none;box-shadow:0 0 0 6px rgba(255,216,110,.9)}
  }
</style>
</head>
<body>

<script src="words.js"></script>

<div class="top">
  <div class="stars" id="stars"></div>
  <div class="score" id="score" aria-label="Ответы"></div>
  <button class="btn" id="btnAgain" aria-label="Повторить">
    <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M16 9.2a4 4 0 0 1 0 5.6"/><path d="M18.6 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
  </button>
  <a class="btn" href="index.html" aria-label="Домой">
    <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
  </a>
</div>

<div class="stage">
  <div class="mid">
    <div class="card" id="card">
      <div class="pic" id="pic"></div>
      <div class="word" id="word"></div>
    </div>
    <div class="say" id="say"></div>
  </div>
  <div class="houses" id="houses">
    <button class="house" data-a="der">der</button>
    <button class="house" data-a="die">die</button>
    <button class="house" data-a="das">das</button>
  </div>
</div>

<div class="veil" id="veil">
  <div class="panel">
    <h1>Der Die Das</h1>
    <div class="ru">Артикли на слух</div>
    <div class="stats" id="stats"></div>
    <div class="tip">Слушай слово целиком и выбирай домик. Цвета те же, что в немецкой школе:
      <i class="der">der</i> синий, <i class="die">die</i> красный, <i class="das">das</i> зелёный</div>
    <button class="big" id="btnStart" aria-label="Играть">
      <svg viewBox="0 0 24 24"><path d="M8 4.8v14.4L20 12z"/></svg>
    </button>
  </div>
</div>

<div class="party" id="party"></div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const YW = window.YEVA_WORDS;
  if (!YW || !YW.pictured) {
    document.body.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif">' +
      'Нужен words.js</div>';
    return;
  }

  const CFG = { goal: 8, voice: 'voice/de/' };
  const ARTS = ['der', 'die', 'das'];
  const K_STATS = 'yeva.artikel.stats';

  // артикль берём из самого слова: «die Katze» → die
  const artOf = w => (String(w.de).match(/^(der|die|das)\s/) || [])[1] || '';
  const bare = w => String(w.de).replace(/^(der|die|das)\s+/, '');

  // Только слова с картинкой и артиклем. Запись у них уже с артиклем —
  // «die Katze», — значит игра слышится целиком, как в жизни.
  const WORDS = YW.pictured.filter(artOf);
  const BY = { der: [], die: [], das: [] };
  WORDS.forEach(w => BY[artOf(w)].push(w));

  const irand = n => Math.floor(Math.random() * n);
  const pick = a => a[irand(a.length)];

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  let cur = null, done = 0, locked = true, wrongs = 0, hintT = 0, lastDe = '';

  /* ── статистика ── */
  const today = () => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
           '-' + String(d.getDate()).padStart(2, '0');
  };
  let stats = (() => {
    try { return JSON.parse(store.get(K_STATS, '')) || null; } catch (e) { return null; }
  })() || { ok: 0, bad: 0, days: {}, tasks: {} };
  const ses = { ok: 0, bad: 0 };

  function bump(kind) {
    stats[kind] = (stats[kind] || 0) + 1;
    ses[kind]++;
    const d = stats.days[today()] || (stats.days[today()] = { ok: 0, bad: 0 });
    d[kind]++;
    const t = stats.tasks[cur.de] || (stats.tasks[cur.de] = { ok: 0, bad: 0 });
    t[kind]++;
    const keep = Object.keys(stats.days).sort().slice(-30);
    const days = {};
    keep.forEach(k => { days[k] = stats.days[k]; });
    stats.days = days;
    try { store.set(K_STATS, JSON.stringify(stats)); } catch (e) {}
    paintScore();
  }

  function paintScore() {
    $('score').innerHTML = '<span class="ok">✓ ' + ses.ok + '</span>' +
                           '<span class="bad">✕ ' + ses.bad + '</span>';
  }

  function paintStats() {
    const d = stats.days[today()] || { ok: 0, bad: 0 };
    const hard = Object.keys(stats.tasks)
      .filter(k => stats.tasks[k].bad > 0)
      .sort((x, y) => stats.tasks[y].bad - stats.tasks[x].bad)
      .slice(0, 3);
    let h = '';
    if (!stats.ok && !stats.bad) {
      h = 'Пока ни одного ответа — счёт появится после первой игры';
    } else {
      h = 'Сегодня: <b>' + d.ok + '</b> верных · <b>' + d.bad + '</b> мимо<br>' +
          'Всего: <b>' + stats.ok + '</b> верных · <b>' + stats.bad + '</b> мимо';
      if (hard.length) {
        h += '<div class="hard">труднее всего: ' +
             hard.map(k => k + ' (' + stats.tasks[k].bad + ')').join(', ') +
             '<br>такие слова выпадают чаще</div>';
      }
      h += '<button id="btnClear">очистить статистику</button>';
    }
    $('stats').innerHTML = h;
  }

  $('stats').addEventListener('click', e => {
    if (!e.target.closest('#btnClear')) return;
    stats = { ok: 0, bad: 0, days: {}, tasks: {} };
    ses.ok = 0; ses.bad = 0;
    try { store.set(K_STATS, JSON.stringify(stats)); } catch (e2) {}
    paintStats(); paintScore();
  });

  /* ── выбор слова ──
     Сначала жребий между артиклями, и только потом слово этого рода.
     Иначе «der» выпадал бы почти вдвое чаще остальных — в наборе 44
     мужских слова против 22 средних, — и выгодной стратегией стало бы
     просто всегда тыкать в синий домик. */
  function weightOf(w) {
    const t = stats.tasks[w.de] || { ok: 0, bad: 0 };
    const v = (1 + 1.8 * (t.bad || 0)) / (1 + 0.7 * (t.ok || 0));
    return Math.max(0.15, Math.min(3, v));
  }

  function nextWord() {
    let bag = BY[pick(ARTS)];
    if (!bag || !bag.length) bag = WORDS;
    let list = bag.filter(w => w.de !== lastDe);
    if (!list.length) list = bag;
    let total = 0;
    const ws = list.map(w => { const v = weightOf(w); total += v; return v; });
    let r = Math.random() * total;
    for (let i = 0; i < list.length; i++) { r -= ws[i]; if (r <= 0) return list[i]; }
    return list[list.length - 1];
  }

  /* ── звук ── */
  let actx = null, master = null;
  const vBuf = {}, vBad = {}, vHot = {};

  function initAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.32;
    master.connect(actx.destination);
  }

  const vUrl = w => CFG.voice + YW.slug(w) + '.mp3';

  function load(w) {
    if (!actx || !w) return;
    const u = vUrl(w);
    if (vBuf[u] || vBad[u] || vHot[u]) return;
    vHot[u] = 1;
    fetch(u)
      .then(r => r.ok ? r : fetch(u + '?v=' + Date.now(), { cache: 'no-store' }))
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(ab => actx.decodeAudioData(ab))
      .then(buf => { vBuf[u] = buf; })
      .catch(e => { vBad[u] = true; console.warn('[voice] нет ' + u + ' — ' + e.message); });
  }

  function say(w) {
    if (!w) return;
    load(w);
    const u = vUrl(w);
    let tries = 0;
    (function wait() {
      if (vBuf[u]) {
        const src = actx.createBufferSource(), g = actx.createGain();
        g.gain.value = 1.25;
        src.buffer = vBuf[u];
        src.connect(g); g.connect(master);
        src.start();
        return;
      }
      if (vBad[u]) { speak(w); return; }
      if (tries++ < 10) { setTimeout(wait, 120); return; }
      speak(w);
    })();
  }

  // пока записи нет — читает системный голос, чтобы игра не молчала
  function speak(w) {
    try {
      if (typeof speechSynthesis === 'undefined') return;
      speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(w.de);
      ut.lang = 'de-DE'; ut.rate = 0.9; ut.pitch = 1.1;
      speechSynthesis.speak(ut);
    } catch (e) {}
  }

  function tone(type, freq, at, dur, vol, to) {
    if (!actx) return;
    const t = actx.currentTime + at;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur * 0.9);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  }
  const yay = () => [0, 4, 7, 12].forEach((n, i) => tone('triangle', 523.25 * Math.pow(2, n / 12), i * 0.07, 0.4, 0.3));
  const nope = () => { tone('sine', 300, 0, 0.16, 0.2, 240); tone('sine', 240, 0.15, 0.24, 0.18, 190); };
  const fanfare = () => [0, 4, 7, 12, 7, 12, 16].forEach((n, i) => tone('triangle', 392 * Math.pow(2, n / 12), i * 0.12, 0.42, 0.33));
  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  /* ── раунд ── */
  function round() {
    clearTimeout(hintT);
    wrongs = 0;
    cur = nextWord();
    lastDe = cur.de;

    const card = $('card');
    card.classList.remove('done', 'gone', 'fresh');
    void card.offsetWidth;
    card.classList.add('fresh');
    card.style.transform = '';
    $('pic').textContent = cur.e;
    // артикль спрятан: он появится вместе с ответом
    $('word').innerHTML = '<b class="' + artOf(cur) + '">' + artOf(cur) + '</b> ' + bare(cur);
    $('say').textContent = '';

    $('houses').classList.remove('off');
    document.querySelectorAll('.house').forEach(h => h.classList.remove('wrong', 'hint', 'right'));

    locked = false;
    say(cur);
    // соседние слова подгружаем заранее, чтобы следующий раз не ждал
    ARTS.forEach(a => { const w = pick(BY[a]); if (w) load(w); });
    hintT = setTimeout(showHint, 9000);
  }

  function showHint() {
    const h = document.querySelector('.house[data-a="' + artOf(cur) + '"]');
    if (h) h.classList.add('hint');
  }

  function tap(btn) {
    if (locked || !cur) return;
    const a = btn.dataset.a;

    if (a !== artOf(cur)) {
      wrongs++;
      btn.classList.remove('wrong');
      void btn.offsetWidth;
      btn.classList.add('wrong');
      setTimeout(() => btn.classList.remove('wrong'), 420);
      nope(); buzz(40);
      bump('bad');
      $('say').textContent = 'послушай ещё раз';
      say(cur);
      if (wrongs >= 2) showHint();
      return;
    }

    locked = true;
    clearTimeout(hintT);
    btn.classList.add('right');
    btn.classList.remove('hint');
    $('houses').classList.add('off');
    $('card').classList.add('done');       // артикль проявляется в слове
    $('say').textContent = cur.de;
    yay(); buzz(30);
    bump('ok');

    // карточка уезжает в свой домик
    const card = $('card');
    const r1 = card.getBoundingClientRect(), r2 = btn.getBoundingClientRect();
    const dx = (r2.left + r2.width / 2) - (r1.left + r1.width / 2);
    const dy = (r2.top + r2.height / 2) - (r1.top + r1.height / 2);
    setTimeout(() => {
      card.style.transform = 'translate(' + dx.toFixed(0) + 'px,' + dy.toFixed(0) + 'px) scale(.25)';
      card.classList.add('gone');
    }, 620);

    setTimeout(() => say(cur), 380);       // ещё раз, уже как подтверждение

    done++;
    paintStars();
    const next = () => { if (done >= CFG.goal) party(); else round(); };
    setTimeout(next, 1450);
  }

  $('houses').addEventListener('click', e => {
    const h = e.target.closest('.house');
    if (h) tap(h);
  });
  $('btnAgain').addEventListener('click', () => { initAudio(); if (cur) say(cur); });

  /* ── звёзды и салют ── */
  function paintStars() {
    let h = '';
    for (let i = 0; i < CFG.goal; i++) h += '<i class="' + (i < done ? 'on' : '') + '"></i>';
    $('stars').innerHTML = h;
  }

  function party() {
    fanfare(); buzz([20, 60, 20, 60, 40]);
    const box = $('party');
    const colors = ['#FFD86E', '#2F6FD0', '#D0397E', '#2E9052', '#8E9AD8'];
    for (let i = 0; i < 70; i++) {
      const c = document.createElement('i');
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
      c.style.animationDelay = (Math.random() * 0.7) + 's';
      box.appendChild(c);
    }
    setTimeout(() => { box.innerHTML = ''; }, 4200);
    done = 0;
    paintStars();
    setTimeout(round, 3200);
  }

  /* ── старт ── */
  function goFullscreen() {
    // Установленная игра и так во весь экран. Запрос полноэкранного режима
    // добавляет только системную подсказку «проведите сверху вниз и нажмите
    // Назад» — ребёнок её не уберёт.
    try {
      if ((window.matchMedia && (matchMedia('(display-mode: fullscreen)').matches ||
           matchMedia('(display-mode: standalone)').matches)) || navigator.standalone) return;
    } catch (e) {}
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!fn || document.fullscreenElement) return;
    try {
      const p = fn.call(el, { navigationUI: 'hide' });
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  $('btnStart').addEventListener('click', () => {
    goFullscreen();
    initAudio();
    $('veil').classList.add('hidden');
    done = 0;
    paintStars();
    round();
  });

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && actx && actx.state === 'suspended') actx.resume();
  });

  paintStars();
  paintScore();
  paintStats();
})();
</script>
<script src="install.js"></script>
<script src="home.js"></script>
<script src="console.js"></script>
</body>
