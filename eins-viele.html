<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Eins und viele</title>
<meta name="theme-color" content="#C98BE0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/icons/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<meta name="apple-mobile-web-app-title" content="YEVA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  html{background:#C98BE0}
  body{
    position:fixed;inset:0;
    font-family:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:#3B2150;
    background:
      radial-gradient(110% 70% at 84% 106%, rgba(255,226,190,.42), transparent 62%),
      radial-gradient(90% 60% at 8% 2%, rgba(232,220,255,.5), transparent 66%),
      linear-gradient(180deg,#C98BE0 0%,#DCB2EC 40%,#F0E4F8 76%,#FDFAFF 100%);
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 9px) 10px calc(env(safe-area-inset-bottom,0px) + 9px);
  }

  .top{display:flex;align-items:center;gap:8px;flex:none}
  .stars{
    display:flex;gap:3px;flex:1;min-width:0;overflow:hidden;
    background:rgba(255,255,255,.7);border-radius:999px;padding:9px 11px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(59,33,80,.13);
  }
  .stars i{flex:1 1 8px;max-width:15px;min-width:6px;aspect-ratio:1;border-radius:50%;
    background:rgba(59,33,80,.14);transition:transform .3s,background .3s}
  .stars i.on{background:linear-gradient(160deg,#FFD86E,#F2913A);transform:scale(1.12)}
  .score{
    flex:none;display:flex;gap:7px;align-items:center;
    background:rgba(255,255,255,.7);border-radius:999px;padding:9px 11px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(59,33,80,.13);
    font-size:14.5px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;
  }
  .score .ok{color:#2E9E86}
  .score .bad{color:#C0616B}

  .btn{
    width:44px;height:44px;flex:none;border:0;border-radius:50%;
    background:rgba(255,255,255,.7);color:#3B2150;text-decoration:none;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(59,33,80,.14);
    display:grid;place-items:center;cursor:pointer;transition:transform .12s;
  }
  .btn:active{transform:scale(.9)}
  .btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:1.4vh}

  /* ── большая кнопка «послушать» ── */
  .listen{
    flex:none;margin-top:1vh;width:min(26vw,96px);aspect-ratio:1;border:0;border-radius:50%;
    cursor:pointer;display:grid;place-items:center;color:#5C3474;
    background:rgba(255,255,255,.82);
    box-shadow:0 10px 26px rgba(59,33,80,.2);
    transition:transform .14s;
  }
  .listen:active{transform:scale(.93)}
  .listen svg{width:46%;height:46%;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}

  /* ── две карточки ── */
  .pair{flex:1;min-height:0;display:flex;align-items:center;gap:clamp(8px,3vw,16px);width:100%}
  .pick{
    flex:1 1 0;height:100%;max-height:min(58vh,430px);border:0;cursor:pointer;
    background:rgba(255,255,255,.8);border-radius:28px;padding:10px;
    box-shadow:0 10px 26px rgba(59,33,80,.16);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    font-family:inherit;transition:transform .14s,background .3s,box-shadow .3s;
    overflow:hidden;
  }
  .pick:active{transform:scale(.96)}
  .pick .one{font-size:clamp(44px,13vh,92px);line-height:1}
  .pick .many{
    display:flex;flex-wrap:wrap;gap:2px;justify-content:center;align-items:center;
    font-size:clamp(26px,7.6vh,54px);line-height:1;max-width:100%;
  }
  .pick b{
    font-size:clamp(13px,3.6vw,18px);font-weight:600;color:#3B2150;
    opacity:0;transition:opacity .3s;white-space:nowrap;
  }
  .pick.show b{opacity:1}
  .pick.right{background:linear-gradient(160deg,#9BE8CE,#4FC3A1)}
  .pick.wrong{background:rgba(255,190,180,.95);animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}22%{transform:translateX(-9px)}
    55%{transform:translateX(8px)}80%{transform:translateX(-4px)}}
  .pick.hint{animation:hint 1.1s ease-in-out infinite}
  @keyframes hint{0%,100%{box-shadow:0 10px 26px rgba(59,33,80,.16)}
    50%{box-shadow:0 0 0 7px rgba(255,216,110,.9),0 10px 26px rgba(59,33,80,.18)}}

  .say{
    font-size:clamp(14px,4.2vw,20px);font-weight:600;color:rgba(59,33,80,.6);
    flex:none;text-align:center;min-height:1.4em;padding:0 8px;
  }

  /* ── старт ── */
  .veil{
    position:fixed;inset:0;z-index:20;display:flex;
    background:rgba(220,178,236,.5);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    transition:opacity .3s;padding:18px;
    overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  }
  .veil.hidden{opacity:0;pointer-events:none}
  .panel{
    width:100%;max-width:400px;text-align:center;margin:auto;flex:none;
    background:rgba(255,255,255,.78);border-radius:30px;padding:22px 20px 26px;
    box-shadow:0 18px 44px rgba(59,33,80,.22);
  }
  .panel h1{font-size:clamp(23px,6.6vw,30px);font-weight:600}
  .panel .ru{font-size:14px;color:rgba(59,33,80,.58);margin-top:2px}
  .stats{
    margin-top:14px;font-size:13.5px;line-height:1.55;color:rgba(59,33,80,.62);
    background:rgba(255,255,255,.55);border-radius:16px;padding:10px 12px;
  }
  .stats b{color:#3B2150;font-weight:600}
  .stats .hard{font-size:12.5px;color:rgba(59,33,80,.5)}
  .stats button{
    width:auto;margin:8px auto 0;padding:6px 12px;font-size:12px;border-radius:9px;
    border:0;background:rgba(59,33,80,.07);color:rgba(59,33,80,.6);
    font-family:inherit;cursor:pointer;display:block;
  }
  .tip{margin-top:11px;font-size:12px;line-height:1.5;color:rgba(59,33,80,.5);padding:0 4px}
  .big{
    margin:20px auto 0;width:min(40vw,150px);aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;
    display:grid;place-items:center;color:#3B2150;
    background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.98),rgba(255,255,255,.3) 30%,rgba(255,216,110,.5) 58%,rgba(201,139,224,.45) 80%,rgba(255,255,255,.92) 100%);
    box-shadow:0 18px 44px rgba(59,33,80,.25),inset 0 0 34px rgba(255,255,255,.6);
    animation:float 3.6s ease-in-out infinite;
  }
  .big svg{width:34%;height:34%;fill:currentColor;stroke:none}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @media (max-height:560px){
    .panel{padding:14px 18px 16px}
    .panel h1{font-size:21px}
    .stats{margin-top:9px;font-size:12.5px}
    .tip{margin-top:7px}
    .big{margin-top:12px;width:min(24vh,104px)}
    .listen{width:min(18vw,70px);margin-top:0}
  }

  .party{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
  .party i{position:absolute;width:12px;height:16px;border-radius:3px;animation:fall linear forwards}
  @keyframes fall{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(112vh) rotate(680deg)}}

  @media (prefers-reduced-motion:reduce){
    .big{animation:none}.pick.hint{animation:none;box-shadow:0 0 0 6px rgba(255,216,110,.9)}
  }
</style>
</head>
<body>

<script src="words.js"></script>

<div class="top">
  <div class="stars" id="stars"></div>
  <div class="score" id="score" aria-label="Ответы"></div>
  <button class="btn" id="btnAgain" aria-label="Повторить">
    <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M16 9.2a4 4 0 0 1 0 5.6"/><path d="M18.6 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
  </button>
  <a class="btn" href="index.html" aria-label="Домой">
    <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
  </a>
</div>

<div class="stage">
  <button class="listen" id="listen" aria-label="Послушать ещё раз">
    <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M16 9.2a4 4 0 0 1 0 5.6"/><path d="M18.6 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
  </button>
  <div class="pair">
    <button class="pick" id="left"></button>
    <button class="pick" id="right"></button>
  </div>
  <div class="say" id="say"></div>
</div>

<div class="veil" id="veil">
  <div class="panel">
    <h1>Eins und viele</h1>
    <div class="ru">Один — много</div>
    <div class="stats" id="stats"></div>
    <div class="tip">Голос говорит слово, а ты выбираешь: один или много. Немецкое множественное нерегулярное — Hund становится Hunde, Apfel становится Äpfel, — его только на слух и запомнишь</div>
    <button class="big" id="btnStart" aria-label="Играть">
      <svg viewBox="0 0 24 24"><path d="M8 4.8v14.4L20 12z"/></svg>
    </button>
  </div>
</div>

<div class="party" id="party"></div>

<script src="pair.js"></script>
<script>YEVA_PAIR.start({ game: 'plural' });</script>
<script src="install.js"></script>
<script src="console.js"></script>
</body>
</html>
