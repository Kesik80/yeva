<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Plus</title>
<meta name="theme-color" content="#8C7AE0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/icons/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<meta name="apple-mobile-web-app-title" content="YEVA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  html{background:#8C7AE0}
  body{
    position:fixed;inset:0;
    font-family:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:#2E2358;
    background:
      radial-gradient(110% 70% at 84% 106%, rgba(255,214,150,.45), transparent 62%),
      radial-gradient(90% 60% at 8% 2%, rgba(200,235,255,.5), transparent 66%),
      linear-gradient(180deg,#8C7AE0 0%,#AEA2EC 40%,#DCD6F7 76%,#F6F4FF 100%);
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 9px) 10px calc(env(safe-area-inset-bottom,0px) + 9px);
  }

  .top{display:flex;align-items:center;gap:8px;flex:none}
  .stars{
    display:flex;gap:3px;flex:1;min-width:0;overflow:hidden;
    background:rgba(255,255,255,.66);border-radius:999px;padding:9px 11px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(46,35,88,.13);
  }
  /* кружки сами ужимаются, если экран узкий */
  .stars i{flex:1 1 8px;max-width:15px;min-width:6px;aspect-ratio:1;border-radius:50%;
    background:rgba(46,35,88,.14);transition:transform .3s,background .3s}
  .stars i.on{background:linear-gradient(160deg,#FFD86E,#F2913A);transform:scale(1.12)}
  .score{
    flex:none;display:flex;gap:7px;align-items:center;
    background:rgba(255,255,255,.66);border-radius:999px;padding:9px 11px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(46,35,88,.13);
    font-size:14.5px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;
  }
  .score .ok{color:#2E9E86}
  .score .bad{color:#C0616B}

  .btn{
    width:44px;height:44px;flex:none;border:0;border-radius:50%;
    background:rgba(255,255,255,.66);color:#2E2358;text-decoration:none;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(46,35,88,.14);
    display:grid;place-items:center;cursor:pointer;transition:transform .12s;
  }
  .btn:active{transform:scale(.9)}
  .btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh}

  /* ── предметы ── */
  .board{
    display:flex;align-items:center;justify-content:center;gap:clamp(6px,2.5vw,18px);
    width:100%;max-width:100%;flex-wrap:nowrap;overflow:hidden;
  }
  .grp{
    display:grid;place-items:center;
    background:rgba(255,255,255,.34);border-radius:22px;padding:7px;
    box-shadow:0 5px 14px rgba(46,35,88,.07);
  }
  .grp svg{display:block;animation:pop .34s cubic-bezier(.3,1.5,.5,1) backwards}
  .grp span{line-height:1;display:block;animation:pop .3s cubic-bezier(.3,1.5,.5,1) backwards}
  @keyframes pop{from{transform:scale(.3);opacity:0}}
  .op{font-size:clamp(22px,7vw,40px);font-weight:600;color:rgba(46,35,88,.55);flex:none}
  .ans{
    min-width:clamp(52px,16vw,88px);padding:6px 10px;border-radius:20px;
    background:rgba(255,255,255,.72);box-shadow:0 6px 18px rgba(46,35,88,.12);
    font-size:clamp(30px,10vw,58px);font-weight:600;line-height:1.15;text-align:center;color:#5B45C8;
  }
  .ans.done{background:linear-gradient(160deg,#FFD86E,#F2913A);color:#5A3200}

  /* ── цифрами ── */
  .digits{
    font-size:clamp(18px,5.5vw,30px);font-weight:600;color:rgba(46,35,88,.62);
    letter-spacing:.04em;flex:none;
  }
  .say{
    font-size:clamp(12px,3.8vw,17px);font-weight:500;color:rgba(46,35,88,.42);
    flex:none;margin-top:-1vh;text-align:center;padding:0 8px;
  }

  /* ── ответы ── */
  .choices{display:flex;gap:clamp(8px,3vw,16px);justify-content:center;width:100%;flex:none}
  .choice{
    flex:1 1 0;max-width:180px;aspect-ratio:1;border:0;border-radius:26px;cursor:pointer;
    background:rgba(255,255,255,.82);color:#2E2358;
    font-family:inherit;font-weight:600;font-size:clamp(30px,11vw,58px);line-height:1;
    display:grid;place-items:center;
    box-shadow:0 8px 22px rgba(46,35,88,.16);
    transition:transform .14s,background .3s,color .3s,opacity .3s;
  }
  .choice:active{transform:scale(.94)}
  .choice.right{background:linear-gradient(160deg,#9BE8CE,#4FC3A1);color:#fff}
  .choice.wrong{background:rgba(255,190,180,.95);animation:shake .34s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}45%{transform:translateX(7px)}70%{transform:translateX(-4px)}}
  .choice.hint{animation:hint 1.1s ease-in-out infinite}
  @keyframes hint{0%,100%{box-shadow:0 8px 22px rgba(46,35,88,.16)}50%{box-shadow:0 0 0 6px rgba(255,216,110,.9),0 8px 22px rgba(46,35,88,.18)}}

  /* ── старт ── */
  .veil{
    position:fixed;inset:0;z-index:20;display:grid;place-items:center;
    background:rgba(174,162,236,.5);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    transition:opacity .3s;padding:18px;
  }
  .veil.hidden{opacity:0;pointer-events:none}
  .panel{
    width:100%;max-width:400px;text-align:center;
    background:rgba(255,255,255,.72);border-radius:30px;padding:22px 20px 26px;
    box-shadow:0 18px 44px rgba(46,35,88,.22);
  }
  .panel h1{font-size:clamp(24px,7vw,32px);font-weight:600}
  .panel .ru{font-size:14px;color:rgba(46,35,88,.58);margin-top:2px}
  .stats{
    margin-top:14px;font-size:13.5px;line-height:1.55;color:rgba(46,35,88,.62);
    background:rgba(255,255,255,.55);border-radius:16px;padding:10px 12px;
  }
  .stats b{color:#2E2358;font-weight:600}
  .stats .hard{font-size:12.5px;color:rgba(46,35,88,.5)}
  .stats button{
    width:auto;margin:8px auto 0;padding:6px 12px;font-size:12px;border-radius:9px;
    border:0;background:rgba(46,35,88,.07);color:rgba(46,35,88,.6);
    font-family:inherit;cursor:pointer;display:block;
  }
  .sizes{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:18px}
  .size{
    border:0;cursor:pointer;font-family:inherit;font-weight:600;font-size:16px;
    padding:11px 15px;border-radius:999px;color:#2E2358;background:rgba(255,255,255,.85);
    box-shadow:0 5px 14px rgba(46,35,88,.13);transition:transform .14s,background .2s,color .2s;
  }
  .size:active{transform:scale(.94)}
  .size.on{background:linear-gradient(160deg,#8C7AE0,#6A55C7);color:#fff}
  .big{
    margin:20px auto 0;width:min(40vw,150px);aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;
    display:grid;place-items:center;color:#2E2358;
    background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.98),rgba(255,255,255,.3) 30%,rgba(255,216,110,.5) 58%,rgba(140,122,224,.45) 80%,rgba(255,255,255,.92) 100%);
    box-shadow:0 18px 44px rgba(46,35,88,.25),inset 0 0 34px rgba(255,255,255,.6);
    animation:float 3.6s ease-in-out infinite;
  }
  .big svg{width:34%;height:34%;fill:currentColor;stroke:none}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

  .party{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
  .party i{position:absolute;width:12px;height:16px;border-radius:3px;animation:fall linear forwards}
  @keyframes fall{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(112vh) rotate(680deg)}}

  @media (prefers-reduced-motion:reduce){
    .big{animation:none}.grp span{animation:none}.choice.hint{animation:none;box-shadow:0 0 0 5px rgba(255,216,110,.9)}
  }
</style>
</head>
<body>

<script src="words.js"></script>
<script src="blocks.js"></script>

<div class="top">
  <div class="stars" id="stars"></div>
  <div class="score" id="score" aria-label="Ответы"></div>
  <button class="btn" id="btnAgain" aria-label="Повторить">
    <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M16 9.2a4 4 0 0 1 0 5.6"/><path d="M18.6 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
  </button>
  <a class="btn" href="index.html" aria-label="Домой">
    <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
  </a>
</div>

<div class="stage">
  <div class="board">
    <div class="grp" id="g1"></div>
    <div class="op">+</div>
    <div class="grp" id="g2"></div>
    <div class="op">=</div>
    <div class="ans" id="ans">?</div>
  </div>
  <div class="digits" id="digits"></div>
  <div class="say" id="say"></div>
  <div class="choices" id="choices"></div>
</div>

<div class="veil" id="veil">
  <div class="panel">
    <h1>Plus</h1>
    <div class="ru">Сложение по-немецки</div>
    <div class="stats" id="stats"></div>
    <div class="sizes" id="sizes"></div>
    <button class="big" id="btnStart" aria-label="Играть">
      <svg viewBox="0 0 24 24"><path d="M8 4.8v14.4L20 12z"/></svg>
    </button>
  </div>
</div>

<div class="party" id="party"></div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const YW = window.YEVA_WORDS;
  if (!YW || !YW.numbers || !YW.math) {
    document.body.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif">' +
      'Нужен words.js версии 8</div>';
    return;
  }

  const CFG = { goal: 8, gap: 0.07, voice: 'voice/de/' };
  const SIZES = [5, 10, 20];
  const K_MAX = 'yeva.plus.max';

  const rand = (a, b) => a + Math.random() * (b - a);
  const irand = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];

  // числа 0–50 одним списком + связки
  const NUM = {};
  (YW.numbers || []).concat(YW.numbersBig || []).forEach(w => { NUM[w.num] = w; });
  const WPLUS = YW.math.find(w => w.de === 'plus');
  const WEQ = YW.math.find(w => w.de === 'ist gleich');

  // целые фразы «eins plus eins ist gleich» — по записи на каждый порядок
  const PHRASE = {};
  (YW.plus || []).forEach(p => { PHRASE[p.a + '_' + p.b] = p; });

  let max = 10, a = 1, b = 1, sum = 2, done = 0, locked = true, wrongs = 0, hintT = 0, cube = 40;

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* ── статистика: сколько верно и сколько мимо ── */
  const K_STATS = 'yeva.plus.stats';
  const today = () => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
           '-' + String(d.getDate()).padStart(2, '0');
  };
  let stats = (() => {
    try { return JSON.parse(store.get(K_STATS, '')) || null; } catch (e) { return null; }
  })() || { ok: 0, bad: 0, days: {}, tasks: {} };
  const ses = { ok: 0, bad: 0 };

  function bump(kind) {
    stats[kind] = (stats[kind] || 0) + 1;
    ses[kind]++;
    const d = stats.days[today()] || (stats.days[today()] = { ok: 0, bad: 0 });
    d[kind]++;
    const key = a + '+' + b;
    const t = stats.tasks[key] || (stats.tasks[key] = { ok: 0, bad: 0 });
    t[kind]++;
    // дольше месяца дни не храним, незачем
    const keep = Object.keys(stats.days).sort().slice(-30);
    const days = {};
    keep.forEach(k => { days[k] = stats.days[k]; });
    stats.days = days;
    try { store.set(K_STATS, JSON.stringify(stats)); } catch (e) {}
    paintScore();
  }

  function paintScore() {
    $('score').innerHTML = '<span class="ok">\u2713 ' + ses.ok + '</span>' +
                           '<span class="bad">\u2715 ' + ses.bad + '</span>';
  }

  function paintStats() {
    const d = stats.days[today()] || { ok: 0, bad: 0 };
    const hard = Object.keys(stats.tasks)
      .filter(k => stats.tasks[k].bad > 0)
      .sort((x, y) => stats.tasks[y].bad - stats.tasks[x].bad)
      .slice(0, 3);
    let h = '';
    if (!stats.ok && !stats.bad) {
      h = 'Пока ни одного ответа — счёт появится после первой игры';
    } else {
      h = 'Сегодня: <b>' + d.ok + '</b> верных · <b>' + d.bad + '</b> мимо<br>' +
          'Всего: <b>' + stats.ok + '</b> верных · <b>' + stats.bad + '</b> мимо';
      if (hard.length) {
        h += '<div class="hard">труднее всего: ' +
             hard.map(k => k + ' (' + stats.tasks[k].bad + ')').join(', ') + '</div>';
      }
      h += '<button id="btnClear">очистить статистику</button>';
    }
    $('stats').innerHTML = h;
  }

  $('stats').addEventListener('click', e => {
    if (!e.target.closest('#btnClear')) return;
    stats = { ok: 0, bad: 0, days: {}, tasks: {} };
    ses.ok = 0; ses.bad = 0;
    try { store.set(K_STATS, JSON.stringify(stats)); } catch (e2) {}
    paintStats(); paintScore();
  });

  /* ── звук ── */
  let actx = null, master = null;
  const vBuf = {}, vBad = {}, vHot = {};

  function initAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.32;
    master.connect(actx.destination);
  }

  const vUrl = w => CFG.voice + YW.slug(w) + '.mp3';

  function load(w) {
    if (!actx || !w) return;
    const u = vUrl(w);
    if (vBuf[u] || vBad[u] || vHot[u]) return;
    vHot[u] = 1;
    fetch(u)
      .then(r => r.ok ? r : fetch(u + '?v=' + Date.now(), { cache: 'no-store' }))
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(ab => actx.decodeAudioData(ab))
      .then(buf => { vBuf[u] = buf; })
      .catch(e => { vBad[u] = true; console.warn('[voice] нет ' + u + ' — ' + e.message); });
  }

  // где в файле реально звучит слово: тишину по краям при склейке не ждём
  function edges(buf) {
    if (buf._cut) return buf._cut;
    const d = buf.getChannelData(0), n = d.length, th = 0.012;
    let s = 0, e = n - 1;
    for (let i = 0; i < n; i += 64) { if (Math.abs(d[i]) > th) { s = Math.max(0, i - 700); break; } }
    for (let i = n - 1; i >= 0; i -= 64) { if (Math.abs(d[i]) > th) { e = Math.min(n - 1, i + 1800); break; } }
    if (e <= s) { s = 0; e = n - 1; }
    buf._cut = [s / buf.sampleRate, (e - s) / buf.sampleRate];
    return buf._cut;
  }

  // фраза из отдельных слов: «drei plus zwei» / «ist gleich fünf»
  function say(words, after) {
    // что бы ни случилось со звуком, игра не должна залипнуть:
    // продолжение вызываем ровно один раз
    let fired = false;
    const go = () => { if (!fired) { fired = true; if (after) after(); } };
    if (!actx) { setTimeout(go, 300); return; }

    const list = words.filter(Boolean);
    list.forEach(load);

    const play = () => {
      let t = actx.currentTime + 0.05;
      list.forEach(w => {
        const buf = vBuf[vUrl(w)];
        const cut = edges(buf);
        const src = actx.createBufferSource(), g = actx.createGain();
        g.gain.value = 1.25;
        src.buffer = buf;
        src.connect(g); g.connect(master);
        src.start(t, cut[0], cut[1]);
        t += cut[1] + CFG.gap;
      });
      setTimeout(go, (t - actx.currentTime) * 1000 + 60);
    };

    // пока файлов нет — читает системный голос, чтобы игра не молчала
    const fallback = () => {
      try {
        if (typeof speechSynthesis !== 'undefined') {
          speechSynthesis.cancel();
          const ut = new SpeechSynthesisUtterance(list.map(w => w.de).join(' '));
          ut.lang = 'de-DE'; ut.rate = 0.9; ut.pitch = 1.1;
          ut.onend = go;
          speechSynthesis.speak(ut);
          setTimeout(go, 2600);     // если движок молчит и onend не придёт
          return;
        }
      } catch (e) {}
      setTimeout(go, 400);
    };

    // первый заход на холодном кэше: даём файлам секунду догрузиться
    let tries = 0;
    (function wait() {
      if (list.every(w => vBuf[vUrl(w)])) { play(); return; }
      const hopeless = list.some(w => vBad[vUrl(w)]);
      if (!hopeless && tries++ < 10) { setTimeout(wait, 120); return; }
      fallback();
    })();
  }

  function tone(type, freq, at, dur, vol, to) {
    if (!actx) return;
    const t = actx.currentTime + at;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur * 0.9);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  }
  const yay = () => [0, 4, 7, 12].forEach((n, i) => tone('triangle', 523.25 * Math.pow(2, n / 12), i * 0.07, 0.4, 0.3));
  const nope = () => { tone('sine', 300, 0, 0.16, 0.2, 240); tone('sine', 240, 0.15, 0.24, 0.18, 190); };
  const fanfare = () => [0, 4, 7, 12, 7, 12, 16].forEach((n, i) => tone('triangle', 392 * Math.pow(2, n / 12), i * 0.12, 0.42, 0.33));
  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  /* ── раунд ── */
  // то же, что произносит голос
  function words(withAnswer) {
    const n = v => (NUM[v] ? NUM[v].de : v);
    return n(a) + ' plus ' + n(b) + ' ist gleich' + (withAnswer ? ' ' + n(sum) : ' …');
  }

  const stitch = () => [NUM[a], WPLUS, NUM[b], WEQ];   // запасная склейка из слов
  const ansPhrase = () => [NUM[sum]];                  // ответ — только число

  // вопрос: цельная запись, если она есть; иначе склейка
  function speakAsk(after) {
    const p = PHRASE[a + '_' + b];
    if (!p) { say(stitch(), after); return; }
    load(p);
    let tries = 0;
    (function wait() {
      const u = vUrl(p);
      if (vBuf[u]) { say([p], after); return; }
      if (vBad[u]) { say(stitch(), after); return; }     // записи нет — склеим
      if (tries++ < 10) { setTimeout(wait, 120); return; }
      say(stitch(), after);
    })();
  }

  // сторона кубика в пикселях
  function sizeFor(total) {
    const w = Math.min(window.innerWidth, window.innerHeight * 0.62);
    const k = Math.max(0.8, Math.min(1.6, w / 390));
    if (total <= 4) return Math.round(50 * k);
    if (total <= 6) return Math.round(44 * k);
    if (total <= 10) return Math.round(38 * k);
    if (total <= 14) return Math.round(32 * k);
    if (total <= 20) return Math.round(27 * k);
    return Math.round(23 * k);
  }

  // строка должна помещаться целиком: ужимаем предметы, пока не влезет
  function fit() {
    const board = document.querySelector('.board');
    const stage = document.querySelector('.stage');
    let size = cube;
    let guard = 0;
    while (guard++ < 26 && size > 11 &&
           (board.scrollWidth > board.clientWidth + 1 || stage.scrollHeight > stage.clientHeight + 1)) {
      size = Math.max(11, size * 0.9);
      resize(size);
    }
    cube = size;
  }

  function fill(box, n, size, delay) {
    if (window.YEVA_BLOCKS) {
      box.innerHTML = YEVA_BLOCKS.svg(n);
      const el = box.firstChild;
      YEVA_BLOCKS.size(el, size);
      el.style.animationDelay = delay + 's';
      return;
    }
    // запасной вариант, если blocks.js не подключён
    const cols = Math.ceil(Math.sqrt(n));
    box.style.gridTemplateColumns = 'repeat(' + cols + ', auto)';
    box.style.fontSize = size + 'px';
    let h = '';
    for (let i = 0; i < n; i++) h += '<span>\u2b1b</span>';
    box.innerHTML = h;
  }

  // короткая реакция фигурок на ответ
  function react(kind) {
    if (!window.YEVA_BLOCKS || !YEVA_BLOCKS.react) return;
    YEVA_BLOCKS.react($('g1').firstChild, kind);
    YEVA_BLOCKS.react($('g2').firstChild, kind);
  }

  function resize(size) {
    if (!window.YEVA_BLOCKS) { $('g1').style.fontSize = size + 'px'; $('g2').style.fontSize = size + 'px'; return; }
    YEVA_BLOCKS.size($('g1').firstChild, size);
    YEVA_BLOCKS.size($('g2').firstChild, size);
  }

  function round() {
    clearTimeout(hintT);
    wrongs = 0;
    a = irand(1, max - 1);
    b = irand(1, max - a);
    sum = a + b;

    cube = sizeFor(sum);
    fill($('g1'), a, cube, 0);
    fill($('g2'), b, cube, 0.12);

    $('ans').textContent = '?';
    $('ans').classList.remove('done');
    $('ans').style.background = '';
    $('ans').style.color = '';
    $('digits').textContent = a + ' + ' + b + ' = ?';
    $('say').textContent = words(false);
    fit();

    // три ответа: верный и два соседних
    const opts = [sum];
    let guard = 0;
    while (opts.length < 3 && guard++ < 50) {
      const d = pick([-3, -2, -1, 1, 2, 3]);
      const v = sum + d;
      if (v >= 1 && v <= max && opts.indexOf(v) < 0) opts.push(v);
    }
    while (opts.length < 3) { const v = irand(1, max); if (opts.indexOf(v) < 0) opts.push(v); }
    opts.sort(() => Math.random() - 0.5);

    $('choices').innerHTML = opts.map(v =>
      '<button class="choice" data-v="' + v + '">' + v + '</button>').join('');

    // слова этого раунда и соседних чисел — заранее
    [NUM[a], NUM[b], NUM[sum], WPLUS, WEQ, PHRASE[a + '_' + b]].forEach(load);
    opts.forEach(v => load(NUM[v]));

    // отвечать можно сразу: ребёнок не должен ждать, пока договорит голос
    locked = false;
    speakAsk();
    hintT = setTimeout(showHint, 9000);
  }

  function showHint() {
    const c = $('choices').querySelector('[data-v="' + sum + '"]');
    if (c) c.classList.add('hint');
  }

  function tap(btn) {
    if (locked) return;
    const v = +btn.dataset.v;

    if (v !== sum) {
      wrongs++;
      btn.classList.remove('wrong');
      void btn.offsetWidth;
      btn.classList.add('wrong');
      setTimeout(() => btn.classList.remove('wrong'), 420);
      nope(); buzz(40);
      react('hmm');
      bump('bad');
      if (wrongs >= 2) showHint();
      return;
    }

    locked = true;
    clearTimeout(hintT);
    $('choices').querySelectorAll('.choice').forEach(c => {
      c.classList.remove('hint');
      if (+c.dataset.v !== sum) c.style.opacity = '.35';
    });
    btn.classList.add('right');
    $('ans').textContent = sum;
    $('ans').classList.add('done');
    if (window.YEVA_BLOCKS) {
      $('ans').style.background = YEVA_BLOCKS.color(sum);
      $('ans').style.color = '#fff';
    }
    $('digits').textContent = a + ' + ' + b + ' = ' + sum;
    $('say').textContent = words(true);
    yay(); buzz(30);
    react('yay');
    bump('ok');

    done++;
    paintStars();

    // «ist gleich пять» — и только когда голос договорит, следующий пример
    const next = () => { if (done >= CFG.goal) party(); else round(); };
    setTimeout(() => say(ansPhrase(), () => setTimeout(next, 900)), 260);
  }

  $('choices').addEventListener('click', e => {
    const c = e.target.closest('.choice');
    if (c) tap(c);
  });
  $('btnAgain').addEventListener('click', () => {
    initAudio();
    if ($('ans').classList.contains('done')) speakAsk(() => say(ansPhrase()));
    else speakAsk();
  });

  /* ── звёзды и салют ── */
  function paintStars() {
    let h = '';
    for (let i = 0; i < CFG.goal; i++) h += '<i class="' + (i < done ? 'on' : '') + '"></i>';
    $('stars').innerHTML = h;
  }

  function party() {
    fanfare(); buzz([20, 60, 20, 60, 40]);
    const box = $('party');
    const colors = ['#FFD86E', '#8C7AE0', '#8FD3FF', '#7FC8A9', '#F0A24B'];
    for (let i = 0; i < 70; i++) {
      const c = document.createElement('i');
      c.style.left = rand(0, 100) + 'vw';
      c.style.background = pick(colors);
      c.style.animationDuration = rand(1.8, 3.4) + 's';
      c.style.animationDelay = rand(0, 0.7) + 's';
      box.appendChild(c);
    }
    setTimeout(() => { box.innerHTML = ''; }, 4200);
    done = 0;
    paintStars();
    setTimeout(round, 3200);
  }

  /* ── выбор диапазона ── */
  function paintSizes() {
    $('sizes').innerHTML = SIZES.map(s =>
      '<button class="size' + (s === max ? ' on' : '') + '" data-s="' + s + '">до ' + s + '</button>').join('');
  }
  $('sizes').addEventListener('click', e => {
    const b2 = e.target.closest('.size');
    if (!b2) return;
    max = +b2.dataset.s;
    store.set(K_MAX, String(max));
    paintSizes();
    initAudio();
    tone('sine', 700, 0, 0.08, 0.16, 1000);
  });

  /* ── старт ── */
  function goFullscreen() {
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!fn || document.fullscreenElement) return;
    try {
      const p = fn.call(el, { navigationUI: 'hide' });
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  $('btnStart').addEventListener('click', () => {
    goFullscreen();
    initAudio();
    [WPLUS, WEQ].forEach(load);
    for (let n = 1; n <= max; n++) load(NUM[n]);
    $('veil').classList.add('hidden');
    done = 0;
    paintStars();
    round();
  });

  const relayout = () => { cube = sizeFor(sum); resize(cube); fit(); };
  window.addEventListener('resize', () => setTimeout(relayout, 80));
  window.addEventListener('orientationchange', () => setTimeout(relayout, 260));
  document.addEventListener('fullscreenchange', () => setTimeout(relayout, 160));

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && actx && actx.state === 'suspended') actx.resume();
  });

  max = SIZES.indexOf(+store.get(K_MAX, 10)) >= 0 ? +store.get(K_MAX, 10) : 10;
  paintSizes();
  paintStars();
  paintScore();
  paintStats();
})();
</script>
<script src="install.js"></script>
<script src="console.js"></script>
</body>
