<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Labyrinth</title>
<meta name="theme-color" content="#E0913C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/icons/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<meta name="apple-mobile-web-app-title" content="YEVA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  html{background:#E0913C}
  body{
    position:fixed;inset:0;
    font-family:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:#4A3017;
    background:
      radial-gradient(110% 70% at 84% 106%, rgba(255,230,180,.5), transparent 62%),
      radial-gradient(90% 60% at 8% 2%, rgba(255,245,215,.55), transparent 66%),
      linear-gradient(180deg,#E0913C 0%,#EDB36B 40%,#F7DCB4 76%,#FFF8EE 100%);
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 9px) 10px calc(env(safe-area-inset-bottom,0px) + 9px);
  }

  .top{display:flex;align-items:center;gap:8px;flex:none}
  .stars{
    display:flex;gap:4px;flex:1;min-width:0;overflow:hidden;
    background:rgba(255,255,255,.7);border-radius:999px;padding:9px 12px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(74,48,23,.13);
  }
  .stars i{flex:1 1 9px;max-width:17px;min-width:7px;aspect-ratio:1;border-radius:50%;
    background:rgba(74,48,23,.14);transition:transform .3s,background .3s}
  .stars i.on{background:linear-gradient(160deg,#FFD86E,#E8782F);transform:scale(1.12)}

  .btn{
    width:44px;height:44px;flex:none;border:0;border-radius:50%;
    background:rgba(255,255,255,.7);color:#4A3017;text-decoration:none;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 5px 16px rgba(74,48,23,.14);
    display:grid;place-items:center;cursor:pointer;transition:transform .12s;
  }
  .btn:active{transform:scale(.9)}
  .btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh}

  /* ── собранное ── */
  .tray{
    display:flex;gap:6px;justify-content:center;align-items:center;flex:none;
    min-height:38px;flex-wrap:wrap;padding:0 4px;
  }
  .tray i{
    display:grid;place-items:center;width:34px;height:34px;border-radius:12px;
    background:rgba(255,255,255,.72);box-shadow:0 4px 12px rgba(74,48,23,.12);
    font-size:20px;line-height:1;font-style:normal;
    animation:drop .42s cubic-bezier(.3,1.5,.5,1) backwards;
  }
  .tray i.wait{background:rgba(255,255,255,.3);box-shadow:none;opacity:.5}
  @keyframes drop{from{transform:scale(.2) translateY(-14px);opacity:0}}

  /* ── лабиринт ── */
  .maze{flex:none;display:block;touch-action:none;filter:drop-shadow(0 8px 20px rgba(74,48,23,.14))}
  .maze .floor{fill:rgba(255,255,255,.52)}
  .maze .trail{fill:none;stroke:rgba(232,120,47,.3);stroke-width:.46;
    stroke-linecap:round;stroke-linejoin:round}
  .maze .walls{fill:none;stroke:#8A5A28;stroke-width:.15;stroke-linecap:round}
  .maze .goal{fill:rgba(255,216,110,.9);transition:fill .3s}
  .maze .goal.lock{fill:rgba(74,48,23,.16)}
  .maze .goalnum{font-size:.4px;font-weight:600;fill:rgba(74,48,23,.6);
    text-anchor:middle;dominant-baseline:central}
  .maze .goal.ready{animation:ready 1.2s ease-in-out infinite}
  @keyframes ready{0%,100%{r:.33}50%{r:.42}}
  .tray.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}
    60%{transform:translateX(5px)}}
  .maze .item{font-size:.62px;text-anchor:middle;dominant-baseline:central;
    transition:transform .3s,opacity .3s}
  .maze .item.got{transform:scale(.2);opacity:0}
  .maze .walker{transition:transform .13s linear}
  .maze .done .goal{animation:goal .7s ease-in-out 3}
  @keyframes goal{0%,100%{opacity:1}50%{opacity:.35}}

  .say{
    font-size:clamp(14px,4.6vw,22px);font-weight:600;color:rgba(74,48,23,.6);
    flex:none;text-align:center;padding:0 8px;min-height:1.3em;
  }

  /* ── старт ── */
  .veil{
    position:fixed;inset:0;z-index:20;display:flex;
    background:rgba(237,179,107,.5);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    transition:opacity .3s;padding:18px;
    overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  }
  .veil.hidden{opacity:0;pointer-events:none}
  .panel{
    width:100%;max-width:400px;text-align:center;margin:auto;flex:none;
    background:rgba(255,255,255,.74);border-radius:30px;padding:22px 20px 26px;
    box-shadow:0 18px 44px rgba(74,48,23,.22);
  }
  .panel h1{font-size:clamp(24px,7vw,32px);font-weight:600}
  .panel .ru{font-size:14px;color:rgba(74,48,23,.58);margin-top:2px}
  .tip{margin-top:12px;font-size:12px;line-height:1.5;color:rgba(74,48,23,.5);padding:0 4px}
  .sizes{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:16px}
  .size{
    border:0;cursor:pointer;font-family:inherit;font-weight:600;font-size:16px;
    padding:11px 15px;border-radius:999px;color:#4A3017;background:rgba(255,255,255,.88);
    box-shadow:0 5px 14px rgba(74,48,23,.13);transition:transform .14s,background .2s,color .2s;
  }
  .size:active{transform:scale(.94)}
  .size.on{background:linear-gradient(160deg,#E0913C,#B96A1E);color:#fff}
  .big{
    margin:20px auto 0;width:min(40vw,150px);aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;
    display:grid;place-items:center;color:#4A3017;
    background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.98),rgba(255,255,255,.3) 30%,rgba(255,216,110,.55) 58%,rgba(224,145,60,.45) 80%,rgba(255,255,255,.92) 100%);
    box-shadow:0 18px 44px rgba(74,48,23,.25),inset 0 0 34px rgba(255,255,255,.6);
    animation:float 3.6s ease-in-out infinite;
  }
  .big svg{width:34%;height:34%;fill:currentColor;stroke:none}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @media (max-height:560px){
    .panel{padding:14px 18px 16px}
    .panel h1{font-size:22px}
    .tip{margin-top:8px}
    .sizes{margin-top:11px;gap:7px}
    .size{padding:8px 13px;font-size:15px}
    .big{margin-top:12px;width:min(24vh,104px)}
  }

  .party{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
  .party i{position:absolute;width:12px;height:16px;border-radius:3px;animation:fall linear forwards}
  @keyframes fall{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(112vh) rotate(680deg)}}

  /* салют на самом выходе: вспышка оттуда, куда она шла */
  .boom{position:fixed;left:0;top:0;z-index:29;pointer-events:none}
  /* кольцо тёплое и толстое: тонкое белое на светлом поле не видно */
  .boom b{
    position:absolute;border-radius:50%;border:7px solid rgba(255,150,40,.95);
    box-shadow:0 0 18px rgba(255,190,90,.75),inset 0 0 14px rgba(255,220,150,.6);
    animation:boom-ring .62s cubic-bezier(.2,.8,.3,1) forwards;
  }
  .boom i{
    position:absolute;border-radius:50%;
    box-shadow:0 0 10px rgba(255,255,255,.9),0 1px 3px rgba(74,48,23,.35);
    animation:boom-dot .9s cubic-bezier(.15,.7,.3,1) forwards;
  }
  @keyframes boom-ring{
    from{transform:translate(-50%,-50%) scale(.2);opacity:.95}
    to{transform:translate(-50%,-50%) scale(2.2);opacity:0}
  }
  @keyframes boom-dot{
    from{transform:translate(-50%,-50%) scale(1);opacity:1}
    to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3);opacity:0}
  }
  @media (prefers-reduced-motion:reduce){ .boom{display:none} }

  @media (prefers-reduced-motion:reduce){
    .big{animation:none}.tray i{animation:none}.maze .walker{transition:none}
    .maze .done .goal{animation:none}
  }
</style>
</head>
<body>

<script src="words.js"></script>
<script src="blocks.js"></script>

<div class="top">
  <div class="stars" id="stars"></div>
  <button class="btn" id="btnNew" aria-label="Новый лабиринт">
    <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 5v6h-6"/></svg>
  </button>
  <a class="btn" href="index.html" aria-label="Домой">
    <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
  </a>
</div>

<div class="stage">
  <div class="tray" id="tray"></div>
  <svg class="maze" id="maze" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="say" id="say"></div>
</div>

<div class="veil" id="veil">
  <div class="panel">
    <h1>Labyrinth</h1>
    <div class="ru">Дорожка с картинками</div>
    <div class="tip">Веди пальцем по дорожке. Картинки прячутся в тупиках: за каждой надо свернуть, и каждая называет себя по-немецки. Выход откроется, когда соберёшь все</div>
    <div class="sizes" id="sizes"></div>
    <button class="big" id="btnStart" aria-label="Играть">
      <svg viewBox="0 0 24 24"><path d="M8 4.8v14.4L20 12z"/></svg>
    </button>
  </div>
</div>

<div class="boom" id="boom"></div>
<div class="party" id="party"></div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const YW = window.YEVA_WORDS;
  if (!YW || !YW.slug) {
    document.body.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif">' +
      'Нужен words.js</div>';
    return;
  }

  const CFG = { goal: 5, voice: 'voice/de/' };
  // сложность — это примерное число клеток, а не размер экрана
  const LEVELS = [{ n: 60, t: 'просто' }, { n: 110, t: 'средне' }, { n: 180, t: 'сложно' }];
  const K_SIZE = 'yeva.labyrinth.size';
  const PAD = 0.12;                      // поля, чтобы стены не срезались
  const WORDS = (YW.pictured && YW.pictured.length ? YW.pictured : YW.unique.filter(a => a.e));

  const irand = n => Math.floor(Math.random() * n);
  const pick = a => a[irand(a.length)];

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  let want = 110;            // выбранная сложность: сколько примерно клеток
  let COLS = 7, ROWS = 7;    // сам лабиринт — прямоугольный, по экрану
  let cells = [];            // стены каждой клетки
  let cur = { x: 0, y: 0 };  // где фигурка
  let exitAt = 0;            // клетка выхода
  let path = [];             // след, по которому она прошла
  let items = [];            // что разложено по дороге
  let got = 0;               // сколько собрано
  let done = 0;              // сколько лабиринтов пройдено
  let busy = true;           // в конце и на старте ход закрыт

  /* ── звук ── */
  let actx = null, master = null;
  const vBuf = {}, vBad = {}, vHot = {};

  function initAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.32;
    master.connect(actx.destination);
  }

  const vUrl = w => CFG.voice + YW.slug(w) + '.mp3';

  function load(w) {
    if (!actx || !w) return;
    const u = vUrl(w);
    if (vBuf[u] || vBad[u] || vHot[u]) return;
    vHot[u] = 1;
    // отказ 404 браузер помнит, поэтому второй заход мимо кэша
    fetch(u)
      .then(r => r.ok ? r : fetch(u + '?v=' + Date.now(), { cache: 'no-store' }))
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(ab => actx.decodeAudioData(ab))
      .then(buf => { vBuf[u] = buf; })
      .catch(e => { vBad[u] = true; console.warn('[voice] нет ' + u + ' — ' + e.message); });
  }

  function say(w) {
    if (!w) return;
    load(w);
    const u = vUrl(w);
    let tries = 0;
    (function wait() {
      if (vBuf[u]) {
        const src = actx.createBufferSource(), g = actx.createGain();
        g.gain.value = 1.25;
        src.buffer = vBuf[u];
        src.connect(g); g.connect(master);
        src.start();
        return;
      }
      if (vBad[u]) { speak(w); return; }
      if (tries++ < 10) { setTimeout(wait, 120); return; }
      speak(w);
    })();
  }

  // пока записи нет — читает системный голос, чтобы игра не молчала
  function speak(w) {
    try {
      if (typeof speechSynthesis === 'undefined') return;
      speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(w.de);
      ut.lang = 'de-DE'; ut.rate = 0.9; ut.pitch = 1.1;
      speechSynthesis.speak(ut);
    } catch (e) {}
  }

  function tone(type, freq, at2, dur, vol, to) {
    if (!actx) return;
    const t = actx.currentTime + at2;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur * 0.9);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  }
  const ding = () => [0, 7].forEach((n, i) => tone('triangle', 659.25 * Math.pow(2, n / 12), i * 0.06, 0.3, 0.26));
  const yay = () => [0, 4, 7, 12].forEach((n, i) => tone('triangle', 523.25 * Math.pow(2, n / 12), i * 0.07, 0.4, 0.3));
  const fanfare = () => [0, 4, 7, 12, 7, 12, 16].forEach((n, i) => tone('triangle', 392 * Math.pow(2, n / 12), i * 0.12, 0.42, 0.33));
  const buzz = p2 => { try { navigator.vibrate && navigator.vibrate(p2); } catch (e) {} };

  /* ── лабиринт ──
     Между любыми двумя клетками ровно одна дорога: тупики есть, колец нет.
     Так ребёнок не может закружиться, а ошибка всегда поправима — просто
     вернись назад. */
  const N_W = 1, E_W = 2, S_W = 4, W_W = 8;
  const DIRS = [
    { dx: 0, dy: -1, w: N_W, o: S_W },
    { dx: 1, dy: 0, w: E_W, o: W_W },
    { dx: 0, dy: 1, w: S_W, o: N_W },
    { dx: -1, dy: 0, w: W_W, o: E_W }
  ];
  const at = (x, y) => y * COLS + x;
  const inside = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;

  // Сколько клеток: столько, сколько просит выбранная сложность, а не
  // сколько влезет. Иначе на планшете поле раздувалось само по себе —
  // сложность должна зависеть от кнопки, а не от того, какой экран.
  // Форма подстраивается под экран: на телефоне высокий прямоугольник,
  // на планшете пошире.
  function shape() {
    const stage = document.querySelector('.stage');
    const other = ($('tray').offsetHeight || 38) + ($('say').offsetHeight || 28) + 26;
    const bw = Math.max(160, stage.clientWidth || 320);
    const bh = Math.max(160, (stage.clientHeight || 520) - other);
    const r = Math.max(0.5, Math.min(2.6, bh / bw));     // вытянутость экрана
    let c = Math.round(Math.sqrt(want / r));
    c = Math.max(5, Math.min(14, c));
    COLS = c;
    ROWS = Math.max(5, Math.min(24, Math.round(c * r)));
  }

  // Лабиринт растим «по Прима»: берём случайную стену на границе уже
  // прорытого и ломаем её. Обход в глубину давал длинные коридоры с
  // редкими развилками — по такому не заблудишься, идёшь и идёшь.
  // Здесь развилок и тупиков втрое больше при том же числе клеток.
  function dig() {
    const n = COLS * ROWS;
    cells = new Array(n).fill(N_W | E_W | S_W | W_W);
    const seen = new Array(n).fill(false);
    const edge = [];                                     // стены на границе
    const push = (x, y) => {
      seen[at(x, y)] = true;
      DIRS.forEach(d => {
        const nx = x + d.dx, ny = y + d.dy;
        if (inside(nx, ny) && !seen[at(nx, ny)]) edge.push({ x: x, y: y, d: d });
      });
    };
    push(0, 0);
    while (edge.length) {
      const k = irand(edge.length);
      const e = edge[k];
      edge[k] = edge[edge.length - 1];
      edge.pop();
      const nx = e.x + e.d.dx, ny = e.y + e.d.dy;
      if (!inside(nx, ny) || seen[at(nx, ny)]) continue;
      cells[at(e.x, e.y)] &= ~e.d.w;
      cells[at(nx, ny)] &= ~e.d.o;
      push(nx, ny);
    }
  }

  // сколько у клетки открытых сторон
  function ways(i) {
    let k = 0;
    DIRS.forEach(d => { if (!(cells[i] & d.w)) k++; });
    return k;
  }

  // Выход — самая дальняя от старта клетка нижнего ряда. Просто «самая
  // дальняя» ставила его куда попало посреди поля; внизу он понятнее —
  // идём сверху вниз, — а дорога всё равно выходит длинной и каждый раз
  // другой, потому что дальняя клетка в нижнем ряду каждый раз своя.
  function longest() {
    const n = COLS * ROWS;
    const from = new Array(n).fill(-1);
    const dist = new Array(n).fill(-1);
    const q = [0];
    from[0] = 0; dist[0] = 0;
    while (q.length) {
      const i = q.shift();
      const x = i % COLS, y = (i - x) / COLS;
      DIRS.forEach(d => {
        if (cells[i] & d.w) return;
        const nx = x + d.dx, ny = y + d.dy;
        if (!inside(nx, ny) || dist[at(nx, ny)] >= 0) return;
        from[at(nx, ny)] = i;
        dist[at(nx, ny)] = dist[i] + 1;
        q.push(at(nx, ny));
      });
    }
    let best = at(0, ROWS - 1);
    for (let x = 0; x < COLS; x++) {
      const i2 = at(x, ROWS - 1);
      if (dist[i2] > dist[best]) best = i2;
    }
    const road = [];
    let i = best;
    while (i !== 0) { road.push(i); i = from[i]; }
    road.push(0);
    road.reverse();
    return { exit: best, road: road };
  }

  /* ── картинки ──
     Раньше они лежали на верной дороге и работали подсказкой: иди за
     картинками — придёшь к выходу, свернуть некуда. Теперь наоборот:
     они прячутся в тупиках в стороне от дороги. За каждой надо свернуть
     и вернуться, то есть выбор «туда или не туда» наконец появляется. */
  function layItems(road) {
    const n = COLS * ROWS;
    const onRoad = {};
    road.forEach(i => { onRoad[i] = 1; });

    const ends = [], side = [];
    for (let i = 0; i < n; i++) {
      if (onRoad[i] || i === 0) continue;
      (ways(i) === 1 ? ends : side).push(i);
    }
    // Тупики в стороне от дороги — то, что нужно: за картинкой приходится
    // свернуть и вернуться. Берём сначала их и только потом, если не
    // хватило, прочие клетки и саму дорогу. Порядок важен: если смешать
    // всё в кучу, выбор «подальше друг от друга» вытаскивает проходные
    // клетки, и сворачивать становится некуда.
    const tiers = [ends, side, road.slice(1, road.length - 1)];
    const want2 = Math.max(4, Math.min(8, Math.round(n / 18)));
    const count = Math.min(want2, ends.length + side.length + Math.max(0, road.length - 2));

    const chosen = [];
    const far = (i) => {
      const x = i % COLS, y = (i - x) / COLS;
      let d = 1e9;
      chosen.forEach(j => {
        const jx = j % COLS, jy = (j - jx) / COLS;
        d = Math.min(d, Math.abs(x - jx) + Math.abs(y - jy));
      });
      return d;
    };

    // внутри одного разряда разносим места подальше друг от друга
    tiers.forEach(tier => {
      const pool = tier.slice();
      while (chosen.length < count && pool.length) {
        let best = 0;
        if (chosen.length) {
          let bd = -1;
          for (let k = 0; k < pool.length; k++) {
            const d = far(pool[k]);
            if (d > bd) { bd = d; best = k; }
          }
        } else {
          best = irand(pool.length);
        }
        chosen.push(pool[best]);
        pool.splice(best, 1);
      }
    });

    const used = {}, bag = [];
    let guard = 0;
    while (bag.length < chosen.length && guard++ < 400) {
      const w = pick(WORDS);
      if (used[w.de]) continue;
      used[w.de] = 1; bag.push(w);
    }

    items = chosen.map((i, k) => ({ cell: i, word: bag[k], got: false }));
  }

  /* ── рисование ── */
  function draw() {
    const m = $('maze');
    m.setAttribute('viewBox', -PAD + ' ' + -PAD + ' ' + (COLS + PAD * 2) + ' ' + (ROWS + PAD * 2));

    let walls = '';
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const c = cells[at(x, y)];
        if (c & N_W) walls += 'M' + x + ' ' + y + 'h1';
        if (c & W_W) walls += 'M' + x + ' ' + y + 'v1';
        if (x === COLS - 1 && (c & E_W)) walls += 'M' + (x + 1) + ' ' + y + 'v1';
        if (y === ROWS - 1 && (c & S_W)) walls += 'M' + x + ' ' + (y + 1) + 'h1';
      }
    }

    const ex = exitAt % COLS, ey = (exitAt - ex) / COLS;
    let h = '<rect class="floor" x="0" y="0" width="' + COLS + '" height="' + ROWS + '" rx="0.1"/>' +
            '<circle class="goal" id="goal" cx="' + (ex + 0.5) + '" cy="' + (ey + 0.5) + '" r="0.33"/>' +
            '<text class="goalnum" id="goalnum" x="' + (ex + 0.5) + '" y="' + (ey + 0.52) + '"></text>' +
            '<path class="trail" id="trail" d=""/>' +
            '<path class="walls" d="' + walls + '"/>';

    items.forEach((it, k) => {
      const x = it.cell % COLS, y = (it.cell - x) / COLS;
      h += '<text class="item" id="it' + k + '" x="' + (x + 0.5) + '" y="' + (y + 0.52) + '">' +
           it.word.e + '</text>';
    });

    // фигурка — тот же кубик с лицом, что и в счётных играх
    const inner = window.YEVA_BLOCKS ? YEVA_BLOCKS.svg(1) : '<circle cx="50" cy="50" r="40" fill="#E8782F"/>';
    h += '<g class="walker" id="walker"><svg width="0.78" height="0.78" viewBox="0 0 100 100" ' +
         'preserveAspectRatio="xMidYMid meet" overflow="visible">' + inner + '</svg></g>';

    m.innerHTML = h;
    place(true);
    resize();
  }

  // фигурка стоит в середине своей клетки
  function place(instant) {
    const w = $('walker');
    if (!w) return;
    if (instant) w.style.transition = 'none';
    w.style.transform = 'translate(' + (cur.x + 0.11) + 'px,' + (cur.y + 0.11) + 'px)';
    if (instant) { void w.getBoundingClientRect(); w.style.transition = ''; }
  }

  function paintTrail() {
    const t = $('trail');
    if (!t) return;
    t.setAttribute('d', path.map((p2, i) => (i ? 'L' : 'M') + (p2.x + 0.5) + ' ' + (p2.y + 0.5)).join(''));
  }

  function paintTray() {
    let h = '';
    items.forEach(it => {
      h += it.got ? '<i>' + it.word.e + '</i>' : '<i class="wait">·</i>';
    });
    $('tray').innerHTML = h;
  }

  // Выход заперт, пока не собраны все картинки, и показывает, сколько
  // осталось. Сами картинки видны на поле с самого начала — это не
  // слепой поиск, а выбор дороги.
  const left = () => items.length - got;

  function paintGoal() {
    const g = $('goal'), t = $('goalnum');
    if (!g || !t) return;
    const n = left();
    g.classList.toggle('lock', n > 0);
    g.classList.toggle('ready', n === 0);
    t.textContent = n > 0 ? String(n) : '';
  }

  function paintStars() {
    let h = '';
    for (let i = 0; i < CFG.goal; i++) h += '<i class="' + (i < done ? 'on' : '') + '"></i>';
    $('stars').innerHTML = h;
  }

  // поле занимает всё свободное место, сохраняя клетки квадратными
  function resize() {
    const m = $('maze');
    const stage = document.querySelector('.stage');
    const other = $('tray').offsetHeight + $('say').offsetHeight + 26;
    const bw = Math.max(140, stage.clientWidth);
    const bh = Math.max(140, stage.clientHeight - other);
    const k = Math.min(bw / (COLS + PAD * 2), bh / (ROWS + PAD * 2));
    m.style.width = Math.floor((COLS + PAD * 2) * k) + 'px';
    m.style.height = Math.floor((ROWS + PAD * 2) * k) + 'px';
  }

  // где на экране середина клетки
  function cellPoint(i) {
    const r = $('maze').getBoundingClientRect();
    const unit = r.width / (COLS + PAD * 2);
    const x = i % COLS, y = (i - x) / COLS;
    return { x: r.left + (x + PAD + 0.5) * unit, y: r.top + (y + PAD + 0.5) * unit };
  }

  /* ── ход ── */
  function stepTo(nx, ny) {
    cur = { x: nx, y: ny };
    path.push({ x: nx, y: ny });
    paintTrail();
    place(false);

    const k = items.findIndex(it => !it.got && it.cell === at(nx, ny));
    if (k >= 0) {
      items[k].got = true;
      got++;
      const el = $('it' + k);
      if (el) el.classList.add('got');
      ding(); buzz(18);
      $('say').textContent = items[k].word.de;
      say(items[k].word);
      paintTray();
      paintGoal();
      if (!left()) {                      // последняя — выход открылся
        tone('triangle', 784, 0, 0.3, 0.26);
        tone('triangle', 1046.5, 0.12, 0.4, 0.24);
      }
    }

    if (at(nx, ny) === exitAt) {
      if (left()) knock(); else finish();
    }
  }

  // пришла к выходу рано: мягко показываем, чего не хватает
  let knockAt = 0;
  function knock() {
    if (Date.now() - knockAt < 900) return;
    knockAt = Date.now();
    tone('sine', 320, 0, 0.14, 0.18, 260);
    buzz(25);
    const tray = $('tray');
    tray.classList.remove('shake');
    void tray.offsetWidth;
    tray.classList.add('shake');
    $('say').textContent = 'ещё ' + left();
  }

  // один шаг в сторону пальца, если между клетками нет стены
  function toward(tx, ty) {
    const i = at(cur.x, cur.y);
    let best = null, bestD = Math.abs(tx - cur.x) + Math.abs(ty - cur.y);
    DIRS.forEach(d => {
      if (cells[i] & d.w) return;                       // стена
      const nx = cur.x + d.dx, ny = cur.y + d.dy;
      if (!inside(nx, ny)) return;
      const dist = Math.abs(tx - nx) + Math.abs(ty - ny);
      if (dist < bestD) { bestD = dist; best = { x: nx, y: ny }; }
    });
    return best;
  }

  function drag(e) {
    if (busy) return;
    const m = $('maze');
    const r = m.getBoundingClientRect();
    const t = (e.touches && e.touches[0]) || e;
    if (!r.width || !t || t.clientX == null) return;
    const unit = r.width / (COLS + PAD * 2);
    const tx = Math.floor((t.clientX - r.left) / unit - PAD);
    const ty = Math.floor((t.clientY - r.top) / unit - PAD);
    if (!inside(tx, ty)) return;

    // палец мог уехать на несколько клеток: идём за ним, пока открыто
    let guard = 0;
    while (guard++ < 5 && (tx !== cur.x || ty !== cur.y)) {
      const next = toward(tx, ty);
      if (!next) break;
      stepTo(next.x, next.y);
      if (busy) break;                                  // дошли до выхода
    }

    // глаза смотрят на палец
    if (window.YEVA_BLOCKS && YEVA_BLOCKS.look) {
      const w = $('walker');
      const svg = w && w.querySelector('.nblock');
      if (svg) YEVA_BLOCKS.look(svg, t.clientX, t.clientY);
    }
  }

  $('maze').addEventListener('pointerdown', e => { initAudio(); drag(e); }, { passive: true });
  $('maze').addEventListener('pointermove', e => {
    if (e.buttons || e.pointerType === 'touch') drag(e);
  }, { passive: true });

  /* ── салют ── */
  const COLORS = ['#FFD86E', '#E8782F', '#8FD3FF', '#7FC8A9', '#F0A24B'];

  // вспышка прямо на выходе: там, куда она шла
  function boom(x, y) {
    const box = $('boom');
    box.innerHTML = '';
    box.style.left = Math.round(x) + 'px';
    box.style.top = Math.round(y) + 'px';

    // два кольца подряд — хлопок читается как хлопок, а не как блик
    const d = Math.round(Math.min(window.innerWidth, window.innerHeight) * 0.3);
    [0, 0.14].forEach(delay => {
      const ring = document.createElement('b');
      ring.style.width = ring.style.height = Math.round(d * (delay ? 0.62 : 1)) + 'px';
      ring.style.animationDelay = delay + 's';
      box.appendChild(ring);
    });

    for (let i = 0; i < 34; i++) {
      const dot = document.createElement('i');
      const ang = Math.random() * Math.PI * 2;
      const dist = d * (0.45 + Math.random() * 0.95);
      const sz = Math.max(7, Math.round(d * (0.05 + Math.random() * 0.08)));
      dot.style.width = dot.style.height = sz + 'px';
      dot.style.background = COLORS[i % COLORS.length];
      dot.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(0) + 'px');
      dot.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(0) + 'px');
      dot.style.animationDelay = (Math.random() * 0.12).toFixed(2) + 's';
      box.appendChild(dot);
    }
    setTimeout(() => { box.innerHTML = ''; }, 1200);
  }

  function confetti(n) {
    const box = $('party');
    for (let i = 0; i < n; i++) {
      const c = document.createElement('i');
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.background = COLORS[i % COLORS.length];
      c.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
      c.style.animationDelay = (Math.random() * 0.6) + 's';
      box.appendChild(c);
    }
    setTimeout(() => { box.innerHTML = ''; }, 4200);
  }

  /* ── конец лабиринта ── */
  function finish() {
    busy = true;
    $('maze').classList.add('done');
    yay(); buzz([20, 50, 20]);

    const g = cellPoint(exitAt);
    boom(g.x, g.y);                     // салют на каждом выходе
    confetti(46);

    const w = $('walker');
    const svg = w && w.querySelector('.nblock');
    if (svg && window.YEVA_BLOCKS) YEVA_BLOCKS.react(svg, 'dance');

    done++;
    paintStars();
    $('say').textContent = got + ' из ' + items.length;

    if (done >= CFG.goal) { setTimeout(party, 1000); return; }
    setTimeout(build, 2300);
  }

  // пятый лабиринт — салют подлиннее, с фанфарами
  function party() {
    fanfare(); buzz([20, 60, 20, 60, 40]);
    confetti(80);
    done = 0;
    paintStars();
    setTimeout(build, 3200);
  }

  /* ── новый лабиринт ── */
  function build() {
    $('maze').classList.remove('done');
    $('boom').innerHTML = '';
    cur = { x: 0, y: 0 };
    path = [{ x: 0, y: 0 }];
    got = 0;
    shape();
    dig();
    const far = longest();
    exitAt = far.exit;
    layItems(far.road);
    draw();
    paintTray();
    paintGoal();
    paintTrail();
    resize();
    $('say').textContent = '';
    items.forEach(it => load(it.word));
    busy = false;
  }

  /* ── выбор размера ── */
  function paintSizes() {
    $('sizes').innerHTML = LEVELS.map(l =>
      '<button class="size' + (l.n === want ? ' on' : '') + '" data-s="' + l.n + '">' +
      l.t + '</button>').join('');
  }
  $('sizes').addEventListener('click', e => {
    const b = e.target.closest('.size');
    if (!b) return;
    want = +b.dataset.s;
    store.set(K_SIZE, String(want));
    paintSizes();
    initAudio();
    tone('sine', 700, 0, 0.08, 0.16, 1000);
  });

  /* ── старт ── */
  function goFullscreen() {
    // Установленная игра и так во весь экран. Запрос полноэкранного режима
    // добавляет только системную подсказку «проведите сверху вниз и нажмите
    // Назад» — ребёнок её не уберёт, а она закрывает нижний ряд.
    try {
      if ((window.matchMedia && (matchMedia('(display-mode: fullscreen)').matches ||
           matchMedia('(display-mode: standalone)').matches)) || navigator.standalone) return;
    } catch (e) {}
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!fn || document.fullscreenElement) return;
    try {
      const p2 = fn.call(el, { navigationUI: 'hide' });
      if (p2 && p2.catch) p2.catch(() => {});
    } catch (e) {}
  }

  $('btnStart').addEventListener('click', () => {
    goFullscreen();
    initAudio();
    $('veil').classList.add('hidden');
    done = 0;
    paintStars();
    setTimeout(build, 60);        // экран уже без заслонки — мерим по-настоящему
  });
  $('btnNew').addEventListener('click', () => { initAudio(); build(); });

  let lastH = 0;
  function relayout() {
    [0, 120, 350, 800].forEach(ms => setTimeout(() => {
      const h = window.innerHeight;
      if (ms && h === lastH) return;
      lastH = h;
      resize();
    }, ms));
  }
  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', relayout);
  document.addEventListener('fullscreenchange', relayout);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', relayout);

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && actx && actx.state === 'suspended') actx.resume();
  });

  want = LEVELS.some(l => l.n === +store.get(K_SIZE, 110)) ? +store.get(K_SIZE, 110) : 110;
  paintSizes();
  paintStars();
  build();
  busy = true;            // до нажатия «играть» ход закрыт
})();
</script>
<script src="install.js"></script>
<script src="console.js"></script>
</body>
